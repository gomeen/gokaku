<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Gogaku 英文补全效果演示</title>
<!--
  可丢弃原型：普通模式英文（临时英文／按应用默认英文）下的当前词补全交互。
  打开页面自动播放一段打邮件的演示，也可切换手动体验。
  不代表输入法实现、宿主兼容性或性能已验证。
  词表为 resources/english-words.txt 全量 5 万词（SCOWL en_US size≤60 × wordfreq 词频排序，
  许可见 resources/licenses/），内嵌于 WORDS 常量；替换词表时重新嵌入该文件即可。
  补全逻辑集中在 EnglishCompletion 模块（纯函数，不碰 DOM），页面只是外壳。
-->
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#253b37;background:#f4f6f2;font-size:15px;line-height:1.6}
*{box-sizing:border-box}body{margin:0}
main{max-width:780px;margin:30px auto;padding:0 20px 60px}
h1{font-size:24px;margin:6px 0 4px}
.sub{color:#4d5f59;font-size:15px;margin:4px 0 18px}
.eyebrow{font-size:12px;letter-spacing:2px;color:#386958}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:flex;gap:4px}
button{font:inherit;font-size:14px;color:inherit;border:1px solid #ccd6cd;background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer}
button:hover{background:#edf4ed}
.seg button[aria-pressed=true]{background:#12996a;color:#fff;border-color:#12996a}
.playbtn{background:#12996a;color:#fff;border-color:#12996a;font-size:15px;padding:8px 18px}
.playbtn:hover{background:#0f7d56}
.window{background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(30,40,35,.12),0 0 0 .5px rgba(0,0,0,.08);overflow:hidden}
.titlebar{display:flex;align-items:center;gap:8px;background:#f6f4ee;padding:10px 14px;border-bottom:1px solid #e8e4d8}
.dot{width:12px;height:12px;border-radius:50%}
.titlebar .t{margin-left:8px;font-size:13px;color:#6b6b60}
.hostwrap{position:relative}
.host{min-height:240px;padding:22px 26px;outline:none;white-space:pre-wrap;word-break:break-word;cursor:text;font-size:21px;line-height:1.9;font-family:-apple-system,"PingFang SC",sans-serif}
.host:focus{box-shadow:inset 0 0 0 3px #9fd6bf}
.caret{display:inline-block;width:2px;height:1.15em;background:#12996a;vertical-align:-.18em;margin:0 -1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.marked{text-decoration:underline;text-decoration-color:#7f9d8e;text-underline-offset:5px}
.ghost{color:#a3aaa6}
.ghost kbd{margin-left:5px;font-size:12px;color:#7b8a83;vertical-align:2px}
.strip{position:absolute;z-index:30;display:flex;gap:2px;background:#fff;border-radius:10px;padding:5px;box-shadow:0 3px 14px rgba(30,40,35,.25),0 0 0 .5px rgba(0,0,0,.1);white-space:nowrap}
.strip .it{display:flex;align-items:baseline;gap:6px;padding:4px 12px;border-radius:5px;font-size:17px;color:#3c3c3c}
.strip .it .n{font-size:12px;color:#757575}
.strip .it.first{background:#12996a;color:#fff}.strip .it.first .n{color:#e3f5ec}
.strip .it kbd{font-size:11px;background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;padding:0 4px;border-radius:3px;font-family:ui-monospace,Menlo,monospace}
.strip .pred{align-self:center;font-size:12px;color:#8a6d1f;padding:0 6px;white-space:nowrap}
.cwin{position:absolute;z-index:30;background:#fff;border-radius:10px;padding:8px;min-width:200px;box-shadow:0 3px 14px rgba(30,40,35,.25),0 0 0 .5px rgba(0,0,0,.1)}
.cwin .pre{font-size:14px;color:#6b6b6b;padding:0 0 6px 2px}
.cwin .r{display:flex;align-items:baseline;height:34px;padding:7px 10px;border-radius:4px;font-size:16px;color:#3c3c3c}

.cwin .r.first{background:#12996a;color:#fff;margin-right:-4px}.cwin .r.first .n{color:#e3f5ec}
.caption{min-height:74px;display:flex;align-items:center;gap:12px;background:#fff8e8;border:1px solid #ecdfc0;border-radius:12px;padding:14px 18px;margin-top:16px;font-size:16.5px;line-height:1.6}
.caption .step{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#e8b64c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.caption kbd{font-size:13px;border:1px solid #d8c9a0;border-radius:4px;padding:1px 6px;background:#fff;font-family:ui-monospace,Menlo,monospace}
.manualhint{display:none;margin-top:10px;font-size:13.5px;color:#62736d;text-align:center}
.manualhint.show{display:block}
.footnote{margin-top:22px;font-size:13px;color:#62736d;border-top:1px solid #dce3db;padding-top:12px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">GOGAKU · 效果演示（原型）</div>
  <h1>打前几个字母，提示整个英文单词</h1>
  <p class="sub">在英文模式下，输入 <b>hel</b>，输入法提示 <b>help</b>，按 <b>Tab</b> 就补全。不想用建议时照常打字，什么都不影响。</p>
  <div class="controls">
    <div class="seg" id="seg"></div>
    <div class="seg">
      <button class="playbtn" id="playBtn">▶ 播放演示</button>
      <button id="manualBtn">✍️ 自己试试</button>
    </div>
  </div>
  <div class="window">
    <div class="titlebar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="t">备忘录 — 给 Tom 的邮件（模拟）</span></div>
    <div class="hostwrap" id="hostwrap">
      <div class="host" id="host" tabindex="0" aria-label="模拟邮件输入区"></div>
      <div id="overlay"></div>
    </div>
  </div>
  <div class="caption"><span class="step" id="stepNo">1</span><span id="captionText"></span></div>
  <div class="manualhint" id="manualHint">现在可以直接打字了：<kbd>Tab</kbd> 接受第一个建议，<kbd>⌥1</kbd>/<kbd>⌥2</kbd>/<kbd>⌥3</kbd> 选其他建议，也可以点击建议。空格、标点、退格都照常。</div>
  <p class="footnote">这是浏览器里的效果演示，不是已经实现的输入法功能。词表用的是 Gogaku 随包的真实 5 万英文词（按词频排序）；「上文预测」里的搭配是手写示例数据，不代表已有真实预测模型。终端、编辑器等应用里 Tab 另有用途，正式方案会默认不在这些应用里启用补全。</p>
</main>
<script>
// ===== EnglishCompletion：纯逻辑模块，不碰 DOM（验证后可搬进共享核心） =====
const EnglishCompletion = (() => {
  const isLetter = ch => /^[A-Za-z]$/.test(ch);
  const BOUNDARY = /^[ \t\n.,;:!?()\[\]{}"'<>\/\\-]$/;

  // 保留用户已输入的大小写：Hel → Hello，HEL → HELLO。
  function matchCase(prefix, word) {
    if (prefix.length >= 2 && /[A-Z]/.test(prefix) && prefix === prefix.toUpperCase()) return word.toUpperCase();
    if (/^[A-Z]/.test(prefix)) return word[0].toUpperCase() + word.slice(1);
    return word;
  }

  // 词表已按词频排序：取前 n 个以 prefix 开头且更长的词（与共享核心 findPrefix 同规则）。
  function suggest(words, prefix, n) {
    const p = prefix.toLowerCase();
    const out = [];
    for (const w of words) {
      if (w.length > p.length && w.startsWith(p)) {
        out.push(matchCase(prefix, w));
        if (out.length >= n) break;
      }
    }
    return out;
  }

  const initial = () => ({ word: '', marked: '', trusted: true, dismissed: false, why: '新输入区，光标在词边界' });

  // 方案 D：根据上文预测下一个词。数据为手写示例（bigram／trigram 搭配表），
  // 只用于演示交互；正式实现需要真实搭配频率数据。
  function predictNext(table, beforeText) {
    const words = (beforeText || '').toLowerCase().match(/[a-z']+/g) || [];
    if (!words.length) return [];
    const two = words.slice(-2).join(' ');
    const one = words[words.length - 1];
    return (table[two] || table[one] || []).slice(0, 3);
  }

  function suggestionsFor(s, ctx) {
    if (!ctx.enabled) return [];
    if (ctx.scheme === 'A') return s.marked.length >= ctx.minLen ? suggest(ctx.words, s.marked, 3) : [];
    if (!s.trusted || s.dismissed) return [];
    if (ctx.scheme === 'D') {
      const predicted = predictNext(ctx.predictions, ctx.beforeText);
      // 词边界：一个字母都没打，直接给出上文预测。
      if (!s.word) return predicted;
      if (s.word.length < ctx.minLen) return [];
      // 开始打字后：预测词里匹配前缀的优先，其余按全局词频补足。
      const p = s.word.toLowerCase();
      const hits = predicted.filter(w => w.length > p.length && w.startsWith(p));
      for (const w of suggest(ctx.words, s.word, 3)) {
        if (!hits.includes(w)) hits.push(w);
      }
      return hits.slice(0, 3);
    }
    if (s.word.length < ctx.minLen) return [];
    return suggest(ctx.words, s.word, ctx.scheme === 'C' ? 1 : 3);
  }

  const result = (state, extra) => Object.assign({ state, insert: '', passKey: null, consumed: false, note: '' }, extra);

  function accept(s, full, ctx) {
    const typed = ctx.scheme === 'A' ? s.marked : s.word;
    // 方案 D 的词边界预测：整词上屏并自动补空格，紧接着预测下一个词。
    if (ctx.scheme === 'D' && !typed) {
      return result({ ...s, word: '', trusted: true, dismissed: false, why: '接受了预测，继续猜下一个词' },
        { insert: full + ' ', consumed: true, note: `接受预测「${full}」并补空格` });
    }
    const tail = ctx.scheme === 'A' ? full : full.slice(typed.length);
    const insert = tail + (ctx.autoSpace ? ' ' : '');
    return result(
      { ...s, word: ctx.autoSpace ? '' : full, marked: '', trusted: true, dismissed: !ctx.autoSpace,
        why: ctx.autoSpace ? '接受后补了空格，处于词边界' : '已接受补全，本词不再提示' },
      { insert, consumed: true,
        note: ctx.scheme === 'A' ? `上屏「${full}」` : `接受「${full}」，只补「${tail}」${ctx.autoSpace ? '＋空格' : ''}` });
  }

  const untrusted = (s, why) => ({ ...s, word: '', trusted: false, dismissed: false, why });
  const boundary = (s, why) => ({ ...s, word: '', trusted: true, dismissed: false, why });

  // 方案 B／C：直输。字母立即交给宿主，输入法只在内存里跟踪当前词。
  function dispatchDirect(s, key, ctx) {
    if (!ctx.enabled) return result(untrusted(s, '此应用未启用补全，按键全部直输'), { passKey: key });
    const sug = suggestionsFor(s, ctx);
    switch (key.type) {
      case 'char': {
        const ch = key.ch;
        if (isLetter(ch) || (ch === "'" && s.word)) {
          if (!s.trusted) return result(s, { passKey: key });
          return result({ ...s, word: s.word + ch, why: '正在跟踪当前词' }, { passKey: key });
        }
        if (BOUNDARY.test(ch)) return result(boundary(s, ch === ' ' ? '刚输入空格，处于词边界' : '刚输入标点，处于词边界'), { passKey: key });
        return result(untrusted(s, '数字或符号（如 _ @ 1），等下一个空格或标点'), { passKey: key });
      }
      case 'backspace':
        if (s.trusted && s.word) {
          const word = s.word.slice(0, -1);
          return result({ ...s, word, dismissed: word ? s.dismissed : false, why: '退格，当前词同步缩短' }, { passKey: key });
        }
        return result(untrusted(s, '退格删进了前面的文字，输入法看不到那里有什么'), { passKey: key });
      case 'tab':
        if (ctx.acceptKey === 'tab' && sug.length) return accept(s, sug[0], ctx);
        return result(untrusted(s, 'Tab 交给宿主，宿主可能改了文字（缩进／补全）'), { passKey: key, note: '没有建议，Tab 照常交给宿主' });
      case 'option':
        if (sug.length >= key.n) return accept(s, sug[key.n - 1], ctx);
        return result(untrusted(s, 'Option＋数字交给宿主，打出了特殊字符'), { passKey: key });
      case 'esc':
        if (sug.length) return result({ ...s, dismissed: true, why: 'Esc 关闭本词提示，到下一个词恢复' }, { passKey: key, note: '关闭建议，Esc 仍交给宿主（vim 需要它）' });
        return result(s, { passKey: key });
      case 'enter':
        return result(boundary(s, '换行，处于词边界'), { passKey: key });
      case 'arrow':
      case 'click':
        return result(untrusted(s, key.type === 'click' ? '鼠标移动了光标' : '方向键移动了光标'), { passKey: key });
    }
    return result(s, { passKey: key });
  }

  // 方案 A：组合式。字母先停在输入法里，空格／标点时上屏。
  function dispatchCompose(s, key, ctx) {
    if (!ctx.enabled) return result({ ...s, marked: '', why: '此应用未启用补全，按键全部直输' }, { passKey: key });
    const m = s.marked;
    const sug = suggestionsFor(s, ctx);
    const commitThenPass = (why, note) => result({ ...s, marked: '', why }, { insert: m, passKey: key, note });
    switch (key.type) {
      case 'char':
        if (isLetter(key.ch) || (key.ch === "'" && m)) return result({ ...s, marked: m + key.ch, why: '字母停在组合里，宿主还没收到' }, { consumed: true });
        if (!m) return result(s, { passKey: key });
        return commitThenPass('组合已上屏', `先上屏「${m}」，再交给宿主「${key.ch === ' ' ? '空格' : key.ch}」`);
      case 'backspace':
        if (m) return result({ ...s, marked: m.slice(0, -1), why: '退格只删组合里的字母' }, { consumed: true });
        return result(s, { passKey: key });
      case 'tab':
        if (m && sug.length) return accept(s, sug[0], ctx);
        return m ? commitThenPass('组合已上屏', `先上屏「${m}」，Tab 再交给宿主`) : result(s, { passKey: key });
      case 'option':
        if (m && sug.length >= key.n) return accept(s, sug[key.n - 1], ctx);
        return m ? commitThenPass('组合已上屏', `先上屏「${m}」`) : result(s, { passKey: key });
      case 'enter':
        if (m) return result({ ...s, marked: '', why: '组合已上屏' }, { insert: m, consumed: true, note: `Enter 只上屏「${m}」不换行（与中文模式一致），聊天框里要按两次才发送` });
        return result(s, { passKey: key });
      case 'esc':
        return m ? commitThenPass('组合已上屏', `先上屏「${m}」再交 Esc，否则 vim 里会丢字`) : result(s, { passKey: key });
      case 'arrow':
      case 'click':
        return m ? commitThenPass('组合已上屏', `先上屏「${m}」再移动光标`) : result(s, { passKey: key });
    }
    return result(s, { passKey: key });
  }

  function dispatch(s, key, ctx) {
    return ctx.scheme === 'A' ? dispatchCompose(s, key, ctx) : dispatchDirect(s, key, ctx);
  }

  // 宿主能提供光标前文字时，失去跟踪后用它重新校准当前词。
  function resync(s, before, after, ctx) {
    if (ctx.scheme === 'A' || !ctx.enabled || !ctx.canRead || s.trusted) return s;
    if (/^[A-Za-z']/.test(after)) return { ...s, why: '光标在词中间，不补全（否则会把后半截挤开）' };
    const m = before.match(/(^|[^A-Za-z0-9_@'])([A-Za-z][A-Za-z']*)$/);
    if (m) return { ...s, word: m[2], trusted: true, dismissed: false, why: `读取宿主光标前文字，校准为「${m[2]}」` };
    if (before === '' || BOUNDARY.test(before.slice(-1))) return boundary(s, '读取宿主光标前文字：处于词边界');
    return s;
  }

  return { initial, dispatch, resync, suggestionsFor, suggest, matchCase };
})();

const $ = id => document.getElementById(id);
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const VARIANTS = {
  B: '建议条（推荐）',
  A: '组合式',
  C: '行内灰字',
  D: '✨ 上文预测',
};
// 手写示例搭配数据：仅覆盖演示脚本里的几句，不是真实语言模型。
const PREDICTIONS = {
  'i': ['will', 'am', 'think'],
  'will': ['help', 'be', 'go'],
  'i will': ['help', 'be', 'go'],
  'help': ['you', 'him', 'her'],
  'will help': ['you', 'him', 'her'],
  'you': ['become', 'learn', 'find'],
  'help you': ['become', 'learn', 'find'],
  'become': ['the', 'a', 'more'],
  'the': ['dog', 'cat', 'world'],
};
let variant = new URLSearchParams(location.search).get('variant');
if (!VARIANTS[variant]) variant = 'B';
let host = { text: '', caret: 0 };
let state = EnglishCompletion.initial();
let playToken = 0;   // 每次播放／手动切换使旧播放失效
let stepCount = 0;

const ctx = () => ({ scheme: variant, words: WORDS, minLen: 2, acceptKey: 'tab', autoSpace: false, enabled: true, canRead: true, beforeText: host.text.slice(0, host.caret), predictions: PREDICTIONS });

const OPTION_CHARS = ['¡', '™', '£'];

function hostInsert(t) {
  host.text = host.text.slice(0, host.caret) + t + host.text.slice(host.caret);
  host.caret += t.length;
}

function handle(k) {
  const r = EnglishCompletion.dispatch(state, k, ctx());
  if (r.insert) hostInsert(r.insert);
  if (r.passKey) {
    switch (r.passKey.type) {
      case 'char': hostInsert(r.passKey.ch); break;
      case 'enter': hostInsert('\n'); break;
      case 'backspace': if (host.caret > 0) { host.text = host.text.slice(0, host.caret - 1) + host.text.slice(host.caret); host.caret--; } break;
      case 'option': hostInsert(OPTION_CHARS[r.passKey.n - 1]); break;
      case 'tab': hostInsert('\t'); break;
      case 'arrow': host.caret = Math.max(0, Math.min(host.text.length, host.caret + r.passKey.dir)); break;
    }
  }
  state = EnglishCompletion.resync(r.state, host.text.slice(0, host.caret), host.text.slice(host.caret), ctx());
  renderHost();
}

// ---------- 渲染 ----------
function renderHost() {
  const sug = EnglishCompletion.suggestionsFor(state, ctx());
  let html = '';
  const caretHtml = () => {
    let s = '';
    if (variant === 'A' && state.marked) s += `<span class="marked">${esc(state.marked)}</span>`;
    s += '<span class="caret" id="caret"></span>';
    if (variant === 'C' && sug.length) s += `<span class="ghost">${esc(sug[0].slice(state.word.length))}<kbd>Tab</kbd></span>`;
    return s;
  };
  for (let i = 0; i <= host.text.length; i++) {
    if (i === host.caret) html += caretHtml();
    if (i === host.text.length) break;
    html += `<span data-i="${i}">${esc(host.text[i])}</span>`;
  }
  $('host').innerHTML = html;
  renderOverlay(sug);
}

function renderOverlay(sug) {
  const ov = $('overlay');
  ov.innerHTML = '';
  if (variant === 'C' || (!sug.length && !(variant === 'A' && state.marked))) return;
  const el = document.createElement('div');
  if (variant === 'B' || variant === 'D') {
    el.className = 'strip';
    const predicting = variant === 'D' && !state.word;
    el.innerHTML = (predicting ? '<span class="pred">✨ 根据上文</span>' : '') + sug.map((w, i) => `<span class="it${i === 0 ? ' first' : ''}" data-n="${i + 1}"><span class="n">⌥${i + 1}</span>${esc(w)}${i === 0 ? '<kbd>Tab</kbd>' : ''}</span>`).join('');
  } else {
    el.className = 'cwin';
    el.innerHTML = `<div class="pre">${esc(state.marked)}</div>` +
      `<div class="r raw first"><span class="n">空格</span>${esc(state.marked)}</div>` +
      sug.map((w, i) => `<div class="r" data-n="${i + 1}"><span class="n">${i === 0 ? 'Tab' : '⌥' + (i + 1)}</span>${esc(w)}</div>`).join('');
  }
  ov.appendChild(el);
  const wrap = $('hostwrap').getBoundingClientRect();
  const cr = $('caret').getBoundingClientRect();
  el.style.left = Math.max(0, Math.min(cr.left - wrap.left - 6, wrap.width - el.offsetWidth)) + 'px';
  el.style.top = (cr.bottom - wrap.top + 6) + 'px';
}

function say(html, n) {
  if (n !== undefined) { stepCount = n; }
  $('stepNo').textContent = stepCount;
  $('captionText').innerHTML = html;
}

// ---------- 自动播放 ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));
const INITIAL_TEXT = 'Hi Tom,\n\n';

async function play() {
  const token = ++playToken;
  const alive = () => token === playToken;
  host = { text: INITIAL_TEXT, caret: INITIAL_TEXT.length };
  state = EnglishCompletion.initial();
  stepCount = 1;
  $('manualHint').classList.remove('show');
  $('playBtn').textContent = '↻ 重新播放';
  renderHost();
  let n = 0;
  const say1 = async (t, ms = 2100) => { if (!alive()) return; say(t, ++n); await sleep(ms); };
  const type = async s => {
    for (const ch of s) { if (!alive()) return; handle({ type: 'char', ch }); await sleep(140); }
  };
  const key = async k => { if (!alive()) return; handle(k); await sleep(500); };

  if (variant === 'D') {
    await say1('前面的方案都是「打了字母才提示」。这个方案更进一步：<b>根据上一个词，猜你下一个词要说什么</b>。', 2800);
    await type('I will');
    await say1('打字过程中仍然用的是前缀补全。现在按一下空格——', 1800);
    await key({ type: 'char', ch: ' ' });
    await say1('<b>一个字母都还没打</b>，输入法根据 “I will” 猜出：<b>help / be / go</b>。', 2600);
    await say1('按 <kbd>Tab</kbd> 接受 help。', 1500);
    await key({ type: 'tab' });
    await say1('<b>help</b> 上屏并自动补了空格。它接着猜：<b>you / him / her</b>。', 2300);
    await key({ type: 'tab' });
    await say1('再按 Tab 接受 <b>you</b>。现在它猜：<b>become / learn / find</b>。', 2300);
    await key({ type: 'option', n: 1 });
    await say1('一直按 Tab 就能把整句串下去。但预测不合心意怎么办？', 2000);
    await type('the');
    await say1('不用管它，直接打自己的字。一开始打字，就回到普通的前缀补全。', 2200);
    await key({ type: 'char', ch: ' ' });
    await say1('你打了 <b>the</b>，它又猜：<b>dog / cat / world</b>。这次就想要 dog，按 Tab。', 2300);
    await key({ type: 'tab' });
    await say1('演示结束。注意：这里的搭配（I will→help 等）是<b>手写示例数据</b>，只能覆盖这几句。正式做需要真实的词语搭配频率数据，来源和许可要另行解决。点「✍️ 自己试试」可以亲手玩一下。', 4200);
    return;
  }

  if (variant === 'B') await say1('假设你正在写一封英文邮件。<b>字母还是一个一个立刻出现在正文里</b>，和现在的英文输入完全一样。', 2600);
  if (variant === 'A') await say1('这个方案里，字母<b>先停在输入法里（带下划线）</b>，按空格或标点时才进入正文。', 2600);
  if (variant === 'C') await say1('这个方案里，字母立刻进入正文，<b>光标后只出现一个灰色的补全</b>。', 2600);

  await type('I will ');
  await say1('接下来想打 <b>help</b>。只打前 3 个字母：', 1200);
  await type('hel');
  await sleep(300);
  if (variant === 'B') await say1('输入法在光标下方给出建议：<b>help、held、hell</b>。第一个就是你要的。');
  if (variant === 'A') await say1('竖排候选窗第一行是原样字母（空格上屏），下面就是补全：<b>help、held、hell</b>。');
  if (variant === 'C') await say1('光标后出现灰字 <b>p</b>，合起来就是 <b>help</b>。');
  await say1('按 <kbd>Tab</kbd>，接受第一个建议。', 1500);
  await key({ type: 'tab' });
  await say1('<b>help</b> 补全了。前面只打了 3 个字母，剩下的 <b>p</b> 由输入法补上。', 2300);

  await type(' you ');
  if (variant !== 'C') {
    await type('bec');
    await say1('这次想要的是 <b>become</b>，排在第二个。', 1700);
    await say1('按 <kbd>⌥2</kbd>，选第二个建议。', 1500);
    await key({ type: 'option', n: 2 });
    await say1('<b>become</b> 上屏了。也可以直接点击建议。', 1800);
    await type(' ');
  }

  await say1('如果建议<b>不是</b>你要的，不用理它，继续打自己的字：', 1700);
  await type('the');
  await sleep(600);
  await type(' dog');
  await say1('你打你的，建议条在你按空格后就消失了。<b>不想用建议时，输入体验没有任何变化。</b>', 2600);
  await key({ type: 'enter' });
  await say1('演示结束。点右上角「<b>✍️ 自己试试</b>」亲手打字体验，或切换上方方案再看一遍。', 4000);
}

// ---------- 手动模式 ----------
function manual() {
  playToken++;
  host = { text: INITIAL_TEXT, caret: INITIAL_TEXT.length };
  state = EnglishCompletion.initial();
  renderHost();
  say(variant === 'D'
    ? '先打 <b>I will</b> 再按空格，看它不等你打字就给出预测；也可以随便打别的，回到前缀补全。'
    : '随便打点英文，比如 <b>hel</b>、<b>bec</b>、<b>Wor</b>（大写保留）。不想选建议就继续打字。', '✍️');
  $('manualHint').classList.add('show');
  $('playBtn').textContent = '▶ 播放演示';
  $('host').focus();
}

$('playBtn').addEventListener('click', play);
$('manualBtn').addEventListener('click', manual);

const segEl = $('seg');
segEl.innerHTML = Object.entries(VARIANTS).map(([k, name]) => `<button data-v="${k}" aria-pressed="${k === variant}">${k === 'B' ? '★ ' : ''}${name}</button>`).join('');
segEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  variant = b.dataset.v;
  [...segEl.children].forEach(x => x.setAttribute('aria-pressed', x.dataset.v === variant));
  const u = new URL(location.href); u.searchParams.set('variant', variant);
  try { history.replaceState(null, '', u); } catch (_) { /* file:// 下部分浏览器不允许 */ }
  play();
});

$('host').addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;
  let k = null;
  if (e.altKey && /^Digit[1-9]$/.test(e.code)) k = { type: 'option', n: +e.code.slice(5) };
  else if (e.altKey) return;
  else if (e.key === 'Backspace') k = { type: 'backspace' };
  else if (e.key === 'Tab') k = { type: 'tab' };
  else if (e.key === 'Enter') k = { type: 'enter' };
  else if (e.key === 'Escape') k = { type: 'esc' };
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') k = { type: 'arrow', dir: e.key === 'ArrowLeft' ? -1 : 1 };
  else if (e.key.length === 1) k = { type: 'char', ch: e.key };
  if (!k) return;
  e.preventDefault();
  playToken++;              // 手动按键打断播放
  $('manualHint').classList.add('show');
  handle(k);
});
$('host').addEventListener('mousedown', () => {
  playToken++;
  setTimeout(() => {
    // 简化：鼠标点击只用于聚焦与打断播放，光标定位交给键盘方向键
  }, 0);
});
$('overlay').addEventListener('mousedown', e => {
  const it = e.target.closest('[data-n]'); if (!it) return;
  e.preventDefault();
  playToken++;
  handle({ type: 'option', n: +it.dataset.n });
  $('host').focus();
});

host = { text: INITIAL_TEXT, caret: INITIAL_TEXT.length };
renderHost();
say('点击「▶ 播放演示」，看一遍完整的打字过程。', 1);
setTimeout(play, 700);
</script>
