<!doctype html>
<html lang="zh-CN" data-theme="brand" data-appearance="light" data-layout="rows" data-fz="p1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Gogaku 设置 · 模糊音多选的四种排版</title>
<style>
/* ==================================================================
   令牌：主题固定为青绿（brand），只保留浅 / 深两套。
   ================================================================== */
:root{
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --mono:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --dot-r:#ec6a5e; --dot-y:#f4bf4f; --dot-g:#61c554;
}

/* —— brand（Gogaku 青绿）· 浅色 —— */
html[data-theme="brand"][data-appearance="light"]{
  --stage:#e5ece8;
  --win-bg:#f5f8f6;
  --titlebar:#e7efe9;
  --side-bg:#edf3ef;
  --panel:#ffffff;
  --border:#d8e3dc;
  --border-strong:#c2d2c9;
  --hairline:#e8f0ea;
  --fg:#1c2b25;
  --fg-2:#5b6f66;
  --fg-3:#7d8f86;
  --accent:#12996a;
  --accent-fg:#ffffff;
  --accent-text:#0d7a53;
  --accent-soft:rgba(18,153,106,.12);
  --accent-ring:rgba(18,153,106,.25);
  --switch-off:#d4e0d9;
  --knob:#ffffff;
  --ta-tint:rgba(18,153,106,.04);
  --btn-hover:#eef5f1;
  --tag-bg:#edf4f0;
  --ok:#1f8a4c;
  --shadow:0 18px 44px rgba(22,40,32,.16), 0 2px 8px rgba(22,40,32,.08);
}
/* —— brand（Gogaku 青绿）· 深色 —— */
html[data-theme="brand"][data-appearance="dark"]{
  --stage:#101713;
  --win-bg:#18211c;
  --titlebar:#1d2822;
  --side-bg:#141c17;
  --panel:#1f2a24;
  --border:#2e3d35;
  --border-strong:#3c4f45;
  --hairline:#263129;
  --fg:#edf4f0;
  --fg-2:#a7b8af;
  --fg-3:#7f9188;
  --accent:#34c48c;
  --accent-fg:#08150f;
  --accent-text:#5ad9a4;
  --accent-soft:rgba(52,196,140,.16);
  --accent-ring:rgba(52,196,140,.28);
  --switch-off:rgba(255,255,255,.14);
  --knob:#ffffff;
  --ta-tint:rgba(255,255,255,.04);
  --btn-hover:#26332c;
  --tag-bg:#22302a;
  --ok:#4cc47f;
  --shadow:0 18px 44px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
}

/* 外观共用的中性令牌（提示条、危险色、原型切换条） */
html[data-appearance="light"]{
  color-scheme:light;
  --warning-bg:#fcf3de;
  --warning-border:#e3cd97;
  --warning-fg:#6a4a10;
  --danger:#b3261e;
  --danger-soft:rgba(179,38,30,.08);
  --danger-line:rgba(179,38,30,.35);
  --scrim:rgba(24,20,12,.34);
  --sw-bg:rgba(250,250,251,.93);
  --sw-border:#d7d7db;
  --sw-panel:#ffffff;
  --sw-fg:#1d1d1f;
  --sw-fg-2:#6e6e73;
  --sw-on-bg:#1d1d1f;
  --sw-on-fg:#ffffff;
}
html[data-appearance="dark"]{
  color-scheme:dark;
  --warning-bg:#2a2215;
  --warning-border:#5c4a27;
  --warning-fg:#e8cd93;
  --danger:#ff6b5e;
  --danger-soft:rgba(255,107,94,.12);
  --danger-line:rgba(255,107,94,.4);
  --scrim:rgba(0,0,0,.55);
  --sw-bg:rgba(22,22,24,.92);
  --sw-border:#3a3a3c;
  --sw-panel:#2c2c2e;
  --sw-fg:#f5f5f7;
  --sw-fg-2:#a1a1a6;
  --sw-on-bg:#f5f5f7;
  --sw-on-fg:#1c1c1e;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--stage);
  color:var(--fg);
  font-family:var(--font);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:0 0 150px; /* 由 JS 按切换条实际高度再补一次 */
}
h1,h2,h3,p{ margin:0; }
button{ font-family:inherit; }
[hidden]{ display:none !important; }

:focus-visible{ outline:2px solid var(--accent-ring); outline-offset:2px; }

/* 行度量：固定 rows + native */
:root{
  --row-h:44px;
  --row-vpad:9px;
  --row-dvpad:11px;
  --radio-col:320px;
}

/* ==================================================================
   原型外壳
   ================================================================== */
.chrome{ max-width:948px; margin:0 auto; padding:26px 24px 0; }
.eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--fg-2);
}
h1{ font-size:25px; line-height:1.25; font-weight:650; letter-spacing:-.015em; margin:8px 0 14px; }
.notice{
  border:1px solid var(--warning-border); background:var(--warning-bg); color:var(--warning-fg);
  border-radius:9px; padding:10px 13px; font-size:12px; line-height:1.65;
}
.notice strong{ font-weight:650; }
.notice code{ font-family:var(--mono); font-size:11px; }

.proto{ max-width:948px; margin:16px auto 0; padding:0 24px; }
.proto__inner{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px;
  padding:8px 12px; border:1px dashed var(--border-strong); border-radius:8px;
}
.proto__label{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--fg-3); text-transform:uppercase; }
.proto__group{ display:flex; align-items:center; gap:8px; }
.proto__group--now{ margin-left:auto; }
.proto__name{ font-size:10.5px; color:var(--fg-2); }
.proto__now{
  font-family:var(--mono); font-size:10.5px; padding:3px 8px;
  border:1px solid var(--border); border-radius:6px; background:var(--win-bg); color:var(--fg);
  white-space:nowrap;
}

.seg{ display:inline-flex; padding:2px; gap:2px; border:1px solid var(--border); border-radius:7px; background:var(--win-bg); }
.seg__btn{
  border:0; background:transparent; color:var(--fg-2); cursor:pointer;
  font-size:11.5px; padding:3px 9px; border-radius:5px; line-height:1.4;
}
.seg__btn:hover{ color:var(--fg); }
.seg__btn[aria-pressed="true"]{ background:var(--fg); color:var(--win-bg); }

.stage-outer{ max-width:948px; margin:18px auto 0; padding:0 24px 8px; }
.stage{ display:flex; justify-content:center; overflow:hidden; }
.stage__fit{ transform-origin:top center; }

.window{
  position:relative; display:flex; flex-direction:column;
  width:900px; height:620px;
  background:var(--win-bg); border:1px solid var(--border); border-radius:11px;
  box-shadow:var(--shadow); overflow:hidden;
}
.window[data-win="760"]{ width:760px; height:520px; }
.titlebar{
  flex:0 0 38px; display:flex; align-items:center; gap:7px;
  padding:0 13px; background:var(--titlebar); border-bottom:1px solid var(--border);
  position:relative;
}
.dot{ width:11px; height:11px; border-radius:50%; display:block; }
.dot--r{ background:var(--dot-r); } .dot--y{ background:var(--dot-y); } .dot--g{ background:var(--dot-g); }
.titlebar__title{
  position:absolute; left:50%; transform:translateX(-50%);
  font-size:12px; font-weight:600; color:var(--fg-2); letter-spacing:.01em;
}
.window__body{ flex:1 1 auto; min-height:0; position:relative; overflow:hidden; }

.switcher{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--sw-bg); border-top:1px solid var(--sw-border);
  box-shadow:0 -8px 24px rgba(0,0,0,.10);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.switcher__inner{
  max-width:948px; margin:0 auto; padding:9px 24px 11px;
  display:flex; flex-direction:column; gap:7px;
}
.switcher__row{ display:flex; align-items:center; flex-wrap:wrap; gap:7px 12px; min-width:0; }
.switcher__label{
  flex:0 0 auto; min-width:26px; font-size:10.5px; font-weight:600;
  letter-spacing:.08em; color:var(--sw-fg-2);
}
.switcher .seg{ background:var(--sw-panel); border-color:var(--sw-border); }
.switcher .seg__btn{ color:var(--sw-fg-2); padding:4px 12px; font-size:12px; }
.switcher .seg__btn:hover{ color:var(--sw-fg); }
.switcher .seg__btn[aria-pressed="true"]{ background:var(--sw-on-bg); color:var(--sw-on-fg); }
.switcher__hint{
  margin-left:auto; flex:0 0 auto; font-family:var(--mono); font-size:10.5px;
  color:var(--sw-fg-2); letter-spacing:.04em; white-space:nowrap;
}

/* ==================================================================
   布局 A 骨架：200pt 文字侧栏 + 页头 + 滚动区 + 状态栏
   ================================================================== */
.shell{ height:100%; }
.shell--a{ display:grid; grid-template-columns:200px minmax(0,1fr); }
.side{
  background:var(--side-bg); border-right:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0;
}
.side__title{ font-size:14px; font-weight:600; letter-spacing:-.01em; padding:18px 16px 10px; }
.nav{ display:flex; flex-direction:column; gap:1px; padding:0 8px; overflow-y:auto; }
.nav__item{
  border:0; background:transparent; text-align:left; cursor:pointer;
  font-size:13px; color:var(--fg); line-height:1.4;
  padding:6px 10px; border-radius:6px;
}
.nav__item:hover{ background:rgba(127,127,127,.13); }
.nav__item[aria-current="page"]{ background:var(--accent-soft); color:var(--accent-text); font-weight:600; }
.nav__item:focus-visible{ outline-offset:-1px; box-shadow:inset 0 0 0 1px var(--accent); }
.side__foot{ margin-top:auto; padding:12px 16px 14px; display:flex; flex-direction:column; gap:3px; }
.side__meta{ font-size:11px; color:var(--fg-2); }
.side__ver{ font-family:var(--mono); font-size:10px; color:var(--fg-3); }

.main{ display:flex; flex-direction:column; min-width:0; min-height:0; }
.pagehead{ flex:0 0 auto; padding:22px 26px 14px; }
.pagehead h2{ font-size:22px; font-weight:600; letter-spacing:-.015em; }
.pagehead p{ margin-top:6px; font-size:12px; color:var(--fg-2); }
.scroller{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:2px 26px 18px; }

.section__title{ font-size:15px; font-weight:600; letter-spacing:-.005em; }
.section__lead{ font-size:12px; color:var(--fg-2); margin:5px 0 10px; line-height:1.55; }
.section + .section{ margin-top:18px; }
.hr{ border:0; border-top:1px solid var(--hairline); margin:18px 0; }

.panel{ border:1px solid var(--border); border-radius:9px; background:var(--panel); margin:0; }
.panel + .panel{ margin-top:18px; }
.panel__title{ font-size:12.5px; font-weight:600; padding:12px 14px 0; letter-spacing:.01em; }
.panel__body{ padding:2px 14px 10px; }

.row{ display:flex; align-items:center; gap:16px; min-height:var(--row-h); padding:var(--row-vpad) 0; }
.row + .row{ border-top:1px solid var(--hairline); }
.row--detail{ align-items:flex-start; padding:var(--row-dvpad) 0; }
.row__text{ flex:1 1 auto; min-width:0; }
.row__label{ font-size:13px; line-height:1.45; }
.row__label [data-role="fontsize"]{
  color:var(--accent-text); font-weight:600; font-variant-numeric:tabular-nums;
}
.row__detail{ font-size:11px; line-height:1.5; color:var(--fg-2); margin-top:3px; }
.row__control{
  flex:0 0 auto; display:flex; align-items:center; justify-content:flex-end;
  gap:8px; min-height:19px;
}
html[data-layout="rows"] .row:has(> .row__control > .radios) > .row__control{
  flex:0 0 var(--radio-col); width:var(--radio-col);
}

.a-scheme{ padding-bottom:2px; }
.a-scheme .muted{ margin-top:8px; }
.subblock{ margin-top:12px; border-top:1px solid var(--hairline); padding-top:10px; }
.subhead{ font-size:12px; font-weight:600; margin:0 0 8px; }
.muted{ color:var(--fg-2); }
.small{ font-size:11px; line-height:1.55; }
.mono{ font-family:var(--mono); }
.body-text{ font-size:12.5px; line-height:1.6; margin-bottom:8px; }
.caption{ font-size:10.5px; color:var(--fg-3); letter-spacing:.04em; margin:12px 0 6px; }
.sample-note{
  font-size:11px; color:var(--fg-2); line-height:1.5;
  background:var(--tag-bg); border-radius:6px; padding:5px 8px; margin:6px 0 8px;
}
.tag{
  display:inline-block; font-size:9.5px; line-height:1.5; padding:0 4px; margin-left:5px;
  border-radius:4px; border:1px solid var(--warning-border); color:var(--warning-fg);
  background:var(--warning-bg); vertical-align:1px; letter-spacing:.02em; white-space:nowrap;
}
.inline{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 0 4px; }
.listhead{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.kbd{
  font-family:var(--mono); font-size:11.5px; color:var(--fg-2);
  border:1px solid var(--border); border-bottom-width:2px; border-radius:5px;
  padding:1px 6px; background:var(--tag-bg); white-space:nowrap;
}

.statusbar{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  padding:0 26px; min-height:36px;
  border-top:1px solid var(--border); background:var(--win-bg);
  font-size:11px; color:var(--fg-2);
}
.statusbar__dot{ flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:var(--fg-3); }
.statusbar[data-tone="saved"] .statusbar__dot{ background:var(--ok); }
.statusbar__text{ line-height:1.4; min-width:0; }
.statusbar__hint{ margin-left:auto; flex:0 0 auto; font-size:10.5px; color:var(--fg-3); white-space:nowrap; }

/* ==================================================================
   基础控件（固定 native 一套）
   ================================================================== */
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--border-strong); background:var(--panel); color:var(--fg);
  font-size:12px; line-height:1; height:24px; padding:0 11px; border-radius:6px;
  cursor:pointer; white-space:nowrap;
}
.btn:hover{ background:var(--btn-hover); }
.btn:active{ box-shadow:inset 0 1px 2px rgba(0,0,0,.08); }
.btn:disabled{ opacity:.42; cursor:default; }
.btn--primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-fg); height:24px; }
.btn--primary:hover{ background:var(--accent); }
.btn--sm{ font-size:11.5px; height:22px; padding:0 9px; }
.btn--xs{ font-size:11px; height:20px; padding:0 7px; border-radius:5px; }
.btn:focus-visible{ border-color:var(--accent); }

.switch{ position:relative; display:inline-flex; align-items:center; cursor:pointer; flex:0 0 auto; width:34px; height:20px; }
.switch input{ position:absolute; opacity:0; width:1px; height:1px; margin:0; }
.switch__ui{
  display:block; position:relative; width:34px; height:20px; flex:0 0 auto;
  border-radius:999px; background:var(--switch-off); transition:background .14s ease;
}
.switch__ui::after{
  content:""; position:absolute; top:2px; left:2px; width:16px; height:16px;
  border-radius:50%; background:var(--knob);
  box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .14s ease;
}
.switch input:checked + .switch__ui{ background:var(--accent); }
.switch input:checked + .switch__ui::after{ transform:translateX(14px); }
.switch--mini{ width:30px; height:18px; }
.switch--mini .switch__ui{ width:30px; height:18px; }
.switch--mini .switch__ui::after{ top:2px; left:2px; width:14px; height:14px; }
.switch--mini input:checked + .switch__ui::after{ transform:translateX(12px); }
.switch input:focus-visible + .switch__ui{
  outline:2px solid var(--accent-ring); outline-offset:2px;
  box-shadow:0 0 0 1px var(--accent);
}

.radios{ display:flex; flex-direction:column; gap:6px; }
.radio{ position:relative; display:inline-flex; align-items:center; gap:7px; font-size:12px; cursor:pointer; }
.radio input{ position:absolute; opacity:0; width:1px; height:1px; margin:0; }
.radio__ui{
  flex:0 0 auto; width:16px; height:16px; border-radius:50%;
  border:1px solid var(--border-strong); background:var(--panel);
  display:grid; place-items:center;
  transition:border-color .12s ease, background .12s ease;
}
.radio input:checked + .radio__ui{ border-color:var(--accent); }
.radio input:checked + .radio__ui::after{
  content:""; width:6px; height:6px; border-radius:50%; background:var(--accent);
}
.radio input:focus-visible + .radio__ui{ border-color:var(--accent); outline:2px solid var(--accent-ring); outline-offset:2px; }
.radio__label{ line-height:1.4; }

.stepper{ display:inline-flex; flex-direction:column; border:1px solid var(--border-strong); border-radius:5px; background:var(--panel); }
.stepper__btn{
  width:20px; height:18px; border:0; border-radius:0; padding:0;
  background:transparent; font-size:0; line-height:0; cursor:pointer;
  display:grid; place-items:center;
}
.stepper__btn:hover{ background:var(--btn-hover); }
.stepper__btn:disabled{ opacity:.35; cursor:default; }
.stepper__btn:first-of-type{ border-radius:4px 4px 0 0; }
.stepper__btn:last-of-type{ border-radius:0 0 4px 4px; border-top:1px solid var(--border); }
.stepper__btn::before{
  content:""; width:0; height:0;
  border-left:4px solid transparent; border-right:4px solid transparent;
}
.stepper__btn:first-of-type::before{ border-bottom:5px solid var(--fg-2); }
.stepper__btn:last-of-type::before{ border-top:5px solid var(--fg-2); }
.stepper__value{ display:none; }

.input,.textarea,.select{
  font-family:inherit; font-size:12px; color:var(--fg); background:var(--panel);
  border:1px solid var(--border-strong); border-radius:6px; padding:5px 8px;
}
.textarea{ display:block; width:100%; resize:vertical; line-height:1.5; min-height:0; }
.textarea.mono{ font-family:var(--mono); font-size:11.5px; line-height:1.5; }
.textarea{
  padding:8px 10px; border-radius:6px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.05);
}
.textarea[data-key="quickAddExcluded"]{ height:96px; min-height:96px; }
.keyinput{ width:40px; text-align:center; font-family:var(--mono); text-transform:lowercase; padding:5px 4px; }
.select{ padding:4px 6px; }
.shortcut{ display:flex; gap:6px; align-items:center; }
.shortcut .select{ max-width:170px; }

.input:focus-visible,.textarea:focus-visible,.select:focus-visible{
  outline:none; border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent), 0 0 0 3px var(--accent-ring);
}

/* ==================================================================
   自定义词语 / 学习片段 / 编辑表单
   ================================================================== */
.words{ display:flex; flex-direction:column; margin:2px 0 6px; }
.word{ display:flex; align-items:center; gap:10px; padding:8px 0; }
.word + .word{ border-top:1px solid var(--hairline); }
.word.is-off .word__text{ opacity:.5; }
.word__text{ flex:1 1 auto; min-width:0; }
.word__title{ font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:4px; min-width:0; }
.word__name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.word__sub{ font-size:11px; color:var(--fg-2); line-height:1.45; margin-top:1px; overflow-wrap:anywhere; }
.word__acts{ flex:0 0 auto; display:flex; gap:4px; }
.word__acts .btn{ white-space:nowrap; }

.recs{ display:flex; flex-direction:column; }
.rec{ display:flex; align-items:flex-start; gap:12px; padding:10px 0; }
.rec + .rec{ border-top:1px solid var(--hairline); }
.rec__text{ flex:1 1 auto; min-width:0; }
.rec__pair{ font-size:12.5px; line-height:1.5; }
.rec__meta{ font-size:11px; color:var(--fg-2); margin-top:3px; }
.rec__acts{ flex:0 0 auto; display:flex; gap:5px; }

.empty{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  border:1px dashed var(--border-strong); border-radius:9px;
  padding:20px 12px; margin:0 0 12px; text-align:center;
}
.empty svg{ width:26px; height:26px; color:var(--fg-3); margin-bottom:2px; }
.empty__title{ font-size:14px; font-weight:600; }
.empty__desc{ font-size:11.5px; color:var(--fg-2); }

.overlay-host{ position:absolute; inset:0; z-index:40; pointer-events:none; }
.overlay{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  padding:18px; background:var(--scrim); pointer-events:auto; overflow:auto;
}
.sheet{
  width:420px; max-width:100%; background:var(--win-bg);
  border:1px solid var(--border); border-radius:10px;
  box-shadow:0 20px 50px rgba(0,0,0,.35); padding:16px 18px 14px;
}
.sheet h3{ font-size:15px; font-weight:650; margin-bottom:12px; }
.field{ margin-bottom:10px; }
.field__label{ display:block; font-size:11px; color:var(--fg-2); margin-bottom:4px; }
.field .input,.field .textarea{ width:100%; }

.fzhead__title{ font-size:12px; font-weight:600; letter-spacing:.01em; white-space:nowrap; }
.fzhead__right{ display:flex; align-items:center; gap:6px; min-width:0; }
.fzcount{

  white-space:nowrap; letter-spacing:.01em;
}
.fzhead__right .fzcount{ margin-right:2px; }
.fzbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 8px; }
.fzbar__hint{ font-size:11px; color:var(--fg-2); }

.fzopt{
  position:relative; display:flex; align-items:flex-start; gap:6px;
  min-width:0; cursor:pointer; border-radius:5px;
}
.fzopt input{ position:absolute; opacity:0; width:1px; height:1px; margin:0; }
.fzbox{
  flex:0 0 auto; width:14px; height:14px; margin-top:1px; border-radius:3.5px;
  border:1px solid var(--border-strong); background:var(--panel);
  display:grid; place-items:center;
  transition:background .12s ease, border-color .12s ease;
}
.fzbox::after{
  content:""; width:3px; height:6px;
  border-right:1.6px solid transparent; border-bottom:1.6px solid transparent;
  transform:rotate(45deg);
}
.fzopt input:checked + .fzbox{ background:var(--accent); border-color:var(--accent); }
.fzopt input:checked + .fzbox::after{ border-right-color:var(--accent-fg); border-bottom-color:var(--accent-fg); }
.fzopt:has(input:focus-visible){ outline:2px solid var(--accent-ring); outline-offset:1px; }
@supports not selector(:has(*)){
  .fzopt input:focus-visible + .fzbox{ outline:2px solid var(--accent-ring); outline-offset:2px; }
}

.fzopt__text{ min-width:0; display:flex; flex-direction:column; }
.fzo__code{ font-family:var(--mono); font-size:11px; line-height:1.45; color:var(--fg); }
.fzo__note{ font-size:10.5px; line-height:1.45; color:var(--fg-2); }

/* p1 · 两列清单（现行基准）：代码与说明同一行 */
.fzp1{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 14px; margin-top:2px; }
.fzopt--p1{ align-items:baseline; padding:4px 0; }
.fzopt--p1 .fzbox{ align-self:center; margin-top:0; }
.fzopt--p1 .fzopt__text{ flex-direction:row; flex-wrap:wrap; align-items:baseline; gap:0 6px; }
.fzopt--p1 .fzo__note{ font-size:11px; }

/* p2 · 三列紧凑：第一行复选框 + 代码，第二行说明缩进到代码起点 */
.fzp2{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 16px; margin-top:2px; }
.fzopt--p2{ padding:4px 0; }

/* p3 · 按音类分三列：每列一个列头 + 组内纵向 3 项 */
.fzp3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 16px; margin-top:2px; }
.fzp3__head{
  font-size:11px; font-weight:600; color:var(--fg-2); letter-spacing:.02em;

}
.fzp3__items{ display:flex; flex-direction:column; }
.fzopt--p3{ padding:4px 0; }

/* p4 · 单行表格：单列 9 行，代码固定列宽，行间 hairline 贯穿内容宽度 */
.fzp4{ display:flex; flex-direction:column; margin-top:2px; }
.fzopt--p4{ flex:0 0 auto; align-items:center; height:30px; padding:0 6px; border-radius:5px; }
.fzopt--p4 + .fzopt--p4{ border-top:1px solid var(--hairline); }
.fzopt--p4:hover{ background:var(--accent-soft); }
.fzopt--p4 .fzbox{ margin-top:0; }
.fzopt--p4 .fzopt__text{ flex-direction:row; align-items:center; gap:0; }
.fzopt--p4 .fzo__code{ flex:0 0 76px; font-size:11.5px; }
.fzopt--p4 .fzo__note{ font-size:11px; }
.fzopt--p4:has(input:focus-visible){ outline-offset:-2px; }

/* 760×520 降级：p2 三列 → 两列；p3 三列 → 三行分组堆叠（组内仍横排 3 列） */
.window[data-win="760"] .fzp2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.window[data-win="760"] .fzp3{ display:flex; flex-direction:column; }
.window[data-win="760"] .fzp3__group{
  display:grid; grid-template-columns:82px minmax(0,1fr); gap:4px 10px;
  align-items:start; padding:7px 0;
}
.window[data-win="760"] .fzp3__group + .fzp3__group{ border-top:1px solid var(--hairline); }
.window[data-win="760"] .fzp3__head{
  border-bottom:0; padding:3px 0 0; margin:0; color:var(--fg-2);
}
.window[data-win="760"] .fzp3__items{
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 12px;
}
.window[data-win="760"] .fzopt--p3{ padding:3px 0; }

    for (var i = 0; i < state.apps.length; i++) if (state.apps[i].enabled) on += 1;
    if (on === total) return total + ' 个应用 · 全部启用';

  function addApp(id){
    if (appById(id)) return;
    var item = findById(CATALOG, id);
    if (!item) return;
    state.apps.push({ id:item.id, name:item.name, bundle:item.bundle, hue:item.hue, letter:item.letter, enabled:true });
    setStatus(SAVED);
    paintApps();
    if (state.appModalOpen) refreshModalList(true);

  function removeApp(id){
    var index = -1;

    state.apps.splice(index, 1);

    paintApps();
    if (state.appModalOpen) refreshModalList(false);

    return '<div class="fzhead">' + fzTitle() + fzCount() + '</div>' +

  function fzP1(){
    return '<div class="fzp1">' + FUZZY_ORDER.map(function (code) { return fzItem(code, 'p1'); }).join('') + '</div>';

  function fzP2(){
    return '<div class="fzp2">' + FUZZY_ORDER.map(function (code) { return fzItem(code, 'p2'); }).join('') + '</div>';

    return '<div class="fzp4">' + FUZZY_ORDER.map(function (code) { return fzItem(code, 'p4'); }).join('') + '</div>';

  function fuzzyPanel(){
    var head = state.fzLayout === 'p1' ? fzHeadStacked() : fzHeadInline();

    else if (state.fzLayout === 'p3') grid = fzP3();
    else if (state.fzLayout === 'p4') grid = fzP4();
    else grid = fzP1();
    return head + grid;
  }

      '<p class="muted small">资源安装后，还需完成双向质量、离线和性能验收。系统资源更新后，原有结论也需复核。</p>';
  }

  function recRow(r){
    return '<div class="rec"><div class="rec__text"><div class="rec__pair">' + r.pair +
      '<span class="tag">示例</span></div><div class="rec__meta">' + r.meta + '</div></div>' +
      '<div class="rec__acts">' +
      '<button type="button" class="btn btn--xs" data-act="record-dismiss">排除此条误报</button>' +
      '<button type="button" class="btn btn--xs" data-act="record-delete">删除片段</button>' +
      '</div></div>';
  }
  function recordsBody(){
    return '<p class="sample-note">真实出厂为空；下面两行带「示例」标记，只用于展示有数据时的密度。</p>' +
      '<div class="recs">' + RECORDS.map(recRow).join('') + '</div>' +

      '<div class="empty">' + RECORD_ICON +
      '<div class="empty__title">暂无学习片段</div>' +
      '<div class="empty__desc">已确认成功的学习内容会显示在这里。</div></div>' +
      '<p class="muted small">采用帮助不代表掌握；工具生成的错误不作为用户错误。最多显示 1000 条，可在“学习与隐私”中暂停记录或排除应用。</p>';
  }
  function recordsSection(){
    return '<section class="section"><div class="listhead"><h3 class="section__title">最近的片段</h3>' +
      '<button type="button" class="btn btn--sm" data-act="refresh-records">刷新</button></div>' +
      recordsBody() + '</section>';
  }

  function contentA(){
    switch (state.page) {
      case 'resources':
        return section('本地翻译','语言资源由 macOS 管理，安装时会显示系统授权流程。', resourcesRows()) +
          '<hr class="hr">' +
          section('开发版状态','', resourcesStatusText());
      case 'normalInput':
        return panel('输入方案', normalSchemeBody()) +
          panel('候选窗与输入区', normalCandidateRows()) +
          panel('中文模式下的英文候选与调频', normalEnglishRows()) +
          '<section class="panel"><h3 class="panel__title">按应用默认英文</h3>' +
            '<div class="panel__body" id="appPanelHost">' + appPanelBody() + '</div></section>' +
          panel('快速添加（Control＋Shift＋A 可改）', quickAddBody());
      case 'customWords':
        return panel('短码短语', wordsPanelBody('shortcode')) +
          panel('拼音词', wordsPanelBody('pinyin'));
      case 'shortcuts':
        return section('模式切换','菜单中也可执行相同操作。每个应用会记住自己的模式与方向。', shortcutModeRows()) +
          '<hr class="hr">' +
          section('组合中的操作','', shortcutComboRows());
      case 'privacy':
        return section('学习记录','仅保留已确认成功的学习片段，30 天后过期。', privacyRecordBody()) +
          '<hr class="hr">' +
          section('排除应用','每行填写一个应用标识（bundle ID）。这些应用不保存学习记录。', privacyExcludeBody()) +
          '<hr class="hr">' +
          section('英语忽略词','每行一个词，适合姓名、品牌或无需拼写提示的表达。', privacyIgnoreBody());
      case 'records':
        return recordsSection();
    }
    return '';
  }

  function shellA(){
    var p = currentPage();
    return '<div class="shell shell--a">' +
      '<aside class="side">' +
        '<div class="side__title">Gogaku</div>' +
        '<nav class="nav" aria-label="设置分类">' + navItems() + '</nav>' +
        '<div class="side__foot"><div class="side__meta">本机开发版</div>' +
        '<div class="side__ver">' + VERSION + '</div></div>' +
      '</aside>' +
      '<div class="main">' +
        '<header class="pagehead"><h2>' + p.title + '</h2><p>' + p.subtitle + '</p></header>' +
        '<div class="scroller" data-role="scroller">' + contentA() + '</div>' +
        statusbar() +
      '</div></div>';
  }

  /* ==================================================================
     渲染与局部更新
     ================================================================== */
  function captureSig(){
    var el = document.activeElement;
    if (!el || el === document.body || !el.getAttribute) return null;
    return {
      id:el.id || '',
      act:el.getAttribute('data-act') || '',
      fuzzy:el.getAttribute('data-fuzzy') || '',
      appId:el.getAttribute('data-app-id') || '',
      wordId:el.getAttribute('data-id') || '',
      page:el.getAttribute('data-page') || '',
      w:el.getAttribute('data-w') || ''
    };
  }
  function restoreSig(sig){
    if (!sig) return;
    var el = null;
    if (sig.id) el = document.getElementById(sig.id);
    if (!el && sig.fuzzy) el = document.querySelector('[data-fuzzy="' + sig.fuzzy + '"]');
    if (!el && sig.act) {
      var sel = '[data-act="' + sig.act + '"]';
      if (sig.appId) sel += '[data-app-id="' + sig.appId + '"]';
      if (sig.wordId) sel += '[data-id="' + sig.wordId + '"]';
      if (sig.page) sel += '[data-page="' + sig.page + '"]';
      if (sig.w) sel += '[data-w="' + sig.w + '"]';
      el = document.querySelector(sel);
    }
    if (el && el.focus) el.focus({ preventScroll:true });
  }
  function paintHost(id, html){
    var host = document.getElementById(id);
    if (!host) return;
    var sig = host.contains && host.contains(document.activeElement) ? captureSig() : null;
    host.innerHTML = html;
    if (sig) restoreSig(sig);
  }
  function paintApps(){
    paintHost('appPanelHost', appPanelBody());
  }
  function paintFuzzy(){
    paintHost('fzHost', fuzzyPanel());
  }

  function renderWindow(keepScroll){
    var body = document.getElementById('winBody');
    var prev = body.querySelector('[data-role="scroller"]');
    var top = keepScroll && prev ? prev.scrollTop : 0;
    body.innerHTML = shellA();
    if (keepScroll) {
      var next = body.querySelector('[data-role="scroller"]');
      if (next) next.scrollTop = top;
    }
    fitStage();
  }

  function setStatus(text, tone){
    var nextTone = tone || 'saved';
    if (state.status === text && state.statusTone === nextTone) return;
    state.status = text;
    state.statusTone = nextTone;
    var nodes = document.querySelectorAll('[data-role="statusText"]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = text;
    var bars = document.querySelectorAll('.statusbar');
    for (var j = 0; j < bars.length; j++) bars[j].setAttribute('data-tone', state.statusTone);
  }

  function setPage(id){
    var exists = false;
    for (var i = 0; i < PAGES.length; i++) if (PAGES[i].id === id) exists = true;
    if (!exists) return;
    if (state.page !== id && state.appModalOpen) closeAppModal();
    state.page = id;
    state.status = IDLE;
    state.statusTone = 'idle';
    renderWindow(false);
    var scroller = document.querySelector('[data-role="scroller"]');
    if (scroller) scroller.scrollTop = 0;
  }

  function setAppearance(value){
    state.appearance = value;
    applyAppearance();
  }
  function applyAppearance(){
    var dark = state.appearance === 'dark' || (state.appearance === 'auto' && mq.matches);
    document.documentElement.setAttribute('data-appearance', dark ? 'dark' : 'light');
    var nodes = document.querySelectorAll('[data-act="appearance"]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].setAttribute('aria-pressed', nodes[i].getAttribute('data-appearance') === state.appearance ? 'true' : 'false');
    }
  }
  function setWinSize(width, height){
    document.getElementById('window').setAttribute('data-win', width === 760 ? '760' : '900');
    var nodes = document.querySelectorAll('[data-act="winsize"]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].setAttribute('aria-pressed', Number(nodes[i].getAttribute('data-w')) === width ? 'true' : 'false');
    }
    fitStage();
    if (state.appModalOpen) keepOverlayVisible();
  }
  function fitStage(){
    var win = document.getElementById('window');
    var fit = document.getElementById('fit');
    var stage = document.getElementById('stage');
    if (!win || !fit || !stage) return;
    var w = win.offsetWidth;
    var h = win.offsetHeight;
    var available = stage.clientWidth;
    if (!available) return;
    var scale = Math.min(1, available / w);
    fit.style.width = w + 'px';
    fit.style.height = h + 'px';
    fit.style.transform = scale < 1 ? 'scale(' + scale + ')' : 'none';
    stage.style.height = Math.ceil(h * scale) + 'px';
  }
  function syncPad(){
    var bar = document.querySelector('.switcher');
    if (!bar) return;
    document.body.style.paddingBottom = Math.max(150, bar.offsetHeight + 28) + 'px';
  }
  function keepOverlayVisible(){
    var sheet = document.querySelector('.overlay .sheet');
    if (!sheet) return;
    var rect = sheet.getBoundingClientRect();
    var bar = document.querySelector('.switcher');
    var limit = window.innerHeight - (bar ? bar.offsetHeight : 0) - 12;
    if (rect.bottom > limit) window.scrollBy(0, rect.bottom - limit + 8);
    else if (rect.top < 12) window.scrollBy(0, rect.top - 12);
  }

  /* ---------- 排版切换 ---------- */
  function writeUrl(){
    try {
      var url = new URL(window.location.href);
      url.searchParams.set('layout', state.fzLayout);
      window.history.replaceState(null, '', url.href);
    } catch (err) { /* file:// 下可能被拒绝，忽略即可 */ }
  }
  function updateLayoutName(){
    var layout = currentLayout();
    var node = document.getElementById('layoutName');
    if (node) node.textContent = layout.name;
  }
  function syncLayoutButtons(){
    var btns = document.querySelectorAll('[data-act="fz-layout"]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-layout-id') === state.fzLayout ? 'true' : 'false');
    }
  }
  function setLayout(id){
    if (!findById(LAYOUTS, id)) return;
    state.fzLayout = id;
    document.documentElement.setAttribute('data-fz', id);
    syncLayoutButtons();
    updateLayoutName();
    writeUrl();
    if (state.page === 'normalInput') paintFuzzy();
  }

  function stepFont(delta){
    var next = Math.min(16, Math.max(12, state.fontSize + delta));
    if (next === state.fontSize) return;
    state.fontSize = next;
    var labels = document.querySelectorAll('[data-role="fontsize"]');
    for (var i = 0; i < labels.length; i++) labels[i].textContent = String(next);
    var buttons = document.querySelectorAll('[data-act="step"]');
    for (var j = 0; j < buttons.length; j++) {
      var d = Number(buttons[j].getAttribute('data-delta'));
      buttons[j].disabled = (d < 0 && next <= 12) || (d > 0 && next >= 16);
    }
    setStatus(SAVED);
  }

  /* ---------- 模糊音操作（四种排版共用） ---------- */
  function setAllFuzzy(all){
    if (all) FUZZY_ORDER.forEach(function (code) { state.fuzzy.add(code); });
    else state.fuzzy.clear();
    paintFuzzy();
    setStatus(SAVED);
  }
  function refocusBatch(act){
    var same = document.querySelector('[data-act="' + act + '"]');
    if (same && !same.disabled) { same.focus({ preventScroll:true }); return; }
    var otherAct = act === 'fuzzy-all' ? 'fuzzy-none' : 'fuzzy-all';
    var other = document.querySelector('[data-act="' + otherAct + '"]');
    if (other && !other.disabled) other.focus({ preventScroll:true });
  }

  /* ---------- 词条 ---------- */
  function findWord(id){
    for (var i = 0; i < state.words.length; i++) if (state.words[i].id === id) return i;
    return -1;
  }
  function moveWord(id, delta){
    var index = findWord(id);
    if (index < 0) return;
    var word = state.words[index];
    var siblings = state.words.filter(function (w) { return w.kind === word.kind; });
    var pos = siblings.indexOf(word);
    var neighbor = siblings[pos + delta];
    if (!neighbor) return;
    var target = findWord(neighbor.id);
    state.words[index] = neighbor;
    state.words[target] = word;
    renderWindow(true);
    setStatus(SAVED);
  }
  function deleteWord(id){
    var index = findWord(id);
    if (index < 0) return;
    state.words.splice(index, 1);
    renderWindow(true);
    setStatus(SAVED);
  }

  function openDialog(kind, id, trigger){
    var draft;
    if (id) {
      var index = findWord(id);
      if (index < 0) return;
      draft = {
        kind: state.words[index].kind,
        code: state.words[index].code,
        content: state.words[index].content,
        pinyin: state.words[index].pinyin
      };
      kind = draft.kind;
    } else {
      draft = { kind: kind, code:'', content:'', pinyin:'' };
    }
    dialog = { kind: kind, id: id || null, trigger: trigger || null };
    renderDialog(draft);
    var first = document.getElementById('f-code') || document.getElementById('f-content');
    if (first) { first.focus(); if (first.select) first.select(); }
  }
  function renderDialog(draft){
    var isShort = dialog.kind === 'shortcode';
    var html = '<div class="overlay" data-act="dialog-backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
      '<h3 id="sheetTitle">' + (isShort ? '编辑短码短语' : '编辑拼音词') + '</h3>';
    if (isShort) {
      html += '<div class="field"><label class="field__label" for="f-code">编码（小写字母，1–32 个）</label>' +
        '<input class="input mono" id="f-code" value="' + esc(draft.code) + '" autocomplete="off"></div>' +
        '<div class="field"><label class="field__label" for="f-content">内容（原样上屏，可含空格换行，≤512 字符）</label>' +
        '<textarea class="textarea" id="f-content" rows="4">' + esc(draft.content) + '</textarea></div>';
    } else {
      html += '<div class="field"><label class="field__label" for="f-content">内容（1–16 个汉字）</label>' +
        '<input class="input" id="f-content" value="' + esc(draft.content) + '" autocomplete="off"></div>' +
        '<div class="field"><label class="field__label" for="f-pinyin">读音（如 hui' + "'" + 'yi，每字一个音节）</label>' +
        '<div class="field__row"><input class="input mono" id="f-pinyin" value="' + esc(draft.pinyin) + '" autocomplete="off">' +
        '<button type="button" class="btn btn--sm" data-act="auto-pinyin">自动读音</button></div></div>';
    }
    html += '<p class="sheet__msg" data-role="sheetMsg" hidden></p>' +
      '<div class="sheet__actions"><button type="button" class="btn" data-act="dialog-cancel">取消</button>' +
      '<button type="button" class="btn btn--primary" data-act="dialog-save">保存</button></div>' +
      '</div></div>';
    document.getElementById('overlayHost').innerHTML = html;
  }
  function closeDialog(){
    var trigger = dialog ? dialog.trigger : null;
    dialog = null;
    document.getElementById('overlayHost').innerHTML = '';
    if (trigger && trigger.isConnected) trigger.focus();
  }
  function sheetMsg(text, hint){
    var node = document.querySelector('[data-role="sheetMsg"]');
    if (!node) return;
    node.hidden = false;
    node.textContent = text;
    if (hint) node.classList.add('sheet__msg--hint');
    else node.classList.remove('sheet__msg--hint');
  }
  function saveDialog(){
    if (!dialog) return;
    var kind = dialog.kind;
    var codeNode = document.getElementById('f-code');
    var contentNode = document.getElementById('f-content');
    var pinyinNode = document.getElementById('f-pinyin');
    var code = codeNode ? codeNode.value.trim() : '';
    var content = contentNode ? contentNode.value : '';
    var pinyin = pinyinNode ? pinyinNode.value.trim() : '';

    if (kind === 'shortcode') {
      if (!/^[a-z]{1,32}$/.test(code)) { sheetMsg('编码需为 1–32 个小写字母。'); return; }
      if (!content.trim()) { sheetMsg('内容不能为空。'); return; }
      if (content.length > 512) { sheetMsg('内容最多 512 个字符。'); return; }
    } else {
      if (!content.trim()) { sheetMsg('内容不能为空。'); return; }
      if (Array.from(content).length > 16) { sheetMsg('内容最多 16 个汉字。'); return; }
      if (!pinyin) { sheetMsg('读音不能为空，每字一个音节。'); return; }
    }

    if (dialog.id) {
      var index = findWord(dialog.id);
      if (index >= 0) {
        state.words[index].code = code;
        state.words[index].content = content;
        state.words[index].pinyin = pinyin;
      }
    } else {
      seq += 1;
      state.words.push({ id:'w' + seq, kind:kind, enabled:true, code:code, content:content, pinyin:pinyin, sample:false });
    }
    closeDialog();
    renderWindow(true);
    setStatus(WORD_SAVED);
  }
  function autoPinyin(){
    var contentNode = document.getElementById('f-content');
    var content = contentNode ? contentNode.value : '';
    if (!content.trim()) { sheetMsg('先填写内容，再自动读音。', true); return; }
    sheetMsg('原型不连接读音词典，自动读音只在原生应用中可用。', true);
  }

  /* ---------- 底部排版条 ---------- */
  function buildLayouts(){
    var host = document.getElementById('layoutOpts');
    if (!host) return;
    host.innerHTML = LAYOUTS.map(function (item) {
      return '<button type="button" class="seg__btn" data-act="fz-layout" data-layout-id="' + item.id +
        '" aria-pressed="false" title="' + esc(item.desc) + '">' + item.seg + '</button>';
    }).join('');
  }

  /* ---------- 自检钩子（不参与界面） ---------- */
  window.__gogakuProto = {
    pages: PAGES.map(function (p) { return p.title; }),
    layouts: LAYOUTS.map(function (l) { return l.id; }),
    fuzzyCodes: FUZZY_ORDER.slice(),
    groups: FUZZY_GROUPS.map(function (g) { return { id:g.id, name:g.name, codes:g.codes.slice() }; }),
    countText: fzCountText,
    renderLayout: function (id) {
      if (findById(LAYOUTS, id)) state.fzLayout = id;
      return fuzzyPanel();
    },
    setFuzzy: function (codes) {
      state.fuzzy = new Set(codes || []);
      return fuzzyPanel();
    },
    renderPage: function (id) { state.page = id; return shellA(); },
    state: state
  };

  /* ---------- 初始化 ---------- */
  function init(){
    var params = new URLSearchParams(window.location.search);
    var layout = params.get('layout');
    if (findById(LAYOUTS, layout)) state.fzLayout = layout;
    document.documentElement.setAttribute('data-theme', 'brand');
    document.documentElement.setAttribute('data-layout', 'rows');
    document.documentElement.setAttribute('data-fz', state.fzLayout);
    buildLayouts();
    syncLayoutButtons();
    updateLayoutName();
    applyAppearance();
    renderWindow(false);
    fitStage();
    syncPad();
    writeUrl();
    if (mq.addEventListener) mq.addEventListener('change', function () { if (state.appearance === 'auto') applyAppearance(); });
    window.addEventListener('resize', function () {
      fitStage();
      syncPad();
      if (state.appModalOpen) keepOverlayVisible();
    });
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', function (event) {
    var el = event.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    switch (act) {
      case 'fz-layout': setLayout(el.getAttribute('data-layout-id')); if (event.detail > 0) el.blur(); break;
      case 'appearance': setAppearance(el.getAttribute('data-appearance')); break;
      case 'winsize': setWinSize(Number(el.getAttribute('data-w')), Number(el.getAttribute('data-h'))); break;
      case 'page': setPage(el.getAttribute('data-page')); break;
      case 'step': stepFont(Number(el.getAttribute('data-delta'))); break;
      case 'install': setStatus(SAVED); break;
      case 'refresh-resources':
      case 'refresh-records':
      case 'record-dismiss':
      case 'record-delete':
        setStatus(SAVED); break;
      case 'clear-freq': setStatus(CLEARED); break;
      case 'app-modal-open': openAppModal(); break;
      case 'app-modal-close': closeAppModal(); break;
      case 'app-modal-backdrop': if (event.target === el) closeAppModal(); break;
      case 'app-add': addApp(el.getAttribute('data-app-id')); break;
      case 'app-remove': removeApp(el.getAttribute('data-app-id')); break;
      case 'fuzzy-all': setAllFuzzy(true); refocusBatch('fuzzy-all'); break;
      case 'fuzzy-none': setAllFuzzy(false); refocusBatch('fuzzy-none'); break;
      case 'word-add': openDialog(el.getAttribute('data-kind'), null, el); break;
      case 'word-edit': openDialog(null, el.getAttribute('data-id'), el); break;
      case 'word-delete': deleteWord(el.getAttribute('data-id')); break;
      case 'word-up': moveWord(el.getAttribute('data-id'), -1); break;
      case 'word-down': moveWord(el.getAttribute('data-id'), 1); break;
      case 'dialog-cancel': closeDialog(); break;
      case 'dialog-save': saveDialog(); break;
      case 'auto-pinyin': autoPinyin(); break;
      case 'dialog-backdrop': if (event.target === el) closeDialog(); break;
    }
  });

  document.addEventListener('change', function (event) {
    var t = event.target;
    if (t.matches('input[type="radio"][data-key]')) {
      var key = t.getAttribute('data-key');
      state[key] = t.getAttribute('data-cast') === 'bool' ? t.value === 'true' : t.value;
      var group = t.closest('.radios');
      if (group) {
        var radios = group.querySelectorAll('.radio');
        for (var i = 0; i < radios.length; i++) {
          var input = radios[i].querySelector('input');
          radios[i].classList.toggle('is-on', !!(input && input.checked));
        }
      }
      setStatus(SAVED);
      return;
    }
    if (t.matches('input[type="checkbox"][data-key]')) {
      state[t.getAttribute('data-key')] = t.checked;
      setStatus(SAVED);
      return;
    }
    if (t.matches('input[data-app-toggle]')) {
      var appItem = appById(t.getAttribute('data-app-toggle'));
      if (appItem) appItem.enabled = t.checked;
      syncAppSummary();
      setStatus(SAVED);
      return;
    }
    if (t.matches('input[data-fuzzy]')) {
      var code = t.getAttribute('data-fuzzy');
      if (t.checked) state.fuzzy.add(code); else state.fuzzy.delete(code);
      paintFuzzy();
      setStatus(SAVED);
      return;
    }
    if (t.matches('input[data-word-enabled]')) {
      var index = findWord(t.getAttribute('data-word-enabled'));
      if (index >= 0) state.words[index].enabled = t.checked;
      var rowNode = t.closest('.word');
      if (rowNode) rowNode.classList.toggle('is-off', !t.checked);
      setStatus(SAVED);
      return;
    }
    if (t.matches('select[data-key]')) {
      state[t.getAttribute('data-key')] = t.value;
      setStatus(SAVED);
    }
  });

  document.addEventListener('input', function (event) {
    var t = event.target;
    if (t.matches('[data-role="app-search"]')) {
      state.queries.modal = t.value;
      refreshModalList(false);
      return;
    }
    if (!t.matches('[data-key]')) return;
    if (t.tagName !== 'TEXTAREA' && t.type !== 'text') return;
    var value = t.value;
    if (t.classList.contains('keyinput')) {
      value = value.slice(0, 1).toLowerCase();
      if (t.value !== value) t.value = value;
    }
    state[t.getAttribute('data-key')] = value;
    setStatus(SAVED);
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      if (dialog) { closeDialog(); return; }
      if (state.appModalOpen) { closeAppModal(); return; }
    }
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    if (event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
    if (dialog || state.appModalOpen) return;
    var target = event.target;
    if (target instanceof Element && target.closest('input, textarea, select, option, button, a[href], [contenteditable]')) return;
    event.preventDefault();
    var index = -1;
    for (var i = 0; i < LAYOUTS.length; i++) if (LAYOUTS[i].id === state.fzLayout) index = i;
    if (index < 0) index = 0;
    var next = event.key === 'ArrowLeft' ? (index + LAYOUTS.length - 1) % LAYOUTS.length : (index + 1) % LAYOUTS.length;
    setLayout(LAYOUTS[next].id);
  });

  var root = document.getElementById('winBody');
  if (root) init();
})();
</script>
</body>
</html>
