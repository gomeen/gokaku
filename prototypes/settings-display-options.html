<!doctype html>
<html lang="zh-CN" data-theme="brand" data-appearance="light" data-layout="rows">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Gogaku 设置 · 字号 / 显示内容 / 词语列表 / 快捷键的显示方式</title>
<style>
/* ==================================================================
   令牌：主题固定为青绿（brand），只保留浅 / 深两套。
   ================================================================== */
:root{
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --mono:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --dot-r:#ec6a5e; --dot-y:#f4bf4f; --dot-g:#61c554;
}

/* —— brand（Gogaku 青绿）· 浅色 —— */
html[data-theme="brand"][data-appearance="light"]{
  --stage:#e5ece8;
  --win-bg:#f5f8f6;
  --titlebar:#e7efe9;
  --side-bg:#edf3ef;
  --panel:#ffffff;
  --border:#d8e3dc;
  --border-strong:#c2d2c9;
  --hairline:#e8f0ea;
  --fg:#1c2b25;
  --fg-2:#5b6f66;
  --fg-3:#7d8f86;
  --accent:#12996a;
  --accent-fg:#ffffff;
  --accent-text:#0d7a53;
  --accent-soft:rgba(18,153,106,.12);
  --accent-ring:rgba(18,153,106,.25);
  --switch-off:#d4e0d9;
  --knob:#ffffff;
  --ta-tint:rgba(18,153,106,.04);
  --btn-hover:#eef5f1;
  --tag-bg:#edf4f0;
  --ok:#1f8a4c;
  --shadow:0 18px 44px rgba(22,40,32,.16), 0 2px 8px rgba(22,40,32,.08);
}
/* —— brand（Gogaku 青绿）· 深色 —— */
html[data-theme="brand"][data-appearance="dark"]{
  --stage:#101713;
  --win-bg:#18211c;
  --titlebar:#1d2822;
  --side-bg:#141c17;
  --panel:#1f2a24;
  --border:#2e3d35;
  --border-strong:#3c4f45;
  --hairline:#263129;
  --fg:#edf4f0;
  --fg-2:#a7b8af;
  --fg-3:#7f9188;
  --accent:#34c48c;
  --accent-fg:#08150f;
  --accent-text:#5ad9a4;
  --accent-soft:rgba(52,196,140,.16);
  --accent-ring:rgba(52,196,140,.28);
  --switch-off:rgba(255,255,255,.14);
  --knob:#ffffff;
  --ta-tint:rgba(255,255,255,.04);
  --btn-hover:#26332c;
  --tag-bg:#22302a;
  --ok:#4cc47f;
  --shadow:0 18px 44px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
}

/* 外观共用的中性令牌（提示条、危险色、原型切换条） */
html[data-appearance="light"]{
  color-scheme:light;
  --warning-bg:#fcf3de;
  --warning-border:#e3cd97;
  --warning-fg:#6a4a10;
  --danger:#b3261e;
  --danger-soft:rgba(179,38,30,.08);
  --danger-line:rgba(179,38,30,.35);
  --scrim:rgba(24,20,12,.34);
  --sw-bg:rgba(250,250,251,.93);
  --sw-border:#d7d7db;
  --sw-panel:#ffffff;
  --sw-fg:#1d1d1f;
  --sw-fg-2:#6e6e73;
  --sw-on-bg:#1d1d1f;
  --sw-on-fg:#ffffff;
}
html[data-appearance="dark"]{
  color-scheme:dark;
  --warning-bg:#2a2215;
  --warning-border:#5c4a27;
  --warning-fg:#e8cd93;
  --danger:#ff6b5e;
  --danger-soft:rgba(255,107,94,.12);
  --danger-line:rgba(255,107,94,.4);
  --scrim:rgba(0,0,0,.55);
  --sw-bg:rgba(22,22,24,.92);
  --sw-border:#3a3a3c;
  --sw-panel:#2c2c2e;
  --sw-fg:#f5f5f7;
  --sw-fg-2:#a1a1a6;
  --sw-on-bg:#f5f5f7;
  --sw-on-fg:#1c1c1e;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--stage);
  color:var(--fg);
  font-family:var(--font);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:0 0 220px; /* 由 JS 按切换条实际高度再补一次 */
}
h1,h2,h3,p{ margin:0; }
button{ font-family:inherit; }
[hidden]{ display:none !important; }

:focus-visible{ outline:2px solid var(--accent-ring); outline-offset:2px; }

/* 行度量：固定 rows + native */
:root{
  --row-h:44px;
  --row-vpad:9px;
  --row-dvpad:11px;
  --radio-col:320px;
}

/* ==================================================================
   原型外壳
   ================================================================== */
.chrome{ max-width:948px; margin:0 auto; padding:26px 24px 0; }
.eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--fg-2);
}
h1{ font-size:25px; line-height:1.25; font-weight:650; letter-spacing:-.015em; margin:8px 0 14px; }
.notice{
  border:1px solid var(--warning-border); background:var(--warning-bg); color:var(--warning-fg);
  border-radius:9px; padding:10px 13px; font-size:12px; line-height:1.65;
}
.notice strong{ font-weight:650; }
.notice code{ font-family:var(--mono); font-size:11px; }

.proto{ max-width:948px; margin:16px auto 0; padding:0 24px; }
.proto__inner{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px;
  padding:8px 12px; border:1px dashed var(--border-strong); border-radius:8px;
}
.proto__label{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--fg-3); text-transform:uppercase; }
.proto__group{ display:flex; align-items:center; gap:8px; }
.proto__group--now{ margin-left:auto; }
.proto__name{ font-size:10.5px; color:var(--fg-2); }
.proto__now{
  font-family:var(--mono); font-size:10.5px; padding:3px 8px;
  border:1px solid var(--border); border-radius:6px; background:var(--win-bg); color:var(--fg);
  white-space:nowrap;
}

.seg{ display:inline-flex; padding:2px; gap:2px; border:1px solid var(--border); border-radius:7px; background:var(--win-bg); }
.seg__btn{
  border:0; background:transparent; color:var(--fg-2); cursor:pointer;
  font-size:11.5px; padding:3px 9px; border-radius:5px; line-height:1.4;
}
.seg__btn:hover{ color:var(--fg); }
.seg__btn[aria-pressed="true"]{ background:var(--fg); color:var(--win-bg); }

.stage-outer{ max-width:948px; margin:18px auto 0; padding:0 24px 8px; }
.stage{ display:flex; justify-content:center; overflow:hidden; }
.stage__fit{ transform-origin:top center; }

.window{
  position:relative; display:flex; flex-direction:column;
  width:900px; height:620px;
  background:var(--win-bg); border:1px solid var(--border); border-radius:11px;
  box-shadow:var(--shadow); overflow:hidden;
}
.window[data-win="760"]{ width:760px; height:520px; }
.titlebar{
  flex:0 0 38px; display:flex; align-items:center; gap:7px;
  padding:0 13px; background:var(--titlebar); border-bottom:1px solid var(--border);
  position:relative;
}
.dot{ width:11px; height:11px; border-radius:50%; display:block; }
.dot--r{ background:var(--dot-r); } .dot--y{ background:var(--dot-y); } .dot--g{ background:var(--dot-g); }
.titlebar__title{
  position:absolute; left:50%; transform:translateX(-50%);
  font-size:12px; font-weight:600; color:var(--fg-2); letter-spacing:.01em;
}
.window__body{ flex:1 1 auto; min-height:0; position:relative; overflow:hidden; }

.switcher{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--sw-bg); border-top:1px solid var(--sw-border);
  box-shadow:0 -8px 24px rgba(0,0,0,.10);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.switcher__inner{
  max-width:948px; margin:0 auto; padding:9px 24px 11px;
  display:flex; flex-direction:column; gap:6px;
}
.switcher__row{ display:flex; align-items:center; flex-wrap:wrap; gap:7px 12px; min-width:0; }
.switcher__label{
  flex:0 0 56px; font-size:10.5px; font-weight:600;
  letter-spacing:.04em; color:var(--sw-fg-2);
}
.switcher .seg{ background:var(--sw-panel); border-color:var(--sw-border); }
.switcher .seg__btn{ color:var(--sw-fg-2); padding:4px 10px; font-size:12px; }
.switcher .seg__btn:hover{ color:var(--sw-fg); }
.switcher .seg__btn[aria-pressed="true"]{ background:var(--sw-on-bg); color:var(--sw-on-fg); }
.switcher__hint{
  margin-left:auto; flex:0 0 auto; font-family:var(--mono); font-size:10.5px;
  color:var(--sw-fg-2); letter-spacing:.04em; white-space:nowrap;
}

/* ==================================================================
   布局 A 骨架：200pt 文字侧栏 + 页头 + 滚动区 + 状态栏
   ================================================================== */
.shell{ height:100%; }
.shell--a{ display:grid; grid-template-columns:200px minmax(0,1fr); }
.side{
  background:var(--side-bg); border-right:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0;
}
.side__title{ font-size:14px; font-weight:600; letter-spacing:-.01em; padding:18px 16px 10px; }
.nav{ display:flex; flex-direction:column; gap:1px; padding:0 8px; overflow-y:auto; }
.nav__item{
  border:0; background:transparent; text-align:left; cursor:pointer;
  font-size:13px; color:var(--fg); line-height:1.4;
  padding:6px 10px; border-radius:6px;
}
.nav__item:hover{ background:rgba(127,127,127,.13); }
.nav__item[aria-current="page"]{ background:var(--accent-soft); color:var(--accent-text); font-weight:600; }
.nav__item:focus-visible{ outline-offset:-1px; box-shadow:inset 0 0 0 1px var(--accent); }
.side__foot{ margin-top:auto; padding:12px 16px 14px; display:flex; flex-direction:column; gap:3px; }
.side__meta{ font-size:11px; color:var(--fg-2); }
.side__ver{ font-family:var(--mono); font-size:10px; color:var(--fg-3); }

.main{ display:flex; flex-direction:column; min-width:0; min-height:0; }
.pagehead{ flex:0 0 auto; padding:22px 26px 14px; }
.pagehead h2{ font-size:22px; font-weight:600; letter-spacing:-.015em; }
.pagehead p{ margin-top:6px; font-size:12px; color:var(--fg-2); }
.scroller{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:2px 26px 18px; }

.section__title{ font-size:15px; font-weight:600; letter-spacing:-.005em; }
.section__lead{ font-size:12px; color:var(--fg-2); margin:5px 0 10px; line-height:1.55; }
.section + .section{ margin-top:18px; }
.hr{ border:0; border-top:1px solid var(--hairline); margin:18px 0; }

.panel{ border:1px solid var(--border); border-radius:9px; background:var(--panel); margin:0; }
.panel + .panel{ margin-top:18px; }
.panel__title{ font-size:12.5px; font-weight:600; padding:12px 14px 0; letter-spacing:.01em; }
.panel__body{ padding:2px 14px 10px; }

.row{ display:flex; align-items:center; gap:16px; min-height:var(--row-h); padding:var(--row-vpad) 0; }
.row + .row{ border-top:1px solid var(--hairline); }
.row--detail{ align-items:flex-start; padding:var(--row-dvpad) 0; }
.row__text{ flex:1 1 auto; min-width:0; }
.row__label{ font-size:13px; line-height:1.45; }
.row__label [data-role="fontsize"]{
  color:var(--accent-text); font-weight:600; font-variant-numeric:tabular-nums;
}
.row__detail{ font-size:11px; line-height:1.5; color:var(--fg-2); margin-top:3px; }
.row__control{
  flex:0 0 auto; display:flex; align-items:center; justify-content:flex-end;
  gap:8px; min-height:19px;
}
html[data-layout="rows"] .row:has(> .row__control > .radios) > .row__control{
  flex:0 0 var(--radio-col); width:var(--radio-col);
}

.a-scheme{ padding-bottom:2px; }
.a-scheme .muted{ margin-top:8px; }
.subblock{ margin-top:12px; border-top:1px solid var(--hairline); padding-top:10px; }
.subhead{ font-size:12px; font-weight:600; margin:0 0 6px; }
.muted{ color:var(--fg-2); }
.small{ font-size:11px; line-height:1.55; }
.mono{ font-family:var(--mono); }
.body-text{ font-size:12.5px; line-height:1.6; margin-bottom:8px; }
.caption{ font-size:10.5px; color:var(--fg-3); letter-spacing:.04em; margin:12px 0 6px; }
.sample-note{
  font-size:11px; color:var(--fg-2); line-height:1.5;
  background:var(--tag-bg); border-radius:6px; padding:5px 8px; margin:6px 0 8px;
}
.tag{
  display:inline-block; font-size:9.5px; line-height:1.5; padding:0 4px; margin-left:5px;
  border-radius:4px; border:1px solid var(--warning-border); color:var(--warning-fg);
  background:var(--warning-bg); vertical-align:1px; letter-spacing:.02em; white-space:nowrap;
}
.inline{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 0 4px; }
.listhead{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.kbd{
  font-family:var(--mono); font-size:11.5px; color:var(--fg-2);
  border:1px solid var(--border); border-bottom-width:2px; border-radius:5px;
  padding:1px 6px; background:var(--tag-bg); white-space:nowrap;
}

.statusbar{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  padding:0 26px; min-height:36px;
  border-top:1px solid var(--border); background:var(--win-bg);
  font-size:11px; color:var(--fg-2);
}
.statusbar__dot{ flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:var(--fg-3); }
.statusbar[data-tone="saved"] .statusbar__dot{ background:var(--ok); }
.statusbar__text{ line-height:1.4; min-width:0; }
.statusbar__hint{ margin-left:auto; flex:0 0 auto; font-size:10.5px; color:var(--fg-3); white-space:nowrap; }

/* ==================================================================
   基础控件（固定 native 一套）
   ================================================================== */
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--border-strong); background:var(--panel); color:var(--fg);
  font-size:12px; line-height:1; height:24px; padding:0 11px; border-radius:6px;
  cursor:pointer; white-space:nowrap;
}
.btn:hover{ background:var(--btn-hover); }
.btn:active{ box-shadow:inset 0 1px 2px rgba(0,0,0,.08); }
.btn:disabled{ opacity:.42; cursor:default; }
.btn--primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-fg); height:24px; }
.btn--primary:hover{ background:var(--accent); }
.btn--sm{ font-size:11.5px; height:22px; padding:0 9px; }
.btn--xs{ font-size:11px; height:20px; padding:0 7px; border-radius:5px; }
.btn:focus-visible{ border-color:var(--accent); }

.switch{ position:relative; display:inline-flex; align-items:center; cursor:pointer; flex:0 0 auto; width:34px; height:20px; }
.switch input{ position:absolute; opacity:0; width:1px; height:1px; margin:0; }
.switch__ui{
  display:block; position:relative; width:34px; height:20px; flex:0 0 auto;
  border-radius:999px; background:var(--switch-off); transition:background .14s ease;
}
.switch__ui::after{
  content:""; position:absolute; top:2px; left:2px; width:16px; height:16px;
  border-radius:50%; background:var(--knob);
  box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .14s ease;
}
.switch input:checked + .switch__ui{ background:var(--accent); }
.switch input:checked + .switch__ui::after{ transform:translateX(14px); }
.switch--mini{ width:30px; height:18px; }
.switch--mini .switch__ui{ width:30px; height:18px; }
.switch--mini .switch__ui::after{ top:2px; left:2px; width:14px; height:14px; }
.switch--mini input:checked + .switch__ui::after{ transform:translateX(12px); }
.switch input:focus-visible + .switch__ui{
  outline:2px solid var(--accent-ring); outline-offset:2px;
  box-shadow:0 0 0 1px var(--accent);
}

.radios{ display:flex; flex-direction:column; gap:6px; }
.radio{ position:relative; display:inline-flex; align-items:center; gap:7px; font-size:12px; cursor:pointer; }
.radio input{ position:absolute; opacity:0; width:1px; height:1px; margin:0; }
.radio__ui{
  flex:0 0 auto; width:16px; height:16px; border-radius:50%;
  border:1px solid var(--border-strong); background:var(--panel);
  display:grid; place-items:center;
  transition:border-color .12s ease, background .12s ease;
}
.radio input:checked + .radio__ui{ border-color:var(--accent); }
.radio input:checked + .radio__ui::after{
  content:""; width:6px; height:6px; border-radius:50%; background:var(--accent);
}
.radio input:focus-visible + .radio__ui{ border-color:var(--accent); outline:2px solid var(--accent-ring); outline-offset:2px; }
.radio__label{ line-height:1.4; }

.stepper{ display:inline-flex; flex-direction:column; border:1px solid var(--border-strong); border-radius:5px; background:var(--panel); }
.stepper__btn{
  width:20px; height:18px; border:0; border-radius:0; padding:0;
  background:transparent; font-size:0; line-height:0; cursor:pointer;
  display:grid; place-items:center;
}
.stepper__btn:hover{ background:var(--btn-hover); }
.stepper__btn:disabled{ opacity:.35; cursor:default; }
.stepper__btn:first-of-type{ border-radius:4px 4px 0 0; }
.stepper__btn:last-of-type{ border-radius:0 0 4px 4px; border-top:1px solid var(--border); }
.stepper__btn::before{
  content:""; width:0; height:0;
  border-left:4px solid transparent; border-right:4px solid transparent;
}
.stepper__btn:first-of-type::before{ border-bottom:5px solid var(--fg-2); }
.stepper__btn:last-of-type::before{ border-top:5px solid var(--fg-2); }
.stepper__value{ display:none; }

.input,.textarea,.select{
  font-family:inherit; font-size:12px; color:var(--fg); background:var(--panel);
  border:1px solid var(--border-strong); border-radius:6px; padding:5px 8px;
}
.textarea{ display:block; width:100%; resize:vertical; line-height:1.5; min-height:0; }
.textarea.mono{ font-family:var(--mono); font-size:11.5px; line-height:1.5; }
.textarea{
  padding:8px 10px; border-radius:6px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.05);
}
.select{ padding:4px 6px; }
.shortcut{ display:flex; gap:6px; align-items:center; }
.shortcut .select{ max-width:170px; }

.input:focus-visible,.textarea:focus-visible,.select:focus-visible{
  outline:none; border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent), 0 0 0 3px var(--accent-ring);
}

/* ==================================================================
   轴一：候选字号 —— f1 步进 / f2 分段 / f3 滑块 / f4 预览优先
   ================================================================== */
.seg--size .seg__btn{ min-width:30px; padding:3px 7px; font-variant-numeric:tabular-nums; }
.fzsum{ font-size:10.5px; color:var(--fg-2); font-variant-numeric:tabular-nums; white-space:nowrap; }
.fzsum.mono{ font-family:var(--mono); }

.sliderrow{ display:flex; align-items:flex-end; gap:10px; }
.slidercol{ display:flex; flex-direction:column; gap:1px; }
.range{ width:150px; height:18px; margin:0; accent-color:var(--accent); cursor:pointer; }
.ticks{ display:flex; justify-content:space-between; width:150px; }
.ticks span{
  font-size:10px; color:var(--fg-3); font-variant-numeric:tabular-nums;
  cursor:pointer; padding:0 2px; border-radius:3px;
}
.ticks span.is-on{ color:var(--accent-text); font-weight:600; }

/* f4 预览优先 */
.pvblock{ padding:var(--row-dvpad) 0; }
.row + .pvblock, .pvblock + .row{ border-top:1px solid var(--hairline); }
.pvblock__head{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
.pvblock__body{ display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; }
.cand{
  --v:14;
  border:1px solid var(--border-strong); border-radius:8px; background:var(--panel);
  padding:4px; width:max-content; min-width:190px; flex:0 0 auto;
  box-shadow:0 6px 16px rgba(0,0,0,.09);
}
.cand__row{
  display:grid; grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center; gap:8px;
  height:calc(var(--v) * 46 / 21 * 1px);
  padding:0 6px; border-radius:5px;
}
.cand__row.is-active{ background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent-ring); }
.cand__txt{ font-size:calc(var(--v) * 1px); line-height:1.05; color:var(--fg); white-space:nowrap; }
.cand__note{
  font-size:calc((var(--v) - 1) * 1px); line-height:1.1; color:var(--fg-2);
  justify-self:end; white-space:nowrap;
}
.cand__idx{
  font-size:calc((var(--v) - 3) * 1px); line-height:1; color:var(--fg-3);
  justify-self:end; font-variant-numeric:tabular-nums; min-width:1em; text-align:right;
}
.pvctl{ display:flex; flex-direction:column; gap:8px; min-width:0; }
.pvctl__row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.pvctl__dots{ display:flex; align-items:center; gap:6px; }
.qdot{
  width:22px; height:22px; padding:0; border-radius:50%;
  border:1px solid var(--border-strong); background:var(--panel); cursor:pointer;
  font-size:10.5px; color:var(--fg-2); font-variant-numeric:tabular-nums;
  display:inline-grid; place-items:center;
}
.qdot:hover{ background:var(--btn-hover); }
.qdot.is-on{ background:var(--accent); border-color:var(--accent); color:var(--accent-fg); font-weight:600; }
.pvctl__note{ font-size:10.5px; color:var(--fg-3); }

/* ==================================================================
   轴二：显示内容 —— d1 单选 / d2 分段 / d3 卡片 / d4 开关 + 预览
   ================================================================== */
.dispblock{ padding:var(--row-dvpad) 0; }
.row + .dispblock, .dispblock + .row{ border-top:1px solid var(--hairline); }
.dispblock__head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.dispcardgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.dispcard{
  border:1px solid var(--border); border-radius:9px; background:var(--panel);
  padding:8px 10px 9px; cursor:pointer; min-width:0;
}
.dispcard:hover{ background:var(--btn-hover); }
.dispcard.is-on{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); background:var(--accent-soft); }
.dispcard__title{ font-size:12.5px; font-weight:600; }
.dispcard__sample{ font-family:var(--mono); font-size:13px; margin:3px 0 2px; letter-spacing:.02em; }
.dispcard__desc{ font-size:11px; line-height:1.45; color:var(--fg-2); }

.switchline{ display:flex; align-items:center; gap:8px; }
.preeditline{
  display:flex; align-items:center; flex-wrap:wrap; gap:2px;
  font-family:var(--mono); font-size:12.5px;
  border:1px solid var(--border); border-radius:8px; background:var(--tag-bg);
  padding:7px 10px; margin-top:8px;
}
.preeditline__label{ font-family:var(--font); font-size:11px; color:var(--fg-2); margin-right:4px; }
.preeditline .tag{ margin-left:8px; font-family:var(--font); }
.caret{ color:var(--accent); margin-left:1px; }

/* ==================================================================
   自定义词语 / 学习片段 / 编辑表单
   ================================================================== */
.words{ display:flex; flex-direction:column; margin:2px 0 6px; }
.word{ display:flex; align-items:center; gap:10px; padding:8px 0; }
.word + .word,.wordedit + .word{ border-top:1px solid var(--hairline); }
.word.is-off .word__text{ opacity:.5; }
.word__text{ flex:1 1 auto; min-width:0; }
.word__title{ font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:4px; min-width:0; }
.word__name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.word__sub{ font-size:11px; color:var(--fg-2); line-height:1.45; margin-top:1px; overflow-wrap:anywhere; }
.word__acts{ flex:0 0 auto; display:flex; gap:4px; }
.word__acts .btn{ white-space:nowrap; }

/* w2 表格 */
.wtable{ border:1px solid var(--border); border-radius:8px; overflow:hidden; margin:2px 0 8px; background:var(--panel); }
.wtable__head,.wtable__row{
  display:grid; align-items:center; gap:8px; padding:0 8px;
  grid-template-columns:32px minmax(0,1fr) minmax(0,1.15fr) 60px 92px;
}
.wtable__head{
  height:26px; background:var(--tag-bg); border-bottom:1px solid var(--border);
  font-size:10.5px; color:var(--fg-2); letter-spacing:.02em;
}
.wtable__row{ height:34px; font-size:11.5px; }
.wtable__row + .wtable__row{ border-top:1px solid var(--hairline); }
.wtable__row.is-off .wtable__cell{ opacity:.5; }
.wtable__cell{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wtable__cell.mono{ font-family:var(--mono); font-size:11px; }
.wtable__sort,.wtable__ops{ display:flex; align-items:center; gap:4px; }
.wtable__ops{ justify-content:flex-end; }

/* w3 双列卡片 */
.wcards{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:2px 0 8px; }
.wcard{
  border:1px solid var(--border); border-radius:8px; background:var(--panel);
  padding:8px 9px 7px; min-width:0; display:flex; flex-direction:column; gap:4px;
}
.wcard.is-off{ opacity:.55; }
.wcard__head{ display:flex; align-items:center; gap:6px; min-width:0; }
.wcard__title{
  flex:1 1 auto; min-width:0; font-size:12.5px; font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.wcard__sub{
  font-size:11px; color:var(--fg-2); line-height:1.45;
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.wcard__acts{ display:flex; justify-content:flex-end; gap:4px; }

/* w4 内联编辑 */
.wordedit{
  border-top:1px dashed var(--border-strong); background:var(--ta-tint);
  padding:9px 10px 10px; margin:0 0 8px;
}
.wordedit__grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.wfield{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.wfield--wide{ grid-column:1 / -1; }
.wfield__label{ font-size:10.5px; color:var(--fg-2); }
.wfield .input,.wfield .textarea{ width:100%; }
.wordedit__msg{ font-size:11px; color:var(--danger); margin-top:7px; }
.wordedit__foot{ display:flex; justify-content:flex-end; gap:6px; margin-top:8px; }

.empty{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  border:1px dashed var(--border-strong); border-radius:9px;
  padding:20px 12px; margin:0 0 12px; text-align:center;
}
.empty svg{ width:26px; height:26px; color:var(--fg-3); margin-bottom:2px; }
.empty__title{ font-size:14px; font-weight:600; }
.empty__desc{ font-size:11.5px; color:var(--fg-2); }

.overlay-host{ position:absolute; inset:0; z-index:40; pointer-events:none; }
.overlay{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  padding:18px; background:var(--scrim); pointer-events:auto; overflow:auto;
}
.sheet{
  width:420px; max-width:100%; background:var(--win-bg);
  border:1px solid var(--border); border-radius:10px;
  box-shadow:0 20px 50px rgba(0,0,0,.35); padding:16px 18px 14px;
}
.sheet h3{ font-size:15px; font-weight:650; margin-bottom:12px; }
.field{ margin-bottom:10px; }
.field__label{ display:block; font-size:11px; color:var(--fg-2); margin-bottom:4px; }
.field .input,.field .textarea{ width:100%; }
.field__row{ display:flex; gap:6px; align-items:center; }
.sheet__msg{ font-size:11px; color:var(--danger); margin:2px 0 8px; line-height:1.5; }
.sheet__msg--hint{ color:var(--fg-2); }
.sheet__actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }

/* ==================================================================
   按应用默认英文 / 排除应用 · 同一套行列表 + 弹层选择器
   ================================================================== */
.applead{ margin:0 0 10px; }
.apptoolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px 0 8px; }
.appcount{ font-size:11.5px; color:var(--fg-2); font-variant-numeric:tabular-nums; }
.applist{ display:flex; flex-direction:column; margin:0 0 2px; }
.appempty{
  border:1px dashed var(--border-strong); border-radius:8px;
  padding:16px 12px; text-align:center; font-size:11.5px; line-height:1.6; color:var(--fg-2);
}
.appicon{
  width:32px; height:32px; border-radius:8px; flex:0 0 auto;
  display:grid; place-items:center;
  font-size:11px; font-weight:700; color:#fff; letter-spacing:.02em;
  background:hsl(var(--hue), 48%, 38%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);
}
.approw{ display:flex; align-items:center; gap:10px; padding:7px 0; min-width:0; }
.approw + .approw{ border-top:1px solid var(--hairline); }
.approw__text{ flex:1 1 auto; min-width:0; }
.approw__name{ font-size:13px; line-height:1.35; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.approw__id{ font-family:var(--mono); font-size:11px; color:var(--fg-2); line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.approw__ctl{ flex:0 0 auto; display:flex; align-items:center; gap:6px; }

.iconbtn{
  width:20px; height:20px; flex:0 0 auto; border:0; border-radius:5px;
  background:transparent; color:var(--fg-3); font-size:15px; line-height:1;
  display:grid; place-items:center; cursor:pointer; opacity:.5;
  transition:opacity .12s ease, background .12s ease, color .12s ease;
}
.approw:hover .iconbtn,.addrow:hover .iconbtn,.iconbtn:focus-visible{ opacity:1; }
.iconbtn:hover{ color:var(--danger); background:var(--danger-soft); }

.search{ position:relative; display:flex; align-items:center; min-width:0; flex:1 1 auto; }
.search svg{
  position:absolute; left:8px; top:50%; transform:translateY(-50%);
  width:13px; height:13px; color:var(--fg-3); pointer-events:none;
}
.search .input{ width:100%; padding-left:26px; }

.sheet--apps{
  width:420px; padding:0; overflow:hidden;
  display:flex; flex-direction:column; max-height:calc(100% - 32px);
}
.appmodal__head{
  flex:0 0 auto; display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  padding:14px 16px 8px;
}
.appmodal__head h3{ margin:0; }
.appmodal__count{ font-size:10.5px; color:var(--fg-3); font-variant-numeric:tabular-nums; }
.appmodal__search{ flex:0 0 auto; padding:0 16px 8px; }
.appmodal__list{
  flex:1 1 auto; min-height:120px; max-height:280px; overflow-y:auto;
  padding:0 8px 6px;
}
.appmodal__foot{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:9px 16px 12px; border-top:1px solid var(--hairline);
}
.addrow{
  width:100%; display:flex; align-items:center; gap:10px;
  border:0; background:transparent; color:var(--fg); text-align:left;
  padding:6px 8px; border-radius:7px; cursor:pointer; min-width:0;
}
.addrow:hover{ background:var(--btn-hover); }
.addrow:disabled{ cursor:default; }
.addrow.is-added{ opacity:.52; }
.addrow .appicon{ width:28px; height:28px; border-radius:7px; font-size:10px; }
.addrow__text{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.addrow__name{ font-size:12.5px; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.addrow__id{ font-size:10.5px; color:var(--fg-2); line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.addrow__state{ flex:0 0 auto; font-size:11px; color:var(--accent-text); }
.addrow.is-added .addrow__state{ color:var(--fg-3); }

/* ==================================================================
   模糊音多选 · 固定 p3（按音类分三列：列头 + 组内 3 项）
   ================================================================== */
.fzhead{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; min-height:22px; margin-bottom:6px;
}
.fzhead__title{ font-size:12px; font-weight:600; letter-spacing:.01em; white-space:nowrap; }
.fzhead__right{ display:flex; align-items:center; gap:6px; min-width:0; }
.fzcount{
  font-size:11.5px; color:var(--fg-2); font-variant-numeric:tabular-nums;
  white-space:nowrap; letter-spacing:.01em;
}
.fzhead__right .fzcount{ margin-right:2px; }

.fzopt{
  position:relative; display:flex; align-items:flex-start; gap:6px;
  min-width:0; cursor:pointer; border-radius:5px;
}
.fzopt input{ position:absolute; opacity:0; width:1px; height:1px; margin:0; }
.fzbox{
  flex:0 0 auto; width:14px; height:14px; margin-top:1px; border-radius:3.5px;
  border:1px solid var(--border-strong); background:var(--panel);
  display:grid; place-items:center;
  transition:background .12s ease, border-color .12s ease;
}
.fzbox::after{
  content:""; width:3px; height:6px;
  border-right:1.6px solid transparent; border-bottom:1.6px solid transparent;
  transform:rotate(45deg);
}
.fzopt input:checked + .fzbox{ background:var(--accent); border-color:var(--accent); }
.fzopt input:checked + .fzbox::after{ border-right-color:var(--accent-fg); border-bottom-color:var(--accent-fg); }
.fzopt:has(input:focus-visible){ outline:2px solid var(--accent-ring); outline-offset:1px; }
@supports not selector(:has(*)){
  .fzopt input:focus-visible + .fzbox{ outline:2px solid var(--accent-ring); outline-offset:2px; }
}

.fzopt__text{ min-width:0; display:flex; flex-direction:column; }
.fzo__code{ font-family:var(--mono); font-size:11px; line-height:1.45; color:var(--fg); }
.fzo__note{ font-size:10.5px; line-height:1.45; color:var(--fg-2); }

/* p3 · 按音类分三列：每列一个列头 + 组内纵向 3 项 */
.fzp3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 16px; margin-top:2px; }
.fzp3__head{
  font-size:11px; font-weight:600; color:var(--fg-2); letter-spacing:.02em;
  padding:0 0 5px; border-bottom:1px solid var(--border); margin-bottom:4px;
}
.fzp3__items{ display:flex; flex-direction:column; }
.fzopt--p3{ padding:4px 0; }

/* 760×520 降级：p3 三列 → 三行分组堆叠（组内仍横排 3 列） */
.window[data-win="760"] .fzp3{ display:flex; flex-direction:column; }
.window[data-win="760"] .fzp3__group{
  display:grid; grid-template-columns:82px minmax(0,1fr); gap:4px 10px;
  align-items:start; padding:7px 0;
}
.window[data-win="760"] .fzp3__group + .fzp3__group{ border-top:1px solid var(--hairline); }
.window[data-win="760"] .fzp3__head{
  border-bottom:0; padding:3px 0 0; margin:0; color:var(--fg-2);
}
.window[data-win="760"] .fzp3__items{
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 12px;
}
.window[data-win="760"] .fzopt--p3{ padding:3px 0; }

/* ==================================================================
   轴四：快捷键录入（kbd 芯片 / 内联录制 / 弹层录制）
   ================================================================== */
.keyctl{ display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:6px; min-width:0; }
.keyctl__msg{ flex:0 0 100%; text-align:right; font-size:10.5px; line-height:1.4; color:var(--danger); white-space:nowrap; }
.keyctl__msg--hint{ color:var(--fg-2); }

.keyrec{
  display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px;
  border:1px solid var(--border-strong); border-radius:6px; background:var(--panel);
  font-size:12px; color:var(--fg); cursor:pointer; white-space:nowrap;
}
.keyrec:hover{ background:var(--btn-hover); }
.keyrec.is-unset{ color:var(--fg-3); }
.keyrec.is-rec{
  border-color:var(--accent); background:var(--accent-soft); color:var(--accent-text);
  box-shadow:0 0 0 3px var(--accent-ring);
}
.keyrec__hint{ font-size:11.5px; }
.keyrec__mods{ font-family:var(--mono); font-size:12px; letter-spacing:.06em; min-height:1em; }
.keychip{
  display:inline-flex; align-items:center; justify-content:center; height:22px; min-width:26px;
  padding:0 8px; border:1px solid var(--border); border-bottom-width:2px; border-radius:5px;
  background:var(--tag-bg); font-family:var(--mono); font-size:11.5px; color:var(--fg);
  white-space:nowrap;
}
.keychip.is-unset{ color:var(--fg-3); border-style:dashed; }

.sheet--keys{ width:380px; }
.keypad{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  border:1px dashed var(--border-strong); border-radius:9px; background:var(--ta-tint);
  padding:16px 14px; margin:2px 0 8px; min-height:92px; cursor:pointer;
}
.keypad:focus-visible{ outline:2px solid var(--accent-ring); outline-offset:2px; }
.keypad.is-rec{ border-style:solid; border-color:var(--accent); background:var(--accent-soft); }
.keypad__combo{
  font-family:var(--mono); font-size:22px; letter-spacing:.06em; line-height:1.25;
  color:var(--fg); min-height:28px; text-align:center; overflow-wrap:anywhere;
}
.keypad.is-rec .keypad__combo{ color:var(--accent-text); }
.keypad__hint{ font-size:11px; color:var(--fg-2); text-align:center; line-height:1.5; }

/* ==================================================================
   响应式（只作用于原型外壳）
   ================================================================== */
@media (max-width: 760px){
  .proto__group--now{ margin-left:0; }
  .notice{ font-size:11.5px; }
  .switcher__inner{ padding-left:14px; padding-right:14px; }
  .switcher .seg__btn{ padding:4px 8px; font-size:11.5px; }
  .switcher__hint{ margin-left:0; }
  .proto__now{ white-space:normal; overflow-wrap:anywhere; }
}
@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; }
}
</style>

<body>

<header class="chrome">
  <div class="eyebrow">GOGAKU · 可丢弃的视觉原型</div>
  <h1>字号、显示内容、词语列表：更多显示方式</h1>
  <div class="notice" role="note">
    <strong>这是可丢弃的视觉原型。</strong>四条轴互不影响，只比较显示方式；模糊音固定为「分组三列」、按应用默认英文固定为「行列表」。状态只在内存中：不读写真实配置、不联网、不持久化；「已保存」只是原型模拟；刷新后控件回到默认值，只有 <code>?size=&amp;display=&amp;words=&amp;keys</code> 由 URL 保持。<strong>页面上的词语与学习片段都是示例数据，不代表出厂内容</strong>（真实出厂为空表）。
  </div>
</header>

<div class="proto">
  <div class="proto__inner">
    <span class="proto__label">原型控制</span>
    <div class="proto__group">
      <span class="proto__name">外观</span>
      <div class="seg" role="group" aria-label="外观">
        <button type="button" class="seg__btn" data-act="appearance" data-appearance="auto" aria-pressed="true">跟随系统</button>
        <button type="button" class="seg__btn" data-act="appearance" data-appearance="light" aria-pressed="false">浅色</button>
        <button type="button" class="seg__btn" data-act="appearance" data-appearance="dark" aria-pressed="false">深色</button>
      </div>
    </div>
    <div class="proto__group">
      <span class="proto__name">窗口尺寸</span>
      <div class="seg" role="group" aria-label="窗口尺寸">
        <button type="button" class="seg__btn" data-act="winsize" data-w="900" data-h="620" aria-pressed="true">900×620</button>
        <button type="button" class="seg__btn" data-act="winsize" data-w="760" data-h="520" aria-pressed="false">760×520</button>
      </div>
    </div>
    <div class="proto__group proto__group--now">
      <span class="proto__name">当前组合</span>
      <span class="proto__now" id="comboName">f1 · d1 · w1 · k1</span>

</div>

<div class="stage-outer">
  <div class="stage" id="stage">
    <div class="stage__fit" id="fit">
      <div class="window" id="window" data-win="900">
        <div class="titlebar" aria-hidden="false">
          <span class="dot dot--r" aria-hidden="true"></span>
          <span class="dot dot--y" aria-hidden="true"></span>
          <span class="dot dot--g" aria-hidden="true"></span>
          <span class="titlebar__title">Gogaku 设置</span>
        </div>
        <div class="window__body" id="winBody"></div>
        <div class="overlay-host" id="overlayHost"></div>
      </div>

  <div class="switcher__inner" id="switcherInner"></div>
</div>

<script>
(function () {
  'use strict';

  var VERSION = '0.1.0-dev.1 构建3';
  var SAVED = '已保存 · 立即生效（原型模拟）';
  var IDLE = '修改后立即生效';
  var CLEARED = '已清空调频数据；自定义词语不受影响。（原型模拟）';
  var WORD_SAVED = '已保存；1 秒内在输入法中生效。（原型模拟）';

  var PAGES = [
    { id:'resources', title:'语言资源', subtitle:'管理中文与英语的本地翻译资源。' },
    { id:'normalInput', title:'普通输入', subtitle:'小鹤／全拼、模糊音、候选窗与英文候选。' },
    { id:'customWords', title:'自定义词语', subtitle:'短码短语与拼音词；保存后 1 秒内在输入法中生效。' },
    { id:'shortcuts', title:'快捷键', subtitle:'在 Gogaku 输入源激活时切换模式与快速添加。' },
    { id:'privacy', title:'学习与隐私', subtitle:'决定记录哪些学习内容，以及哪些输入无需提示。' },
    { id:'records', title:'学习片段', subtitle:'回顾最近 30 天采用的表达与主动尝试。' }
  ];

  /* ==================================================================

    if (state.axes.display === 'd3') return dispCardsBlock();
    if (state.axes.display === 'd4') return dispSwitchBlock();
    if (state.axes.display === 'd2') return row('显示内容', '', dispSeg());

  }
  function syncDisplay(){
    var full = state.fullPinyinPreedit;
    each('[data-act="disp-seg"]', function (b) {
      var on = (b.getAttribute('data-value') === 'full') === full;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    each('[data-act="disp-card"]', function (b) {
      var on = (b.getAttribute('data-value') === 'full') === full;
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-checked', on ? 'true' : 'false');
    });
    var raw = document.querySelector('[data-preedit="raw"]');
    if (raw) raw.checked = !full;
    each('[data-role="preeditSample"]', function (n) { n.textContent = full ? "ni'hao" : 'nihc'; });
    each('input[data-key="fullPinyinPreedit"]', function (r) {
      r.checked = r.value === String(full);
      var lab = r.closest('.radio');
      if (lab) lab.classList.toggle('is-on', r.checked);
    });
  }
  function setPreedit(full){
    if (state.fullPinyinPreedit === full) return;
    state.fullPinyinPreedit = full;
    syncDisplay();
    setStatus(SAVED);
  }

  /* ==================================================================
     轴三：自定义词语列表 · w1 行列表 / w2 表格 / w3 卡片 / w4 内联编辑
     ================================================================== */
  function wordTitle(w){ return w.kind === 'shortcode' ? w.code : w.content; }
  function wordSub(w){ return w.kind === 'shortcode' ? w.content.replace(/\n/g, ' ⏎ ') : w.pinyin; }

  function wordRow(w, index, total){
    var title = wordTitle(w);
    var kindName = w.kind === 'shortcode' ? '短码短语' : '拼音词';
    return '<div class="word' + (w.enabled ? '' : ' is-off') + '" data-word="' + w.id + '">' +
      miniSwitch('data-word-enabled="' + w.id + '"', w.enabled, '启用' + kindName + ' ' + title) +
      '<div class="word__text"><div class="word__title"><span class="word__name">' + esc(title) + '</span>' +
      (w.sample ? '<span class="tag">示例</span>' : '') + '</div>' +
      '<div class="word__sub">' + esc(wordSub(w)) + '</div></div>' +
      '<div class="word__acts">' +
      '<button type="button" class="btn btn--xs" data-act="word-up" data-id="' + w.id + '" aria-label="上移 ' + esc(title) + '"' + (index === 0 ? ' disabled' : '') + '>上</button>' +
      '<button type="button" class="btn btn--xs" data-act="word-down" data-id="' + w.id + '" aria-label="下移 ' + esc(title) + '"' + (index === total - 1 ? ' disabled' : '') + '>下</button>' +
      '<button type="button" class="btn btn--xs" data-act="word-edit" data-id="' + w.id + '" aria-label="编辑 ' + esc(title) + '">编辑</button>' +
      '<button type="button" class="btn btn--xs" data-act="word-delete" data-id="' + w.id + '" aria-label="删除 ' + esc(title) + '">删除</button>' +

  function wordTable(list){
    if (!list.length) return '<p class="muted small">暂无词条。</p>';
    var head = '<div class="wtable__head"><span>启用</span><span>编码或内容</span><span>读音或内容</span><span>排序</span><span>操作</span></div>';
    var rows = list.map(function (w, i) {
      var isShort = w.kind === 'shortcode';
      var col2 = isShort ? w.code : w.content;

      var title = wordTitle(w);
      return '<div class="wtable__row' + (w.enabled ? '' : ' is-off') + '" data-word="' + w.id + '">' +
        '<div class="wtable__cell">' + miniSwitch('data-word-enabled="' + w.id + '"', w.enabled, '启用 ' + title) + '</div>' +
        '<div class="wtable__cell mono" title="' + esc(col2) + '">' + esc(col2) + '</div>' +
        '<div class="wtable__cell" title="' + esc(col3) + '">' + esc(col3) + '</div>' +
        '<div class="wtable__cell wtable__sort">' +
          '<button type="button" class="btn btn--xs" data-act="word-up" data-id="' + w.id + '" aria-label="上移 ' + esc(title) + '"' + (i === 0 ? ' disabled' : '') + '>上</button>' +
          '<button type="button" class="btn btn--xs" data-act="word-down" data-id="' + w.id + '" aria-label="下移 ' + esc(title) + '"' + (i === list.length - 1 ? ' disabled' : '') + '>下</button>' +
        '</div>' +
        '<div class="wtable__cell wtable__ops">' +
          '<button type="button" class="btn btn--xs" data-act="word-edit" data-id="' + w.id + '" aria-label="编辑 ' + esc(title) + '">编辑</button>' +
          '<button type="button" class="btn btn--xs" data-act="word-delete" data-id="' + w.id + '" aria-label="删除 ' + esc(title) + '">删除</button>' +
        '</div></div>';
    }).join('');
    return '<div class="wtable">' + head + rows + '</div>';
  }

  function wordCards(list){
    if (!list.length) return '<p class="muted small">暂无词条。</p>';
    var cards = list.map(function (w) {
      var title = wordTitle(w);
      return '<div class="wcard' + (w.enabled ? '' : ' is-off') + '" data-word="' + w.id + '">' +
        '<div class="wcard__head"><span class="wcard__title" title="' + esc(title) + '">' + esc(title) + '</span>' +
          (w.sample ? '<span class="tag">示例</span>' : '') +
          miniSwitch('data-word-enabled="' + w.id + '"', w.enabled, '启用 ' + title) + '</div>' +
        '<div class="wcard__sub">' + esc(wordSub(w)) + '</div>' +
        '<div class="wcard__acts">' +
          '<button type="button" class="btn btn--xs" data-act="word-edit" data-id="' + w.id + '" aria-label="编辑 ' + esc(title) + '">编辑</button>' +
          '<button type="button" class="btn btn--xs" data-act="word-delete" data-id="' + w.id + '" aria-label="删除 ' + esc(title) + '">删除</button>' +
        '</div></div>';
    }).join('');
    return '<div class="wcards">' + cards + '</div>';
  }

  function inlineEditor(w){
    var draft = (state.inline && state.inline.id === w.id) ? state.inline : null;
    var d = draft ? draft.draft : { code:w.code, content:w.content, pinyin:w.pinyin };
    var isShort = w.kind === 'shortcode';
    var msg = draft ? (draft.msg || '') : '';
    var fields = isShort
      ? '<div class="wfield"><label class="wfield__label">编码（小写字母，1–32 个）</label>' +
          '<input class="input mono" data-inline="code" value="' + esc(d.code) + '" autocomplete="off" spellcheck="false"></div>' +
        '<div class="wfield wfield--wide"><label class="wfield__label">内容（原样上屏，可含空格换行，≤512 字符）</label>' +
          '<textarea class="textarea" rows="2" data-inline="content">' + esc(d.content) + '</textarea></div>'
      : '<div class="wfield"><label class="wfield__label">内容（1–16 个汉字）</label>' +
          '<input class="input" data-inline="content" value="' + esc(d.content) + '" autocomplete="off"></div>' +
        '<div class="wfield"><label class="wfield__label">读音（每字一个音节）</label>' +
          '<div class="field__row"><input class="input mono" data-inline="pinyin" value="' + esc(d.pinyin) + '" autocomplete="off">' +
          '<button type="button" class="btn btn--sm" data-act="inline-pinyin">自动读音</button></div></div>';
    return '<div class="wordedit" data-edit="' + w.id + '">' +
      '<div class="wordedit__grid">' + fields + '</div>' +
      '<p class="wordedit__msg" data-role="inlineMsg"' + (msg ? '' : ' hidden') + '>' + esc(msg) + '</p>' +
      '<div class="wordedit__foot">' +
        '<button type="button" class="btn btn--sm" data-act="inline-cancel" data-id="' + w.id + '">取消</button>' +
        '<button type="button" class="btn btn--sm btn--primary" data-act="inline-save" data-id="' + w.id + '">保存</button>' +
      '</div></div>';
  }

  function wordsInline(list){
    if (!list.length) return '<p class="muted small">暂无词条。</p>';
    var html = '';
    list.forEach(function (w, i) {
      html += wordRow(w, i, list.length);
      if (state.inline && state.inline.id === w.id) html += inlineEditor(w);
    });
    return '<div class="words">' + html + '</div>';
  }
  function wordsList(list){
    if (!list.length) return '<p class="muted small">暂无词条。</p>';
    return '<div class="words">' + list.map(function (w, i) { return wordRow(w, i, list.length); }).join('') + '</div>';
  }
  function wordsPanelBody(kind){
    var meta = WORD_META[kind];
    var list = state.words.filter(function (w) { return w.kind === kind; });
    var body;
    if (state.axes.words === 'w2') body = wordTable(list);
    else if (state.axes.words === 'w3') body = wordCards(list);
    else if (state.axes.words === 'w4') body = wordsInline(list);
    else body = wordsList(list);
    return '<p class="muted small">' + meta.desc + '</p>' +
      '<p class="sample-note">真实出厂为空表；带「示例」小标记的行只在本原型出现，用于展示信息密度。</p>' +
      body +
      '<div class="inline"><button type="button" class="btn" data-act="word-add" data-kind="' + kind + '">' + meta.add + '</button></div>';
  }

  /* ==================================================================
     轴四：快捷键录入（k1 内联 / k2 弹层）
     ================================================================== */
  function cloneMods(mods){
    return { control:!!mods.control, alt:!!mods.alt, shift:!!mods.shift, meta:!!mods.meta };
  }
  function hasMods(mods){
    return !!(mods && (mods.control || mods.alt || mods.shift || mods.meta));
  }
  function modSymbols(mods){
    var out = '';
    for (var i = 0; i < MOD_ORDER.length; i++) if (mods && mods[MOD_ORDER[i][0]]) out += MOD_ORDER[i][1];
    return out;
  }
  function keyLabel(key){
    if (!key) return '';
    var map = { ' ':'Space', Enter:'Return', Tab:'Tab', Escape:'Esc', Delete:'Delete', Backspace:'Backspace',
      ArrowLeft:'←', ArrowRight:'→', ArrowUp:'↑', ArrowDown:'↓' };
    if (map[key]) return map[key];
    if (/^F([1-9]|1[0-2])$/.test(key)) return key;
    if (key.length === 1) return /[a-z]/.test(key) ? key.toUpperCase() : key;
    return key;
  }
  function shortcutText(sc){
    if (!sc || !sc.key) return '未设置';
    return modSymbols(sc.mods) + keyLabel(sc.key);
  }
  function comboKey(sc){ return (sc.key || '') + '|' + MOD_ORDER.map(function (m) { return sc.mods[m[0]] ? '1' : '0'; }).join(''); }
  function conflictFor(target, mods, key){
    var probe = { mods:mods, key:key };
    var found = '';
    Object.keys(state.shortcuts).forEach(function (name) {
      if (name === target) return;
      var sc = state.shortcuts[name];
      if (sc.key && comboKey(sc) === comboKey(probe)) found = SHORTCUT_META[name].name;
    });
    return found;
  }

  function keyField(target){
    var sc = state.shortcuts[target];
    var meta = SHORTCUT_META[target];
    var rec = state.rec && state.rec.target === target ? state.rec : null;
    var err = state.keyErrors[target] || '';
    var msg = rec ? (rec.hint || '') : err;
    var msgCls = rec ? ' keyctl__msg--hint' : '';
    var html = '<div class="keyctl">';
    if (state.axes.keys === 'k1') {
      var body;
      if (rec) {
        body = '<span class="keyrec__hint">请按下快捷键…</span>' +
          '<span class="keyrec__mods" data-role="recMods">' + modSymbols(rec.mods) + '</span>';
      } else if (sc.key) {
        body = '<span class="keyrec__kbd"><kbd class="keychip">' + esc(shortcutText(sc)) + '</kbd></span>';
      } else {
        body = '<span class="keyrec__hint">未设置</span>';
      }
      html += '<button type="button" class="keyrec' + (rec ? ' is-rec' : '') + (sc.key ? '' : ' is-unset') +
        '" data-act="key-rec" data-target="' + target + '" aria-label="录制' + esc(meta.name) + '快捷键">' + body + '</button>' +
        '<button type="button" class="btn btn--xs" data-act="key-clear" data-target="' + target + '">清除</button>';
    } else {
      html += '<kbd class="keychip' + (sc.key ? '' : ' is-unset') + '">' + esc(shortcutText(sc)) + '</kbd>' +
        '<button type="button" class="btn btn--xs" data-act="key-open" data-target="' + target + '">更改…</button>';
    }
    if (msg) html += '<span class="keyctl__msg' + msgCls + '" data-role="keyMsg-' + target + '">' + esc(msg) + '</span>';
    html += '</div>';
    return html;
  }
  function paintKey(target){
    paintHost('keyHost-' + target, keyField(target));
  }
  function paintKeys(){
    Object.keys(SHORTCUT_META).forEach(paintKey);
  }
  function startRecording(target, modal){
    state.keyErrors[target] = '';
    state.rec = { target:target, mods:{ control:false, alt:false, shift:false, meta:false }, key:'', hint:'', modal:!!modal };
    if (modal) renderKeyModal();
    else paintKey(target);
  }
  function cancelRecording(){
    var rec = state.rec;
    if (!rec) return;
    state.rec = null;
    if (rec.modal) { state.keyModal = null; renderKeyModal(); return; }
    paintKey(rec.target);
  }
  function clearShortcut(target){
    state.rec = null;
    state.shortcuts[target] = { mods:{ control:false, alt:false, shift:false, meta:false }, key:'' };
    state.keyErrors[target] = '';
    if (state.keyModal) { state.keyModal.key = ''; state.keyModal.mods = cloneMods(state.shortcuts[target].mods); }
    paintKey(target);
    setStatus(SAVED);
  }

  function isValidRecordKey(key){
    if (!key) return false;
    if (key === ' ' || key.length === 1) return true;
    if (/^F([1-9]|1[0-2])$/.test(key)) return true;
    return key === 'Enter' || key === 'Tab' || key === 'Escape' || key === 'Delete' ||
      key === 'ArrowLeft' || key === 'ArrowRight' || key === 'ArrowUp' || key === 'ArrowDown';
  }
  function handleRecordKey(event){
    var rec = state.rec;
    if (!rec) return;
    if (event.repeat) { event.preventDefault(); return; }
    var isMod = event.key === 'Control' || event.key === 'Shift' || event.key === 'Alt' || event.key === 'Meta';
    var mods = { control:event.ctrlKey, alt:event.altKey, shift:event.shiftKey, meta:event.metaKey };
    if (isMod) {
      rec.mods = mods;
      event.preventDefault();
      if (rec.modal) renderKeyModal(); else paintKey(rec.target);
      return;
    }
    event.preventDefault();
    var bare = !hasMods(mods);
    if ((event.key === 'Backspace' || event.key === 'Delete') && bare) {
      clearShortcut(rec.target);
      if (rec.modal) { state.keyModal.cleared = true; renderKeyModal(); }
      return;
    }
    if (event.key === 'Escape' && bare) { cancelRecording(); return; }
    if (bare && event.key.length === 1 && /[a-z0-9]/i.test(event.key)) {
      rec.hint = '请加上修饰键，或改用 F1–F12';
      if (rec.modal) renderKeyModal(); else paintKey(rec.target);
      return;
    }
    if (!isValidRecordKey(event.key)) {
      rec.hint = '这个键不支持，请换一个';
      if (rec.modal) renderKeyModal(); else paintKey(rec.target);
      return;
    }
    var key = event.key === ' ' ? ' ' : (event.key.length === 1 && /[a-z]/.test(event.key) ? event.key.toUpperCase() : event.key);
    if (rec.modal) {
      state.keyModal.mods = cloneMods(mods);
      state.keyModal.key = key;
      state.keyModal.cleared = false;
      state.rec = null;
      state.keyModal.msg = '';
      renderKeyModal();
      return;
    }
    var clash = conflictFor(rec.target, mods, key);
    state.rec = null;
    if (clash) {
      state.keyErrors[rec.target] = '与「' + clash + '」冲突';
      paintKey(rec.target);
      setStatus('未写入：快捷键冲突（原型模拟）', 'idle');
      return;
    }
    state.keyErrors[rec.target] = '';
    state.shortcuts[rec.target] = { mods:cloneMods(mods), key:key };
    paintKey(rec.target);
    setStatus(SAVED);
  }

  function renderKeyModal(){
    var host = document.getElementById('overlayHost');
    if (!host) return;
    var m = state.keyModal;
    if (!m) { host.innerHTML = ''; return; }
    var meta = SHORTCUT_META[m.target];
    var rec = state.rec && state.rec.target === m.target ? state.rec : null;
    var liveMods = rec ? modSymbols(rec.mods) : '';
    var combo = m.key ? modSymbols(m.mods) + keyLabel(m.key) : '';
    var big, hint;
    if (rec) {
      big = liveMods || combo || '请按下快捷键…';
      hint = liveMods ? '请继续按下一个非修饰键；单独 Esc 取消' : '请按下快捷键…（只按修饰键不会结束；Esc 取消，Delete 清空）';
    } else {
      big = combo || '未设置';
      hint = m.key ? '已捕获；点此处可重新录制' : '未设置；点此处开始录制';
    }
    host.innerHTML = '<div class="overlay" data-act="key-backdrop">' +
      '<div class="sheet sheet--keys" role="dialog" aria-modal="true" aria-labelledby="keySheetTitle">' +
        '<h3 id="keySheetTitle">' + esc(meta.modal) + '</h3>' +
        '<div class="keypad' + (rec ? ' is-rec' : '') + '" id="keyPad" tabindex="0" data-act="key-pad" data-target="' + m.target + '">' +
          '<div class="keypad__combo" id="keyPadCombo">' + esc(big) + '</div>' +
          '<div class="keypad__hint" id="keyPadHint">' + esc(hint) + '</div>' +
        '</div>' +
        '<p class="sheet__msg' + (m.msg ? '' : ' sheet__msg--hint') + '" data-role="keySheetMsg"' + (m.msg ? '' : ' hidden') + '>' + esc(m.msg) + '</p>' +
        '<div class="sheet__actions">' +
          '<button type="button" class="btn" data-act="key-cancel">取消</button>' +
          '<button type="button" class="btn btn--primary" data-act="key-confirm">确定</button>' +
        '</div></div></div>';
    var pad = document.getElementById('keyPad');
    if (pad) pad.focus({ preventScroll:true });
    keepOverlayVisible();
  }
  function openKeyModal(target){
    state.keyErrors[target] = '';
    state.keyModal = {
      target:target,
      mods:cloneMods(state.shortcuts[target].mods),
      key:state.shortcuts[target].key,
      msg:'',
      cleared:false
    };
    startRecording(target, true);
  }
  function confirmKeyModal(){
    var m = state.keyModal;
    if (!m) return;
    var target = m.target;
    if (!m.key) {
      if (m.cleared) {
        state.shortcuts[target] = { mods:{ control:false, alt:false, shift:false, meta:false }, key:'' };
        state.keyErrors[target] = '';
        state.keyModal = null;
        renderKeyModal();
        paintKey(target);
        setStatus(SAVED);
        return;
      }
      m.msg = '请先按下一个快捷键，或用 Delete 清空。';
      renderKeyModal();
      return;
    }
    var clash = conflictFor(target, m.mods, m.key);
    if (clash) {
      state.keyErrors[target] = '与「' + clash + '」冲突';
      state.keyModal = null;
      renderKeyModal();
      paintKey(target);
      setStatus('未写入：快捷键冲突（原型模拟）', 'idle');
      return;
    }
    state.keyErrors[target] = '';
    state.shortcuts[target] = { mods:cloneMods(m.mods), key:m.key };
    state.keyModal = null;
    renderKeyModal();
    paintKey(target);
    setStatus(SAVED);
  }

  /* ==================================================================
     按应用默认英文 / 排除应用 · 同一套行列表 + 弹层选择器
     ================================================================== */
  function appListFor(scope){ return scope === 'excluded' ? state.excludedApps : state.apps; }
  function appByIdIn(scope, id){
    var list = appListFor(scope);
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function filterApps(list, query){
    var q = String(query || '').trim().toLowerCase();
    if (!q) return list;
    return list.filter(function (item) {
      return item.name.toLowerCase().indexOf(q) >= 0 || item.bundle.toLowerCase().indexOf(q) >= 0;
    });
  }
  function appSummaryFor(scope){
    var list = appListFor(scope);
    if (scope === 'excluded') return list.length ? list.length + ' 个应用已排除' : '0 个应用已排除';
    var total = list.length;
    if (!total) return '0 个应用';
    var on = 0;
    for (var i = 0; i < list.length; i++) if (list[i].enabled) on += 1;
    if (on === total) return total + ' 个应用 · 全部启用';
    return total + ' 个应用 · ' + on + ' 个启用';
  }
  function appIcon(item){
    return '<span class="appicon" style="--hue:' + item.hue + '" aria-hidden="true">' + esc(item.letter) + '</span>';
  }
  function appRow(item, scope){
    return '<div class="approw" data-app-row="' + item.id + '">' + appIcon(item) +
      '<div class="approw__text"><div class="approw__name" title="' + esc(item.name) + '">' + esc(item.name) + '</div>' +
      '<div class="approw__id" title="' + esc(item.bundle) + '">' + esc(item.bundle) + '</div></div>' +
      '<div class="approw__ctl">' +
      (scope === 'excluded' ? '' : miniSwitch('data-app-toggle="' + item.id + '"', item.enabled, item.name + ' 切入时默认英文')) +
      '<button type="button" class="iconbtn" data-act="app-remove" data-scope="' + scope + '" data-app-id="' + item.id +
        '" aria-label="移除 ' + esc(item.name) + '">×</button>' +
      '</div></div>';
  }
  function appListHTML(scope){
    var list = appListFor(scope);
    if (!list.length) {
      return '<div class="appempty">' + (scope === 'excluded'
        ? '尚未排除任何应用；加入后这些应用里不能用快速添加。'
        : '尚未添加应用。添加后，这些应用切入时默认英文。') + '</div>';
    }
    return '<div class="applist">' + list.map(function (item) { return appRow(item, scope); }).join('') + '</div>';
  }
  function appsPanelBody(scope){
    return '<p class="muted small applead">' + (scope === 'excluded' ? EXCLUDED_LEAD : APP_LEAD) + '</p>' +
      '<div class="apptoolbar"><span class="appcount" data-role="appSummary-' + scope + '">' + appSummaryFor(scope) + '</span>' +
