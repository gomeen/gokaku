  /* ==================================================================
     词条操作
     ================================================================== */
  function findWord(id){
    for (var i = 0; i < state.words.length; i++) if (state.words[i].id === id) return i;
    return -1;
  }
  function rebuildWords(ordered){
    var out = [];
    KINDS.forEach(function (kind) {
      var list = ordered[kind] || state.words.filter(function (w) { return w.kind === kind; });
      out = out.concat(list);
    });
    state.words = out;
  }
  function wordKind(id){
    var index = findWord(id);
    if (index < 0) return 'shortcode';
    return state.words[index].kind;
  }
  function paintWords(kind){
    paintHost('wordsHost-' + kind, wordsPanelBody(kind));
  }
  function moveWord(id, delta){
    var index = findWord(id);
    if (index < 0) return;
    var word = state.words[index];
    var sibs = state.words.filter(function (w) { return w.kind === word.kind; });
    var pos = sibs.indexOf(word);
    var to = pos + delta;
    if (to < 0 || to >= sibs.length) return;
    sibs.splice(pos, 1);
    sibs.splice(to, 0, word);
    var map = {};
    map[word.kind] = sibs;
    rebuildWords(map);
    if (state.inline && state.inline.id === id) state.inline.msg = '';
    paintWords(word.kind);
    setStatus(SAVED);
  }
  function deleteWord(id){
    var index = findWord(id);
    if (index < 0) return;
    var kind = state.words[index].kind;
    if (state.inline && state.inline.id === id) state.inline = null;
    state.words.splice(index, 1);
    paintWords(kind);
    setStatus(SAVED);
  }
  function validateWord(kind, draft){
    var code = (draft.code || '').trim();
    var content = draft.content || '';
    var pinyin = (draft.pinyin || '').trim();
    if (kind === 'shortcode') {
      if (!/^[a-z]{1,32}$/.test(code)) return '编码需为 1–32 个小写字母。';
      if (!content.trim()) return '内容不能为空。';
      if (content.length > 512) return '内容最多 512 个字符。';
    } else {
      if (!content.trim()) return '内容不能为空。';
      if (Array.from(content).length > 16) return '内容最多 16 个汉字。';
      if (!pinyin) return '读音不能为空，每字一个音节。';
    }
    return '';
  }
  function insertWord(word){
    var last = -1;
    for (var i = 0; i < state.words.length; i++) if (state.words[i].kind === word.kind) last = i;
    if (last < 0) state.words.push(word);
    else state.words.splice(last + 1, 0, word);
  }

  function openDialog(kind, id, trigger){
    var draft;
    if (id) {
      var index = findWord(id);
      if (index < 0) return;
      draft = {
        kind: state.words[index].kind,
        code: state.words[index].code,
        content: state.words[index].content,
        pinyin: state.words[index].pinyin
      };
      kind = draft.kind;
    } else {
      draft = { kind: kind, code:'', content:'', pinyin:'' };
    }
    dialog = { kind: kind, id: id || null, trigger: trigger || null };
    renderDialog(draft);
    var first = document.getElementById('f-code') || document.getElementById('f-content');
    if (first) { first.focus(); if (first.select) first.select(); }
  }
  function renderDialog(draft){
    var isShort = dialog.kind === 'shortcode';
    var html = '<div class="overlay" data-act="dialog-backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
      '<h3 id="sheetTitle">' + (isShort ? '编辑短码短语' : '编辑拼音词') + '</h3>';
    if (isShort) {
      html += '<div class="field"><label class="field__label" for="f-code">编码（小写字母，1–32 个）</label>' +
        '<input class="input mono" id="f-code" value="' + esc(draft.code) + '" autocomplete="off"></div>' +
        '<div class="field"><label class="field__label" for="f-content">内容（原样上屏，可含空格换行，≤512 字符）</label>' +
        '<textarea class="textarea" id="f-content" rows="4">' + esc(draft.content) + '</textarea></div>';
    } else {
      html += '<div class="field"><label class="field__label" for="f-content">内容（1–16 个汉字）</label>' +
        '<input class="input" id="f-content" value="' + esc(draft.content) + '" autocomplete="off"></div>' +
        '<div class="field"><label class="field__label" for="f-pinyin">读音（如 hui' + "'" + 'yi，每字一个音节）</label>' +
        '<div class="field__row"><input class="input mono" id="f-pinyin" value="' + esc(draft.pinyin) + '" autocomplete="off">' +
        '<button type="button" class="btn btn--sm" data-act="auto-pinyin">自动读音</button></div></div>';
    }
    html += '<p class="sheet__msg" data-role="sheetMsg" hidden></p>' +
      '<div class="sheet__actions"><button type="button" class="btn" data-act="dialog-cancel">取消</button>' +
      '<button type="button" class="btn btn--primary" data-act="dialog-save">保存</button></div>' +
      '</div></div>';
    var host = document.getElementById('overlayHost');
    if (!host) return;
    host.innerHTML = html;
  }
  function closeDialog(){
    var trigger = dialog ? dialog.trigger : null;
    dialog = null;
    var host = document.getElementById('overlayHost');
    if (host) host.innerHTML = '';
    if (trigger && trigger.isConnected) trigger.focus();
  }
  function sheetMsg(text, hint){
    var node = document.querySelector('[data-role="sheetMsg"]');
    if (!node) return;
    node.hidden = false;
    node.textContent = text;
    if (hint) node.classList.add('sheet__msg--hint');
    else node.classList.remove('sheet__msg--hint');
  }
  function saveDialog(){
    if (!dialog) return;
    var kind = dialog.kind;
    var codeNode = document.getElementById('f-code');
    var contentNode = document.getElementById('f-content');
    var pinyinNode = document.getElementById('f-pinyin');
    var draft = {
      code: codeNode ? codeNode.value : '',
      content: contentNode ? contentNode.value : '',
      pinyin: pinyinNode ? pinyinNode.value : ''
    };
    var error = validateWord(kind, draft);
    if (error) { sheetMsg(error); return; }
    var code = draft.code.trim();
    var pinyin = draft.pinyin.trim();
    if (dialog.id) {
      var index = findWord(dialog.id);
      if (index >= 0) {
        state.words[index].code = code;
        state.words[index].content = draft.content;
        state.words[index].pinyin = pinyin;
      }
    } else {
      seq += 1;
      insertWord({ id:'w' + seq, kind:kind, enabled:true, code:code, content:draft.content, pinyin:pinyin, sample:false });
    }
    closeDialog();
    renderWindow(true);
    setStatus(WORD_SAVED);
  }
  function autoPinyin(){
    var contentNode = document.getElementById('f-content');
    var content = contentNode ? contentNode.value : '';
    if (!content.trim()) { sheetMsg('先填写内容，再自动读音。', true); return; }
    sheetMsg('原型不连接读音词典，自动读音只在原生应用中可用。', true);
  }

  /* w4 内联编辑 */
  function openInline(id){
    var index = findWord(id);
    if (index < 0) return;
    var w = state.words[index];
    state.inline = { id:id, draft:{ code:w.code, content:w.content, pinyin:w.pinyin }, msg:'' };
    paintWords(w.kind);
    var first = document.querySelector('[data-edit="' + id + '"] [data-inline]');
    if (first) { first.focus(); if (first.select) first.select(); }
  }
  function closeInline(){
    if (!state.inline) return;
    var kind = wordKind(state.inline.id);
    state.inline = null;
    paintWords(kind);
  }
  function saveInline(){
    var s = state.inline;
    if (!s) return;
    var index = findWord(s.id);
    if (index < 0) { state.inline = null; return; }
    var w = state.words[index];
    var error = validateWord(w.kind, s.draft);
    if (error) {
      s.msg = error;
      paintWords(w.kind);
      return;
    }
    w.code = (s.draft.code || '').trim();
    w.content = s.draft.content || '';
    w.pinyin = (s.draft.pinyin || '').trim();
    state.inline = null;
    renderWindow(true);
    setStatus(WORD_SAVED);
  }
  function inlinePinyin(){
    var s = state.inline;
    if (!s) return;
    if (!String(s.draft.content || '').trim()) {
      s.msg = '先填写内容，再自动读音。';
      paintWords(wordKind(s.id));
      return;
    }
    s.msg = '原型不连接读音词典，自动读音只在原生应用中可用。';
    paintWords(wordKind(s.id));
  }

  /* ==================================================================
     渲染与局部更新
     ================================================================== */
  function captureSig(){
    var el = document.activeElement;
    if (!el || el === document.body || !el.getAttribute) return null;
    return {
      id: el.id || '',
      act: el.getAttribute('data-act') || '',
      fuzzy: el.getAttribute('data-fuzzy') || '',
      appId: el.getAttribute('data-app-id') || '',
      wordId: el.getAttribute('data-id') || '',
      page: el.getAttribute('data-page') || '',
      w: el.getAttribute('data-w') || '',
      target: el.getAttribute('data-target') || '',
      value: el.getAttribute('data-value') || '',
      key: el.getAttribute('data-key') || '',
      inline: el.getAttribute('data-inline') || ''
    };
  }
  function restoreSig(sig){
    if (!sig) return;
    var el = null;
    if (sig.id) el = document.getElementById(sig.id);
    if (!el && sig.inline) el = document.querySelector('[data-inline="' + sig.inline + '"]');
    if (!el && sig.key) el = document.querySelector('[data-key="' + sig.key + '"]');
    if (!el && sig.fuzzy) el = document.querySelector('[data-fuzzy="' + sig.fuzzy + '"]');
    if (!el && sig.act) {
      var sel = '[data-act="' + sig.act + '"]';
      if (sig.appId) sel += '[data-app-id="' + sig.appId + '"]';
      if (sig.wordId) sel += '[data-id="' + sig.wordId + '"]';
      if (sig.page) sel += '[data-page="' + sig.page + '"]';
      if (sig.w) sel += '[data-w="' + sig.w + '"]';
      if (sig.target) sel += '[data-target="' + sig.target + '"]';
      if (sig.value) sel += '[data-value="' + sig.value + '"]';
      el = document.querySelector(sel);
    }
    if (el && el.focus) el.focus({ preventScroll:true });
  }
  function paintHost(id, html){
    var host = document.getElementById(id);
    if (!host) return;
    var sig = host.contains && host.contains(document.activeElement) ? captureSig() : null;
    host.innerHTML = html;
    if (sig) restoreSig(sig);
  }

  function renderWindow(keepScroll){
    var body = document.getElementById('winBody');
    if (!body) return;
    var prev = body.querySelector('[data-role="scroller"]');
    var top = keepScroll && prev ? prev.scrollTop : 0;
    body.innerHTML = shellA();
    if (keepScroll) {
      var next = body.querySelector('[data-role="scroller"]');
      if (next) next.scrollTop = top;
    }
    fitStage();
  }

  function setStatus(text, tone){
    var nextTone = tone || 'saved';
    if (state.status === text && state.statusTone === nextTone) return;
    state.status = text;
    state.statusTone = nextTone;
    each('[data-role="statusText"]', function (n) { n.textContent = text; });
    each('.statusbar', function (b) { b.setAttribute('data-tone', state.statusTone); });
  }

  function setPage(id){
    var exists = false;
    for (var i = 0; i < PAGES.length; i++) if (PAGES[i].id === id) exists = true;
    if (!exists) return;
    resetTransient();
    state.page = id;
    state.status = IDLE;
    state.statusTone = 'idle';
    renderWindow(false);
    var scroller = document.querySelector('[data-role="scroller"]');
    if (scroller) scroller.scrollTop = 0;
  }

  function resetTransient(){
    state.rec = null;
    state.keyModal = null;
    state.appModal = null;
    state.inline = null;
    state.keyErrors = {};
    dialog = null;
    var host = document.getElementById('overlayHost');
    if (host) host.innerHTML = '';
  }

  function setAppearance(value){
    state.appearance = value;
    applyAppearance();
  }
  function applyAppearance(){
    var dark = state.appearance === 'dark' || (state.appearance === 'auto' && mq.matches);
    document.documentElement.setAttribute('data-appearance', dark ? 'dark' : 'light');
    each('[data-act="appearance"]', function (n) {
      n.setAttribute('aria-pressed', n.getAttribute('data-appearance') === state.appearance ? 'true' : 'false');
    });
  }
  function setWinSize(width, height){
    document.getElementById('window').setAttribute('data-win', width === 760 ? '760' : '900');
    each('[data-act="winsize"]', function (n) {
      n.setAttribute('aria-pressed', Number(n.getAttribute('data-w')) === width ? 'true' : 'false');
    });
    fitStage();
    if (state.appModal) keepOverlayVisible();
  }
  function fitStage(){
    var win = document.getElementById('window');
    var fit = document.getElementById('fit');
    var stage = document.getElementById('stage');
    if (!win || !fit || !stage) return;
    var w = win.offsetWidth;
    var h = win.offsetHeight;
    var available = stage.clientWidth;
    if (!available) return;
    var scale = Math.min(1, available / w);
    fit.style.width = w + 'px';
    fit.style.height = h + 'px';
    fit.style.transform = scale < 1 ? 'scale(' + scale + ')' : 'none';
    stage.style.height = Math.ceil(h * scale) + 'px';
  }
  function syncPad(){
    var bar = document.querySelector('.switcher');
    if (!bar) return;
    document.body.style.paddingBottom = Math.max(220, bar.offsetHeight + 28) + 'px';
  }
  function keepOverlayVisible(){
    var sheet = document.querySelector('.overlay .sheet');
    if (!sheet) return;
    var rect = sheet.getBoundingClientRect();
    var bar = document.querySelector('.switcher');
    var limit = window.innerHeight - (bar ? bar.offsetHeight : 0) - 12;
    if (rect.bottom > limit) window.scrollBy(0, rect.bottom - limit + 8);
    else if (rect.top < 12) window.scrollBy(0, rect.top - 12);
  }

  /* ==================================================================
     四条轴：URL、切换条、组合循环
     ================================================================== */
  function writeUrl(){
    try {
      var url = new URL(window.location.href);
      url.searchParams.set('size', state.axes.size);
      url.searchParams.set('display', state.axes.display);
      url.searchParams.set('words', state.axes.words);
      url.searchParams.set('keys', state.axes.keys);
      window.history.replaceState(null, '', url.href);
    } catch (err) { /* file:// 下可能被拒绝，忽略即可 */ }
  }
  function updateComboName(){
    var node = document.getElementById('comboName');
    if (node) node.textContent = comboNames();
  }
  function syncAxisButtons(){
    each('[data-act="axis"]', function (b) {
      var axis = b.getAttribute('data-axis');
      b.setAttribute('aria-pressed', state.axes[axis] === b.getAttribute('data-axis-id') ? 'true' : 'false');
    });
  }
  function applyAxes(render){
    document.documentElement.setAttribute('data-axes', comboCodes());
    syncAxisButtons();
    updateComboName();
    writeUrl();
    if (render) {
      resetTransient();
      renderWindow(true);
    }
  }
  function setAxis(axis, id){
    if (axisIndexOf(axis, id) < 0) return;
    if (state.axes[axis] === id) return;
    state.axes[axis] = id;
    applyAxes(true);
  }
  function comboIndex(){
    var index = 0;
    for (var i = 0; i < AXIS_ORDER.length; i++) {
      var axis = AXIS_ORDER[i];
      var list = axisList(axis);
      var pos = axisIndexOf(axis, state.axes[axis]);
      index = index * list.length + (pos < 0 ? 0 : pos);
    }
    return index;
  }
  function setCombo(index){
    var total = 1;
    for (var i = 0; i < AXIS_ORDER.length; i++) total *= axisList(AXIS_ORDER[i]).length;
    var n = ((index % total) + total) % total;
    for (var k = AXIS_ORDER.length - 1; k >= 0; k--) {
      var axis = AXIS_ORDER[k];
      var list = axisList(axis);
      var pos = n % list.length;
      n = Math.floor(n / list.length);
      state.axes[axis] = list[pos].id;
    }
    applyAxes(true);
  }
  function buildSwitchBar(){
    var host = document.getElementById('switcherInner');
    if (!host) return;
    host.innerHTML = AXIS_ORDER.map(function (axis, i) {
      var buttons = AXES[axis].map(function (item) {
        return '<button type="button" class="seg__btn" data-act="axis" data-axis="' + axis +
          '" data-axis-id="' + item.id + '" aria-pressed="false" title="' + esc(AXIS_LABEL[axis] + '：' + item.name) + '">' +
          item.seg + '</button>';
      }).join('');
      return '<div class="switcher__row"><span class="switcher__label">' + AXIS_LABEL[axis] + '</span>' +
        '<div class="seg" role="group" aria-label="' + esc(AXIS_LABEL[axis]) + '">' + buttons + '</div>' +
        (i === 0 ? '<span class="switcher__hint" aria-hidden="true">← → 依次切换组合</span>' : '') +
        '</div>';
    }).join('');
  }

  /* ==================================================================
     模糊音操作
     ================================================================== */
  function setAllFuzzy(all){
    if (all) FUZZY_ORDER.forEach(function (code) { state.fuzzy.add(code); });
    else state.fuzzy.clear();
    paintHost('fzHost', fuzzyPanel());
    setStatus(SAVED);
  }

  /* ==================================================================
     自检钩子（不参与界面）
     ================================================================== */
  window.__gogakuProto = {
    pages: PAGES.map(function (p) { return p.title; }),
    pageIds: PAGES.map(function (p) { return p.id; }),
    axes: AXES,
    axisOrder: AXIS_ORDER,
    fuzzyCodes: FUZZY_ORDER.slice(),
    groups: FUZZY_GROUPS.map(function (g) { return { id:g.id, name:g.name, codes:g.codes.slice() }; }),
    countText: fzCountText,
    fuzzyPanel: fuzzyPanel,
    renderSize: function (id) {
      if (axisIndexOf('size', id) >= 0) state.axes.size = id;
      return fontSizeBlock();
    },
    renderDisplay: function (id) {
      if (axisIndexOf('display', id) >= 0) state.axes.display = id;
      return displayBlock();
    },
    renderWords: function (id) {
      if (axisIndexOf('words', id) >= 0) state.axes.words = id;
      return wordsPanelBody('shortcode') + wordsPanelBody('pinyin');
    },
    renderKeys: function (id) {
      if (axisIndexOf('keys', id) >= 0) state.axes.keys = id;
      return keyField('mode') + keyField('direction') + keyField('quickAdd');
    },
    renderPage: function (id) { state.page = id; return shellA(); },
    renderPageBody: function (id) { state.page = id; return contentA(); },
    shortcutText: function (target) { return shortcutText(state.shortcuts[target]); },
    setFont: function (v) { state.fontSize = v; return fontSizeBlock(); },
    state: state
  };

  /* ---------- 初始化 ---------- */
  function init(){
    var params = new URLSearchParams(window.location.search);
    AXIS_ORDER.forEach(function (axis) {
      var value = params.get(axis);
      if (value && axisIndexOf(axis, value) >= 0) state.axes[axis] = value;
    });
    document.documentElement.setAttribute('data-theme', 'brand');
    document.documentElement.setAttribute('data-layout', 'rows');
    buildSwitchBar();
    applyAxes(false);
    applyAppearance();
    renderWindow(false);
    fitStage();
    syncPad();
    if (mq.addEventListener) mq.addEventListener('change', function () { if (state.appearance === 'auto') applyAppearance(); });
    window.addEventListener('resize', function () {
      fitStage();
      syncPad();
      if (state.appModal) keepOverlayVisible();
    });
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', function (event) {
    var el = event.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    switch (act) {
      case 'axis': setAxis(el.getAttribute('data-axis'), el.getAttribute('data-axis-id')); if (event.detail > 0) el.blur(); break;
      case 'appearance': setAppearance(el.getAttribute('data-appearance')); break;
      case 'winsize': setWinSize(Number(el.getAttribute('data-w')), Number(el.getAttribute('data-h'))); break;
      case 'page': setPage(el.getAttribute('data-page')); break;
      case 'step': setFont(state.fontSize + Number(el.getAttribute('data-delta'))); break;
      case 'font-set': setFont(Number(el.getAttribute('data-size'))); break;
      case 'disp-seg': setPreedit(el.getAttribute('data-value') === 'full'); break;
      case 'disp-card': setPreedit(el.getAttribute('data-value') === 'full'); break;
      case 'install': setStatus(SAVED); break;
      case 'refresh-resources':
      case 'refresh-records':
      case 'record-dismiss':
      case 'record-delete':
        setStatus(SAVED); break;
      case 'clear-freq': setStatus(CLEARED); break;
      case 'app-modal-open': openAppModal(el.getAttribute('data-scope') || 'default'); break;
      case 'app-modal-close': closeAppModal(); break;
      case 'app-modal-backdrop': if (event.target === el) closeAppModal(); break;
      case 'app-add': addApp(modalScope(), el.getAttribute('data-app-id')); break;
      case 'app-remove': removeApp(el.getAttribute('data-scope') || 'default', el.getAttribute('data-app-id')); break;
      case 'fuzzy-all': setAllFuzzy(true); break;
      case 'fuzzy-none': setAllFuzzy(false); break;
      case 'word-add': openDialog(el.getAttribute('data-kind'), null, el); break;
      case 'word-edit':
        if (state.axes.words === 'w4') openInline(el.getAttribute('data-id'));
        else openDialog(null, el.getAttribute('data-id'), el);
        break;
      case 'word-delete': deleteWord(el.getAttribute('data-id')); break;
      case 'word-up': moveWord(el.getAttribute('data-id'), -1); break;
      case 'word-down': moveWord(el.getAttribute('data-id'), 1); break;
      case 'inline-cancel': closeInline(); break;
      case 'inline-save': saveInline(); break;
      case 'inline-pinyin': inlinePinyin(); break;
      case 'dialog-cancel': closeDialog(); break;
      case 'dialog-save': saveDialog(); break;
      case 'auto-pinyin': autoPinyin(); break;
      case 'dialog-backdrop': if (event.target === el) closeDialog(); break;
      case 'key-rec':
        if (state.rec && state.rec.target === el.getAttribute('data-target')) cancelRecording();
        else startRecording(el.getAttribute('data-target'), false);
        break;
      case 'key-clear': clearShortcut(el.getAttribute('data-target')); break;
      case 'key-open': openKeyModal(el.getAttribute('data-target')); break;
      case 'key-cancel': state.keyModal = null; state.rec = null; renderKeyModal(); break;
      case 'key-confirm': confirmKeyModal(); break;
      case 'key-backdrop': if (event.target === el) { state.keyModal = null; state.rec = null; renderKeyModal(); } break;
      case 'key-pad': if (!state.rec) startRecording(el.getAttribute('data-target'), true); break;
    }
  });

  document.addEventListener('change', function (event) {
    var t = event.target;
    if (t.matches('input[type="radio"][data-key]')) {
      var key = t.getAttribute('data-key');
      state[key] = t.getAttribute('data-cast') === 'bool' ? t.value === 'true' : t.value;
      var group = t.closest('.radios');
      if (group) {
        var radios = group.querySelectorAll('.radio');
        for (var i = 0; i < radios.length; i++) {
          var input = radios[i].querySelector('input');
          radios[i].classList.toggle('is-on', !!(input && input.checked));
        }
      }
      setStatus(SAVED);
      return;
    }
    if (t.matches('input[data-preedit]')) {
      setPreedit(!t.checked);
      return;
    }
    if (t.matches('input[type="checkbox"][data-key]')) {
      state[t.getAttribute('data-key')] = t.checked;
      setStatus(SAVED);
      return;
    }
    if (t.matches('input[data-app-toggle]')) {
      var appItem = appByIdIn('default', t.getAttribute('data-app-toggle'));
      if (appItem) appItem.enabled = t.checked;
      syncAppSummary('default');
      setStatus(SAVED);
      return;
    }
    if (t.matches('input[data-fuzzy]')) {
      var code = t.getAttribute('data-fuzzy');
      if (t.checked) state.fuzzy.add(code); else state.fuzzy.delete(code);
      paintHost('fzHost', fuzzyPanel());
      setStatus(SAVED);
      return;
    }
    if (t.matches('input[data-word-enabled]')) {
      var index = findWord(t.getAttribute('data-word-enabled'));
      if (index >= 0) state.words[index].enabled = t.checked;
      var rowNode = t.closest('[data-word]');
      if (rowNode) rowNode.classList.toggle('is-off', !t.checked);
      setStatus(SAVED);
      return;
    }
    if (t.matches('select[data-key]')) {
      state[t.getAttribute('data-key')] = t.value;
      setStatus(SAVED);
    }
  });

  document.addEventListener('input', function (event) {
    var t = event.target;
    if (t.id === 'fontRange') { setFont(t.value); return; }
    if (t.matches('[data-inline]')) {
      if (!state.inline) return;
      state.inline.draft[t.getAttribute('data-inline')] = t.value;
      return;
    }
    if (t.matches('[data-role="app-search"]')) {
      state.queries.modal = t.value;
      refreshModalList(false);
      return;
    }
    if (!t.matches('[data-key]')) return;
    if (t.tagName !== 'TEXTAREA' && t.type !== 'text') return;
    state[t.getAttribute('data-key')] = t.value;
    setStatus(SAVED);
  });

  document.addEventListener('keydown', function (event) {
    if (state.rec) { handleRecordKey(event); return; }
    if (event.key === 'Escape') {
      if (state.keyModal) { state.keyModal = null; renderKeyModal(); return; }
      if (dialog) { closeDialog(); return; }
      if (state.appModal) { closeAppModal(); return; }
    }
    var target = event.target;
    if (target instanceof Element) {
      var card = target.closest('[role="radio"][data-act]');
      if (card && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        card.click();
        return;
      }
    }
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    if (event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
    if (dialog || state.appModal || state.keyModal) return;
    if (target instanceof Element && target.closest('input, textarea, select, option, button, a[href], [contenteditable]')) return;
    event.preventDefault();
    setCombo(comboIndex() + (event.key === 'ArrowLeft' ? -1 : 1));
  });

  var root = document.getElementById('winBody');
  if (root) init();
})();
</script>
</body>
</html>
