<!doctype html>
<html lang="zh-CN" data-theme="system" data-appearance="light" data-controls="native">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Gogaku 设置 · 布局 A 的主题与控件风格</title>
<style>
/* ==================================================================
   令牌：3 套主题 × 浅/深。属性和值都挂在 <html> 上。
   ================================================================== */
:root{
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --mono:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --dot-r:#ec6a5e; --dot-y:#f4bf4f; --dot-g:#61c554;
}

/* —— system（系统蓝） —— */
html[data-theme="system"][data-appearance="light"]{
  --stage:#e3e3e7;
  --win-bg:#f2f2f4;
  --titlebar:#e7e7ea;
  --side-bg:#ebebee;
  --panel:#ffffff;
  --border:#dcdce1;
  --border-strong:#c9c9d0;
  --hairline:#edecf0;
  --fg:#1d1d1f;
  --fg-2:#6e6e73;
  --fg-3:#8e8e93;
  --accent:#007aff;
  --accent-fg:#ffffff;
  --accent-text:#0a63c4;
  --accent-soft:rgba(0,122,255,.12);
  --accent-ring:rgba(0,122,255,.25);
  --switch-off:#d8d8dc;
  --knob:#ffffff;
  --ta-tint:rgba(0,122,255,.04);
  --btn-hover:#f4f4f7;
  --tag-bg:#f1f1f4;
  --ok:#1f8a4c;
  --shadow:0 18px 44px rgba(24,26,34,.16), 0 2px 8px rgba(24,26,34,.08);
}
html[data-theme="system"][data-appearance="dark"]{
  --stage:#17171a;
  --win-bg:#232326;
  --titlebar:#2c2c2e;
  --side-bg:#1f1f21;
  --panel:#2c2c2e;
  --border:#3a3a3c;
  --border-strong:#4a4a4d;
  --hairline:#35353a;
  --fg:#f5f5f7;
  --fg-2:#a1a1a6;
  --fg-3:#7c7c82;
  --accent:#0a84ff;
  --accent-fg:#ffffff;
  --accent-text:#64a9ff;
  --accent-soft:rgba(10,132,255,.18);
  --accent-ring:rgba(10,132,255,.3);
  --switch-off:rgba(255,255,255,.14);
  --knob:#ffffff;
  --ta-tint:rgba(255,255,255,.04);
  --btn-hover:#343437;
  --tag-bg:#343437;
  --ok:#4cc47f;
  --shadow:0 18px 44px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
}

/* —— brand（Gogaku 青绿） —— */
html[data-theme="brand"][data-appearance="light"]{
  --stage:#e5ece8;
  --win-bg:#f5f8f6;
  --titlebar:#e7efe9;
  --side-bg:#edf3ef;
  --panel:#ffffff;
  --border:#d8e3dc;
  --border-strong:#c2d2c9;
  --hairline:#e8f0ea;
  --fg:#1c2b25;
  --fg-2:#5b6f66;
  --fg-3:#7d8f86;
  --accent:#12996a;
  --accent-fg:#ffffff;
  --accent-text:#0d7a53;
  --accent-soft:rgba(18,153,106,.12);
  --accent-ring:rgba(18,153,106,.25);
  --switch-off:#d4e0d9;
  --knob:#ffffff;
  --ta-tint:rgba(18,153,106,.04);
  --btn-hover:#eef5f1;
  --tag-bg:#edf4f0;
  --ok:#1f8a4c;
  --shadow:0 18px 44px rgba(22,40,32,.16), 0 2px 8px rgba(22,40,32,.08);
}
html[data-theme="brand"][data-appearance="dark"]{
  --stage:#101713;
  --win-bg:#18211c;
  --titlebar:#1d2822;
  --side-bg:#141c17;
  --panel:#1f2a24;
  --border:#2e3d35;
  --border-strong:#3c4f45;
  --hairline:#263129;
  --fg:#edf4f0;
  --fg-2:#a7b8af;
  --fg-3:#7f9188;
  --accent:#34c48c;
  --accent-fg:#08150f;
  --accent-text:#5ad9a4;
  --accent-soft:rgba(52,196,140,.16);
  --accent-ring:rgba(52,196,140,.28);
  --switch-off:rgba(255,255,255,.14);
  --knob:#ffffff;
  --ta-tint:rgba(255,255,255,.04);
  --btn-hover:#26332c;
  --tag-bg:#22302a;
  --ok:#4cc47f;
  --shadow:0 18px 44px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
}

/* —— ink（石墨墨色，无彩色强调） —— */
html[data-theme="ink"][data-appearance="light"]{
  --stage:#e7e3db;
  --win-bg:#f6f4ef;
  --titlebar:#ebe7df;
  --side-bg:#f0ede5;
  --panel:#fbf9f4;
  --border:#d9d3c7;
  --border-strong:#c7bfb0;
  --hairline:#e6e1d6;
  --fg:#24221e;
  --fg-2:#5f5b53;
  --fg-3:#857f75;
  --accent:#23211d;
  --accent-fg:#f6f4ef;
  --accent-text:#23211d;
  --accent-soft:rgba(35,33,29,.09);
  --accent-ring:rgba(35,33,29,.22);
  --switch-off:#d6d0c4;
  --knob:#f6f4ef;
  --ta-tint:rgba(35,33,29,.045);
  --btn-hover:#efece4;
  --tag-bg:#efeae0;
  --ok:#2f7d4f;
  --shadow:0 18px 44px rgba(46,40,28,.18), 0 2px 8px rgba(46,40,28,.09);
}
html[data-theme="ink"][data-appearance="dark"]{
  --stage:#151412;
  --win-bg:#1e1d1b;
  --titlebar:#262421;
  --side-bg:#1a1917;
  --panel:#262421;
  --border:#3a3733;
  --border-strong:#4d4842;
  --hairline:#302d29;
  --fg:#f4f1ea;
  --fg-2:#b3aea4;
  --fg-3:#8b857b;
  --accent:#f4f1ea;
  --accent-fg:#1e1d1b;
  --accent-text:#f4f1ea;
  --accent-soft:rgba(244,241,234,.12);
  --accent-ring:rgba(244,241,234,.22);
  --switch-off:rgba(255,255,255,.14);
  --knob:#1e1d1b;
  --ta-tint:rgba(255,255,255,.04);
  --btn-hover:#2f2c28;
  --tag-bg:#2b2825;
  --ok:#7bc79b;
  --shadow:0 18px 44px rgba(0,0,0,.58), 0 2px 8px rgba(0,0,0,.42);
}

/* 外观共用的中性令牌（提示条、危险色、原型切换条） */
html[data-appearance="light"]{
  color-scheme:light;
  --warning-bg:#fcf3de;
  --warning-border:#e3cd97;
  --warning-fg:#6a4a10;
  --danger:#b3261e;
  --danger-soft:rgba(179,38,30,.08);
  --danger-line:rgba(179,38,30,.35);
  --scrim:rgba(24,20,12,.34);
  --sw-bg:rgba(250,250,251,.93);
  --sw-border:#d7d7db;
  --sw-panel:#ffffff;
  --sw-fg:#1d1d1f;
  --sw-fg-2:#6e6e73;
  --sw-on-bg:#1d1d1f;
  --sw-on-fg:#ffffff;
}
html[data-appearance="dark"]{
  color-scheme:dark;
  --warning-bg:#2a2215;
  --warning-border:#5c4a27;
  --warning-fg:#e8cd93;
  --danger:#ff6b5e;
  --danger-soft:rgba(255,107,94,.12);
  --danger-line:rgba(255,107,94,.4);
  --scrim:rgba(0,0,0,.55);
  --sw-bg:rgba(22,22,24,.92);
  --sw-border:#3a3a3c;
  --sw-panel:#2c2c2e;
  --sw-fg:#f5f5f7;
  --sw-fg-2:#a1a1a6;
  --sw-on-bg:#f5f5f7;
  --sw-on-fg:#1c1c1e;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--stage);
  color:var(--fg);
  font-family:var(--font);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:0 0 142px; /* 给底部固定切换条留出空间 */
}
h1,h2,h3,p{ margin:0; }
button{ font-family:inherit; }
[hidden]{ display:none !important; }

/* 统一焦点环：2px accent 25% 外环 + 1px accent 描边 */
:focus-visible{ outline:2px solid var(--accent-ring); outline-offset:2px; }

/* ==================================================================
   原型外壳
   ================================================================== */
.chrome{ max-width:948px; margin:0 auto; padding:26px 24px 0; }
.eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--fg-2);
}
h1{ font-size:25px; line-height:1.25; font-weight:650; letter-spacing:-.015em; margin:8px 0 14px; }
.notice{
  border:1px solid var(--warning-border); background:var(--warning-bg); color:var(--warning-fg);
  border-radius:9px; padding:10px 13px; font-size:12px; line-height:1.65;
}
.notice strong{ font-weight:650; }
.notice code{ font-family:var(--mono); font-size:11px; }

.proto{ max-width:948px; margin:16px auto 0; padding:0 24px; }
.proto__inner{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px;
  padding:8px 12px; border:1px dashed var(--border-strong); border-radius:8px;
}
.proto__label{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--fg-3); text-transform:uppercase; }
.proto__group{ display:flex; align-items:center; gap:8px; }
.proto__group--now{ margin-left:auto; }
.proto__name{ font-size:10.5px; color:var(--fg-2); }
.proto__now{
  font-family:var(--mono); font-size:10.5px; padding:3px 8px;
  border:1px solid var(--border); border-radius:6px; background:var(--win-bg); color:var(--fg);
  white-space:nowrap;
}

.seg{ display:inline-flex; padding:2px; gap:2px; border:1px solid var(--border); border-radius:7px; background:var(--win-bg); }
.seg__btn{
  border:0; background:transparent; color:var(--fg-2); cursor:pointer;
  font-size:11.5px; padding:3px 9px; border-radius:5px; line-height:1.4;
}
.seg__btn:hover{ color:var(--fg); }
.seg__btn[aria-pressed="true"]{ background:var(--fg); color:var(--win-bg); }

.stage-outer{ max-width:948px; margin:18px auto 0; padding:0 24px 8px; }
.stage{ display:flex; justify-content:center; overflow:hidden; }
.stage__fit{ transform-origin:top center; }

/* 窗口卡片 */
.window{
  position:relative; display:flex; flex-direction:column;
  width:900px; height:620px;
  background:var(--win-bg); border:1px solid var(--border); border-radius:11px;
  box-shadow:var(--shadow); overflow:hidden;
}
.window[data-win="760"]{ width:760px; height:520px; }
.titlebar{
  flex:0 0 38px; display:flex; align-items:center; gap:7px;
  padding:0 13px; background:var(--titlebar); border-bottom:1px solid var(--border);
  position:relative;
}
.dot{ width:11px; height:11px; border-radius:50%; display:block; }
.dot--r{ background:var(--dot-r); } .dot--y{ background:var(--dot-y); } .dot--g{ background:var(--dot-g); }
.titlebar__title{
  position:absolute; left:50%; transform:translateX(-50%);
  font-size:12px; font-weight:600; color:var(--fg-2); letter-spacing:.01em;
}
.window__body{ flex:1 1 auto; min-height:0; position:relative; overflow:hidden; }

/* 底部两行分段切换条：中性表面，不随主题染色 */
.switcher{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--sw-bg); border-top:1px solid var(--sw-border);
  box-shadow:0 -8px 24px rgba(0,0,0,.10);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.switcher__inner{
  max-width:948px; margin:0 auto; padding:9px 24px 11px;
  display:flex; flex-direction:column; gap:7px;
}
.switcher__row{ display:flex; align-items:center; gap:12px; min-width:0; }
.switcher__label{
  flex:0 0 auto; min-width:26px; font-size:10.5px; font-weight:600;
  letter-spacing:.08em; color:var(--sw-fg-2);
}
.switcher .seg{ background:var(--sw-panel); border-color:var(--sw-border); }
.switcher .seg__btn{ color:var(--sw-fg-2); padding:4px 12px; font-size:12px; }
.switcher .seg__btn:hover{ color:var(--sw-fg); }
.switcher .seg__btn[aria-pressed="true"]{ background:var(--sw-on-bg); color:var(--sw-on-fg); }
.switcher__hint{
  margin-left:auto; flex:0 0 auto; font-family:var(--mono); font-size:10.5px;
  color:var(--sw-fg-2); letter-spacing:.04em; white-space:nowrap;
}

/* ==================================================================
   布局 A：200pt 文字侧栏 + 单列分组
   ================================================================== */
.shell{ height:100%; }
.shell--a{ display:grid; grid-template-columns:200px minmax(0,1fr); }
.side{
  background:var(--side-bg); border-right:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0;
}
.side__title{ font-size:14px; font-weight:600; letter-spacing:-.01em; padding:18px 16px 10px; }
.nav{ display:flex; flex-direction:column; gap:1px; padding:0 8px; overflow-y:auto; }
.nav__item{
  border:0; background:transparent; text-align:left; cursor:pointer;
  font-size:13px; color:var(--fg); line-height:1.4;
  padding:6px 10px; border-radius:6px;
}
.nav__item:hover{ background:rgba(127,127,127,.13); }
.nav__item[aria-current="page"]{ background:var(--accent-soft); color:var(--accent-text); font-weight:600; }
/* ink：选中态按规范用实心墨底 + 纸色文字；深色下自动反相 */
html[data-theme="ink"] .nav__item[aria-current="page"]{ background:var(--accent); color:var(--accent-fg); }
.nav__item:focus-visible{ outline-offset:-1px; box-shadow:inset 0 0 0 1px var(--accent); }
.side__foot{ margin-top:auto; padding:12px 16px 14px; display:flex; flex-direction:column; gap:3px; }
.side__meta{ font-size:11px; color:var(--fg-2); }
.side__ver{ font-family:var(--mono); font-size:10px; color:var(--fg-3); }

.main{ display:flex; flex-direction:column; min-width:0; min-height:0; }
.pagehead{ flex:0 0 auto; padding:22px 26px 14px; }
.pagehead h2{ font-size:22px; font-weight:600; letter-spacing:-.015em; }
.pagehead p{ margin-top:6px; font-size:12px; color:var(--fg-2); }
.scroller{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:2px 26px 18px; }

/* 层次：section 15/600，与上一组留 18px 上间距 */
.section__title{ font-size:15px; font-weight:600; letter-spacing:-.005em; }
.section__lead{ font-size:12px; color:var(--fg-2); margin:5px 0 10px; line-height:1.55; }
.section + .section{ margin-top:18px; }
.hr{ border:0; border-top:1px solid var(--hairline); margin:18px 0; }

.panel{ border:1px solid var(--border); border-radius:9px; background:var(--panel); margin:0; }
.panel + .panel{ margin-top:18px; }
.panel__title{ font-size:12.5px; font-weight:600; padding:12px 14px 0; letter-spacing:.01em; }
.panel__body{ padding:2px 14px 10px; }

/* 行：单行垂直居中；带副说明顶对齐，控件对齐标签首行 */
.row{ display:flex; align-items:center; gap:16px; min-height:44px; padding:9px 0; }
.row + .row{ border-top:1px solid var(--hairline); }
.row--detail{ align-items:flex-start; padding:11px 0; }
.row__text{ flex:1 1 auto; min-width:0; }
.row__label{ font-size:13px; line-height:1.45; }
/* 候选字号数字：强调色 + 加粗 + 等宽数字，做视觉锚点（DOM 不变） */
.row__label [data-role="fontsize"]{
  color:var(--accent-text); font-weight:600; font-variant-numeric:tabular-nums;
}
.row__detail{ font-size:11px; line-height:1.5; color:var(--fg-2); margin-top:3px; }
.row__control{
  flex:0 0 auto; display:flex; align-items:center; justify-content:flex-end;
  gap:8px; min-height:19px; /* 19px = 标签首行行高，控件中心与首行中心对齐 */
}

.a-scheme{ padding-bottom:2px; }
.a-scheme .muted{ margin-top:8px; }
.subblock{ margin-top:12px; border-top:1px solid var(--hairline); padding-top:10px; }
.subhead{ font-size:12px; font-weight:600; margin:0 0 8px; }
.muted{ color:var(--fg-2); }
.small{ font-size:11px; line-height:1.55; }
.mono{ font-family:var(--mono); }
.body-text{ font-size:12.5px; line-height:1.6; margin-bottom:8px; }
.caption{ font-size:10.5px; color:var(--fg-3); letter-spacing:.04em; margin:12px 0 6px; }
.sample-note{
  font-size:11px; color:var(--fg-2); line-height:1.5;
  background:var(--tag-bg); border-radius:6px; padding:5px 8px; margin:6px 0 8px;
}
.tag{
  display:inline-block; font-size:9.5px; line-height:1.5; padding:0 4px; margin-left:5px;
  border-radius:4px; border:1px solid var(--warning-border); color:var(--warning-fg);
  background:var(--warning-bg); vertical-align:1px; letter-spacing:.02em; white-space:nowrap;
}
.inline{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 0 4px; }
.listhead{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.kbd{
  font-family:var(--mono); font-size:11.5px; color:var(--fg-2);
  border:1px solid var(--border); border-bottom-width:2px; border-radius:5px;
  padding:1px 6px; background:var(--tag-bg); white-space:nowrap;
}

/* 状态栏：左侧状态点 + 文案，右侧固定小字 */
.statusbar{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  padding:0 26px; min-height:36px;
  border-top:1px solid var(--border); background:var(--win-bg);
  font-size:11px; color:var(--fg-2);
}
.statusbar__dot{ flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:var(--fg-3); }
.statusbar[data-tone="saved"] .statusbar__dot{ background:var(--ok); }
.statusbar__text{ line-height:1.4; min-width:0; }
.statusbar__hint{ margin-left:auto; flex:0 0 auto; font-size:10.5px; color:var(--fg-3); white-space:nowrap; }

/* ==================================================================
   基础控件（两套风格共用骨架，视觉差异在下方）
   ================================================================== */
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--border-strong); background:var(--panel); color:var(--fg);
  font-size:12px; line-height:1; height:26px; padding:0 11px; border-radius:6px;
  cursor:pointer; white-space:nowrap;
}
.btn:hover{ background:var(--btn-hover); }
.btn:disabled{ opacity:.42; cursor:default; }
.btn--primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
.btn--primary:hover{ background:var(--accent); }
.btn--sm{ font-size:11.5px; height:24px; padding:0 9px; }
.btn--xs{ font-size:11px; height:22px; padding:0 8px; border-radius:5px; }

.switch{ position:relative; display:inline-flex; align-items:center; cursor:pointer; flex:0 0 auto; width:34px; height:20px; }
.switch input{ position:absolute; opacity:0; width:1px; height:1px; margin:0; }
.switch__ui{
  display:block; position:relative; width:34px; height:20px; flex:0 0 auto;
  border-radius:999px; background:var(--switch-off); transition:background .14s ease;
}
.switch__ui::after{
  content:""; position:absolute; top:2px; left:2px; width:16px; height:16px;
  border-radius:50%; background:var(--knob);
  box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .14s ease;
}
.switch input:checked + .switch__ui{ background:var(--accent); }
.switch input:checked + .switch__ui::after{ transform:translateX(14px); }
/* 迷你开关（词条启用）默认就锁到 30×18，不依赖控件风格属性 */
.switch--mini{ width:30px; height:18px; }
.switch--mini .switch__ui{ width:30px; height:18px; }
.switch--mini .switch__ui::after{ top:2px; left:2px; width:14px; height:14px; }
.switch--mini input:checked + .switch__ui::after{ transform:translateX(12px); }
.switch input:focus-visible + .switch__ui{
  outline:2px solid var(--accent-ring); outline-offset:2px;
  box-shadow:0 0 0 1px var(--accent);
}

.radios{ display:flex; flex-direction:column; gap:6px; }
.radio{ position:relative; display:inline-flex; align-items:center; gap:7px; font-size:12px; cursor:pointer; }
.radio input{ position:absolute; opacity:0; width:1px; height:1px; margin:0; }
.radio__ui{
  flex:0 0 auto; width:16px; height:16px; border-radius:50%;
  border:1px solid var(--border-strong); background:var(--panel);
  display:grid; place-items:center;
  transition:border-color .12s ease, background .12s ease;
}
.radio input:checked + .radio__ui{ border-color:var(--accent); }
.radio input:checked + .radio__ui::after{
  content:""; width:6px; height:6px; border-radius:50%; background:var(--accent);
}
.radio input:focus-visible + .radio__ui{ border-color:var(--accent); outline:2px solid var(--accent-ring); outline-offset:2px; }
.radio__label{ line-height:1.4; }

.chip input{ position:absolute; opacity:0; width:1px; height:1px; margin:0; }
.chip__box{
  flex:0 0 auto; width:14px; height:14px; border-radius:3.5px;
  border:1px solid var(--border-strong); background:var(--panel);
  display:grid; place-items:center;
}
.chip__box::after{
  content:""; width:3px; height:6px; border-radius:0;
  border-right:1.6px solid transparent; border-bottom:1.6px solid transparent;
  transform:rotate(45deg);
}
.chip input:checked + .chip__box{ background:var(--accent); border-color:var(--accent); }
.chip input:checked + .chip__box::after{ border-right-color:var(--accent-fg); border-bottom-color:var(--accent-fg); }
.chip input:focus-visible + .chip__box{ border-color:var(--accent); outline:2px solid var(--accent-ring); outline-offset:2px; }
.chip__label{ line-height:1; }

.stepper{ display:inline-flex; }
.stepper__btn{
  border:1px solid var(--border-strong); background:var(--panel);

}

.input,.textarea,.select{

.textarea.mono{ font-family:var(--mono); font-size:11.5px; line-height:1.5; }

/* 固定高度的内部滚动列表（两套风格都生效） */

.input:focus-visible,.textarea:focus-visible,.select:focus-visible{

/* ==================================================================
   轴二 · native：贴近 macOS 原生

html[data-controls="native"] .btn--sm{ height:22px; }
html[data-controls="native"] .btn--xs{ height:20px; padding:0 7px; border-radius:5px; }
html[data-controls="native"] .btn--primary{ height:24px; }

/* 开关 34×20，无描边，16px 旋钮（label 也锁死尺寸，避免被 flex 拉伸） */
html[data-controls="native"] .switch{ width:34px; height:20px; }
html[data-controls="native"] .switch__ui{ width:34px; height:20px; border:0; flex:0 0 auto; }
html[data-controls="native"] .switch__ui::after{ top:2px; left:2px; width:16px; height:16px; }
html[data-controls="native"] .switch input:checked + .switch__ui::after{ transform:translateX(14px); }
/* 词条启用：保留 switch 语义，缩成 30×18 迷你开关 */
html[data-controls="native"] .switch--mini{ width:30px; height:18px; }
html[data-controls="native"] .switch--mini .switch__ui{ width:30px; height:18px; }
html[data-controls="native"] .switch--mini .switch__ui::after{ top:2px; left:2px; width:14px; height:14px; }
html[data-controls="native"] .switch--mini input:checked + .switch__ui::after{ transform:translateX(12px); }

/* 单选 16px 圆环 + 6px 圆点 */
html[data-controls="native"] .radio__ui{ width:16px; height:16px; border-width:1px; }

/* 模糊音复选 14px 圆角方框 + 旋转 border 对勾 */
html[data-controls="native"] .chip__box{ width:14px; height:14px; border-radius:3.5px; }

/* 步进器：20px 宽，18px 高箭头竖排，中间 1px 分线，圆角 5 */
html[data-controls="native"] .stepper{

  border:1px solid var(--border-strong); border-radius:5px;

html[data-controls="native"] .stepper__btn:last-child{ border-radius:0 0 4px 4px; }
html[data-controls="native"] .stepper__btn + .stepper__btn{ border-top:1px solid var(--border); }
html[data-controls="native"] .stepper__btn::before{

}

/* 文本域：1px 描边 + 圆角 6 + 内阴影 */

}
html[data-controls="native"] .textarea:focus-visible{

}

/* ==================================================================

html[data-controls="card"] .panel{

}
html[data-controls="card"] .btn{

}
html[data-controls="card"] .btn--sm{ height:26px; padding:0 12px; }
html[data-controls="card"] .btn--xs{ height:24px; padding:0 9px; font-size:11px; border-radius:999px; }
html[data-controls="card"] .btn--primary{

}

}

}

/* 开关 38×22，无描边 */
html[data-controls="card"] .switch{ width:38px; height:22px; }
html[data-controls="card"] .switch__ui{ width:38px; height:22px; border:0; flex:0 0 auto; }
html[data-controls="card"] .switch__ui::after{ top:2px; left:2px; width:18px; height:18px; }
html[data-controls="card"] .switch input:checked + .switch__ui::after{ transform:translateX(16px); }
html[data-controls="card"] .switch--mini{ width:30px; height:18px; }
html[data-controls="card"] .switch--mini .switch__ui{ width:30px; height:18px; }
html[data-controls="card"] .switch--mini .switch__ui::after{ top:2px; left:2px; width:14px; height:14px; }

html[data-controls="card"] .radios{

}
html[data-controls="card"] .radio{

  border:1.5px solid var(--border); border-radius:10px; background:var(--panel);

}
html[data-controls="card"] .radio:hover{ border-color:var(--border-strong); }
html[data-controls="card"] .radio__ui{ display:none; }
html[data-controls="card"] .radio::after{

  width:16px; height:16px; border-radius:50%;

  transition:background .12s ease, border-color .12s ease;
}
html[data-controls="card"] .radio::before{
  box-sizing:border-box; content:""; position:absolute; z-index:1; top:14.5px; right:17.5px;

}
html[data-controls="card"] .radio.is-on{

}
html[data-controls="card"] .radio.is-on::after{ background:var(--accent); border-color:var(--accent); }
html[data-controls="card"] .radio.is-on::before{ opacity:1; }
html[data-controls="card"] .radio:has(input:focus-visible){

}

/* 模糊音变 pill chip，隐藏方框 */
html[data-controls="card"] .fuzzy{
  display:flex; flex-wrap:wrap; gap:7px 8px;
}
/* 含单选卡片的行改为上下排布，卡片占满宽度，避免在窄控件列里压成一条 */
html[data-controls="card"] .row:has(.row__control .radios){ display:block; }
html[data-controls="card"] .row:has(.row__control .radios) .row__control{
  display:block; margin-top:10px; width:100%;
}
html[data-controls="card"] .row .radios{
  grid-template-columns:repeat(2, minmax(0, 1fr));
}
html[data-controls="card"] .chip{
  height:26px; padding:0 13px; gap:0; border-radius:999px; flex:0 0 auto;
  background:var(--panel); border:1px solid var(--border);
  font-size:12px; justify-content:center;
}
html[data-controls="card"] .chip__box{ display:none; }
html[data-controls="card"] .chip.is-on{
  background:var(--accent); border-color:var(--accent); color:var(--accent-fg);
}
html[data-controls="card"] .chip:has(input:focus-visible){
  outline:2px solid var(--accent-ring); outline-offset:2px;
  box-shadow:0 0 0 1px var(--accent);
}

html[data-controls="card"] .stepper{ gap:6px; }
html[data-controls="card"] .stepper__btn{
  width:22px; height:22px; padding:0; border:0; border-radius:50%;
  background:var(--accent-soft); color:var(--accent-text); font-size:13px;
}
html[data-controls="card"] .stepper__btn:hover{ filter:brightness(.97); }
html[data-controls="card"] .stepper__btn:disabled{ opacity:.35; cursor:default; }

/* 文本域：无描边，主题微染底 */
html[data-controls="card"] .textarea{
  border:0; border-radius:10px; background:var(--ta-tint);
  padding:10px 12px; line-height:1.7; box-shadow:none;
}
html[data-controls="card"] .textarea.mono{ line-height:1.7; }
html[data-controls="card"] .textarea:focus-visible{
  outline:none; box-shadow:0 0 0 1px var(--accent), 0 0 0 3px var(--accent-ring);
}

/* 词条行：圆角 8，hover 浅强调底，操作按钮压到 24px */
html[data-controls="card"] .words{ gap:2px; }
html[data-controls="card"] .word{ padding:6px 8px; border-radius:8px; }
html[data-controls="card"] .word + .word{ border-top:0; }
html[data-controls="card"] .word:hover{ background:var(--accent-soft); }
html[data-controls="card"] .word__acts{ gap:5px; }
html[data-controls="card"] .word__acts .btn{ height:24px; padding:0 9px; font-size:11px; }

/* ==================================================================
   自定义词语 / 学习片段 / 编辑表单
   ================================================================== */
.words{ display:flex; flex-direction:column; margin:2px 0 6px; }
.word{ display:flex; align-items:center; gap:10px; padding:8px 0; }

.overlay-host{ position:absolute; inset:0; z-index:40; pointer-events:none; }

  /* ---------- 渲染 ---------- */
  function renderWindow(keepScroll){
    if (dialog) { dialog = null; document.getElementById('overlayHost').innerHTML = ''; }
    var body = document.getElementById('winBody');
    var prev = body.querySelector('[data-role="scroller"]');
    var top = keepScroll && prev ? prev.scrollTop : 0;
    body.innerHTML = shellA();
    if (keepScroll) {
      var next = body.querySelector('[data-role="scroller"]');
      if (next) next.scrollTop = top;
    }
    fitStage();
  }

  function setStatus(text, tone){
    var nextTone = tone || 'saved';
    if (state.status === text && state.statusTone === nextTone) return;
    state.status = text;
    state.statusTone = nextTone;
    var nodes = document.querySelectorAll('[data-role="statusText"]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = text;
    var bars = document.querySelectorAll('.statusbar');
    for (var j = 0; j < bars.length; j++) bars[j].setAttribute('data-tone', state.statusTone);
  }

  function setPage(id){
    var exists = false;
    for (var i = 0; i < PAGES.length; i++) if (PAGES[i].id === id) exists = true;
    if (!exists) return;
    state.page = id;
    state.status = IDLE;
    state.statusTone = 'idle';
    renderWindow(false);
    var scroller = document.querySelector('[data-role="scroller"]');
    if (scroller) scroller.scrollTop = 0;
  }

  function setAppearance(value){
    state.appearance = value;
    applyAppearance();
  }

  function applyAppearance(){
    var dark = state.appearance === 'dark' || (state.appearance === 'auto' && mq.matches);
    document.documentElement.setAttribute('data-appearance', dark ? 'dark' : 'light');
    var nodes = document.querySelectorAll('[data-act="appearance"]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].setAttribute('aria-pressed', nodes[i].getAttribute('data-appearance') === state.appearance ? 'true' : 'false');
    }
  }

  function setWinSize(width, height){
    document.getElementById('window').setAttribute('data-win', width === 760 ? '760' : '900');
    var nodes = document.querySelectorAll('[data-act="winsize"]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].setAttribute('aria-pressed', Number(nodes[i].getAttribute('data-w')) === width ? 'true' : 'false');
    }
    fitStage();
  }

  function fitStage(){
    var win = document.getElementById('window');
    var fit = document.getElementById('fit');
    var stage = document.getElementById('stage');
    var w = win.offsetWidth;
    var h = win.offsetHeight;
    var available = stage.clientWidth;
    if (!available) return;
    var scale = Math.min(1, available / w);
    fit.style.width = w + 'px';
    fit.style.height = h + 'px';
    fit.style.transform = scale < 1 ? 'scale(' + scale + ')' : 'none';
    stage.style.height = Math.ceil(h * scale) + 'px';
  }

  /* ---------- 主题 × 控件组合 ---------- */
  function writeUrl(){
    try {
      var url = new URL(window.location.href);
      url.searchParams.set('theme', state.theme);
      url.searchParams.set('controls', state.controls);
      window.history.replaceState(null, '', url.href);
    } catch (err) { /* file:// 下可能被拒绝，忽略即可 */ }
  }

  function updateComboName(){
    var theme = findById(THEMES, state.theme);
    var controls = findById(CONTROLS, state.controls);

    if (node && theme && controls) node.textContent = theme.name + ' · ' + controls.name;
  }

  function syncAxes(){
    var themeBtns = document.querySelectorAll('[data-act="theme"]');
    for (var i = 0; i < themeBtns.length; i++) {
      themeBtns[i].setAttribute('aria-pressed', themeBtns[i].getAttribute('data-theme-id') === state.theme ? 'true' : 'false');
    }
    var ctrlBtns = document.querySelectorAll('[data-act="controls"]');
    for (var j = 0; j < ctrlBtns.length; j++) {
      ctrlBtns[j].setAttribute('aria-pressed', ctrlBtns[j].getAttribute('data-controls-id') === state.controls ? 'true' : 'false');
    }
  }

  function applyCombo(themeId, controlsId, event, btn){
    if (!findById(THEMES, themeId) || !findById(CONTROLS, controlsId)) return;
    state.theme = themeId;
    state.controls = controlsId;
    document.documentElement.setAttribute('data-theme', themeId);
    document.documentElement.setAttribute('data-controls', controlsId);
    syncAxes();
    updateComboName();
    writeUrl();
    if (event && event.detail > 0 && btn) btn.blur();
  }

  function stepFont(delta){
    var next = Math.min(16, Math.max(12, state.fontSize + delta));
    if (next === state.fontSize) return;
    state.fontSize = next;
    var labels = document.querySelectorAll('[data-role="fontsize"]');
    for (var i = 0; i < labels.length; i++) labels[i].textContent = String(next);
    var buttons = document.querySelectorAll('[data-act="step"]');
    for (var j = 0; j < buttons.length; j++) {
      var d = Number(buttons[j].getAttribute('data-delta'));
      buttons[j].disabled = (d < 0 && next <= 12) || (d > 0 && next >= 16);
    }
    setStatus(SAVED);
  }

  function findWord(id){
    for (var i = 0; i < state.words.length; i++) if (state.words[i].id === id) return i;
    return -1;
  }

  function moveWord(id, delta){
    var index = findWord(id);
    if (index < 0) return;
    var word = state.words[index];
    var siblings = state.words.filter(function (w) { return w.kind === word.kind; });
    var pos = siblings.indexOf(word);
    var neighbor = siblings[pos + delta];
    if (!neighbor) return;
    var target = findWord(neighbor.id);
    state.words[index] = neighbor;
    state.words[target] = word;
    renderWindow(true);
    setStatus(SAVED);
  }
  function deleteWord(id){
    var index = findWord(id);
    if (index < 0) return;
    state.words.splice(index, 1);
    renderWindow(true);
    setStatus(SAVED);
  }

  /* ---------- 词条编辑表单 ---------- */
  function openDialog(kind, id, trigger){
    var draft;
    if (id) {
      var index = findWord(id);
      if (index < 0) return;
      draft = {
        kind: state.words[index].kind,
        code: state.words[index].code,
        content: state.words[index].content,
        pinyin: state.words[index].pinyin
      };
      kind = draft.kind;
    } else {
      draft = { kind: kind, code:'', content:'', pinyin:'' };
    }
    dialog = { kind: kind, id: id || null, trigger: trigger || null };
    renderDialog(draft);
    var first = document.getElementById('f-code') || document.getElementById('f-content');
    if (first) { first.focus(); if (first.select) first.select(); }
  }

  function renderDialog(draft){
    var isShort = dialog.kind === 'shortcode';
    var html = '<div class="overlay" data-act="dialog-backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
      '<h3 id="sheetTitle">' + (isShort ? '编辑短码短语' : '编辑拼音词') + '</h3>';
    if (isShort) {
      html += '<div class="field"><label class="field__label" for="f-code">编码（小写字母，1–32 个）</label>' +
        '<input class="input mono" id="f-code" value="' + esc(draft.code) + '" autocomplete="off"></div>' +
        '<div class="field"><label class="field__label" for="f-content">内容（原样上屏，可含空格换行，≤512 字符）</label>' +
        '<textarea class="textarea" id="f-content" rows="4">' + esc(draft.content) + '</textarea></div>';
    } else {
      html += '<div class="field"><label class="field__label" for="f-content">内容（1–16 个汉字）</label>' +
        '<input class="input" id="f-content" value="' + esc(draft.content) + '" autocomplete="off"></div>' +
        '<div class="field"><label class="field__label" for="f-pinyin">读音（如 hui' + "'" + 'yi，每字一个音节）</label>' +
        '<div class="field__row"><input class="input mono" id="f-pinyin" value="' + esc(draft.pinyin) + '" autocomplete="off">' +
        '<button type="button" class="btn btn--sm" data-act="auto-pinyin">自动读音</button></div></div>';
    }
    html += '<p class="sheet__msg" data-role="sheetMsg" hidden></p>' +
      '<div class="sheet__actions"><button type="button" class="btn" data-act="dialog-cancel">取消</button>' +
      '<button type="button" class="btn btn--primary" data-act="dialog-save">保存</button></div>' +
      '</div></div>';
    document.getElementById('overlayHost').innerHTML = html;
  }

  function closeDialog(){
    var trigger = dialog ? dialog.trigger : null;
    dialog = null;
    document.getElementById('overlayHost').innerHTML = '';
    if (trigger && trigger.isConnected) trigger.focus();
  }

  function sheetMsg(text, hint){
    var node = document.querySelector('[data-role="sheetMsg"]');
    if (!node) return;
    node.hidden = false;
    node.textContent = text;
    if (hint) node.classList.add('sheet__msg--hint');
    else node.classList.remove('sheet__msg--hint');
  }

  function saveDialog(){
    if (!dialog) return;
    var kind = dialog.kind;
    var codeNode = document.getElementById('f-code');
    var contentNode = document.getElementById('f-content');
    var pinyinNode = document.getElementById('f-pinyin');
    var code = codeNode ? codeNode.value.trim() : '';
    var content = contentNode ? contentNode.value : '';
    var pinyin = pinyinNode ? pinyinNode.value.trim() : '';

    if (kind === 'shortcode') {
      if (!/^[a-z]{1,32}$/.test(code)) { sheetMsg('编码需为 1–32 个小写字母。'); return; }
      if (!content.trim()) { sheetMsg('内容不能为空。'); return; }
      if (content.length > 512) { sheetMsg('内容最多 512 个字符。'); return; }
    } else {
      if (!content.trim()) { sheetMsg('内容不能为空。'); return; }
      if (Array.from(content).length > 16) { sheetMsg('内容最多 16 个汉字。'); return; }
      if (!pinyin) { sheetMsg('读音不能为空，每字一个音节。'); return; }
    }

    if (dialog.id) {
      var index = findWord(dialog.id);
      if (index >= 0) {
        state.words[index].code = code;
        state.words[index].content = content;
        state.words[index].pinyin = pinyin;
      }
    } else {
      seq += 1;
      state.words.push({ id:'w' + seq, kind:kind, enabled:true, code:code, content:content, pinyin:pinyin, sample:false });
    }
    closeDialog();
    renderWindow(true);
    setStatus(WORD_SAVED);
  }

  function autoPinyin(){
    var contentNode = document.getElementById('f-content');
    var content = contentNode ? contentNode.value : '';
    if (!content.trim()) { sheetMsg('先填写内容，再自动读音。', true); return; }
    sheetMsg('原型不连接读音词典，自动读音只在原生应用中可用。', true);
  }

  /* ---------- 切换条 ---------- */
  function buildAxis(hostId, act, items, idAttr){
    var host = document.getElementById(hostId);
    if (!host) return;
    host.innerHTML = items.map(function (item) {
      return '<button type="button" class="seg__btn" data-act="' + act + '" ' + idAttr + '="' + item.id +
        '" aria-pressed="false" title="' + esc(item.desc) + '">' + item.name + '</button>';
    }).join('');
  }

  /* ---------- 初始化 ---------- */
  function init(){
    var params = new URLSearchParams(window.location.search);
    var theme = params.get('theme');
    var controls = params.get('controls');
    if (findById(THEMES, theme)) state.theme = theme;
    if (findById(CONTROLS, controls)) state.controls = controls;
    document.documentElement.setAttribute('data-theme', state.theme);
    document.documentElement.setAttribute('data-controls', state.controls);
    buildAxis('themeOpts', 'theme', THEMES, 'data-theme-id');
    buildAxis('ctrlOpts', 'controls', CONTROLS, 'data-controls-id');
    syncAxes();
    updateComboName();
    applyAppearance();
    renderWindow(false);
    fitStage();
    writeUrl();
    if (mq.addEventListener) mq.addEventListener('change', function () { if (state.appearance === 'auto') applyAppearance(); });
    window.addEventListener('resize', fitStage);
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', function (event) {
    var el = event.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    switch (act) {
      case 'theme': applyCombo(el.getAttribute('data-theme-id'), state.controls, event, el); break;
      case 'controls': applyCombo(state.theme, el.getAttribute('data-controls-id'), event, el); break;
      case 'appearance': setAppearance(el.getAttribute('data-appearance')); break;
      case 'winsize': setWinSize(Number(el.getAttribute('data-w')), Number(el.getAttribute('data-h'))); break;
      case 'page': setPage(el.getAttribute('data-page')); break;
      case 'step': stepFont(Number(el.getAttribute('data-delta'))); break;
      case 'install': setStatus(SAVED); break;
      case 'refresh-resources':
      case 'refresh-records':
      case 'record-dismiss':
      case 'record-delete':
        setStatus(SAVED); break;
      case 'clear-freq': setStatus(CLEARED); break;
      case 'word-add': openDialog(el.getAttribute('data-kind'), null, el); break;
      case 'word-edit': openDialog(null, el.getAttribute('data-id'), el); break;
      case 'word-delete': deleteWord(el.getAttribute('data-id')); break;
      case 'word-up': moveWord(el.getAttribute('data-id'), -1); break;
      case 'word-down': moveWord(el.getAttribute('data-id'), 1); break;
      case 'dialog-cancel': closeDialog(); break;
      case 'dialog-save': saveDialog(); break;
      case 'auto-pinyin': autoPinyin(); break;
      case 'dialog-backdrop': if (event.target === el) closeDialog(); break;
    }
  });

  document.addEventListener('change', function (event) {
    var t = event.target;
    if (t.matches('input[type="radio"][data-key]')) {
      var key = t.getAttribute('data-key');
      state[key] = t.getAttribute('data-cast') === 'bool' ? t.value === 'true' : t.value;
      var group = t.closest('.radios');
      if (group) {
        var radios = group.querySelectorAll('.radio');
        for (var i = 0; i < radios.length; i++) {
          var input = radios[i].querySelector('input');
          radios[i].classList.toggle('is-on', !!(input && input.checked));
        }
      }
      setStatus(SAVED);
      return;
    }
    if (t.matches('input[type="checkbox"][data-key]')) {
      state[t.getAttribute('data-key')] = t.checked;
      setStatus(SAVED);
      return;
    }
    if (t.matches('input[type="checkbox"][data-fuzzy]')) {
      var pair = t.getAttribute('data-fuzzy');
      if (t.checked) state.fuzzy.add(pair); else state.fuzzy.delete(pair);
      var chip = t.closest('.chip');
      if (chip) chip.classList.toggle('is-on', t.checked);
      setStatus(SAVED);
      return;
    }
    if (t.matches('input[data-word-enabled]')) {
      var index = findWord(t.getAttribute('data-word-enabled'));
      if (index >= 0) state.words[index].enabled = t.checked;
      var rowNode = t.closest('.word');
      if (rowNode) rowNode.classList.toggle('is-off', !t.checked);
      setStatus(SAVED);
      return;
    }
    if (t.matches('select[data-key]')) {
      state[t.getAttribute('data-key')] = t.value;
      setStatus(SAVED);
    }
  });

  document.addEventListener('input', function (event) {
    var t = event.target;
    if (!t.matches('[data-key]')) return;
    if (t.tagName !== 'TEXTAREA' && t.type !== 'text') return;
    var value = t.value;
    if (t.classList.contains('keyinput')) {
      value = value.slice(0, 1).toLowerCase();
      if (t.value !== value) t.value = value;
    }
    state[t.getAttribute('data-key')] = value;
    setStatus(SAVED);
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && dialog) {
      closeDialog();
      return;
    }
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    if (event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
    if (dialog) return;
    var target = event.target;
    if (target instanceof Element && target.closest('input, textarea, select, option, button, a[href], [contenteditable]')) return;
    event.preventDefault();
    var index = -1;
    for (var i = 0; i < COMBOS.length; i++) {
      if (COMBOS[i][0] === state.theme && COMBOS[i][1] === state.controls) index = i;
    }
    if (index < 0) index = 0;
    var next = event.key === 'ArrowLeft' ? (index + COMBOS.length - 1) % COMBOS.length : (index + 1) % COMBOS.length;
    applyCombo(COMBOS[next][0], COMBOS[next][1]);
  });

  init();
})();
</script>
</body>
</html>
