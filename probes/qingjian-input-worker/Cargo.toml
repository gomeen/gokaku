[package]
name = "gogaku-qingjian-worker"
version = "0.1.0"
edition = "2024"
publish = false

# prepare-qingjian-input.py copies this project under /tmp and replaces
# @SOURCE@; upstream code/data and Cargo products never enter Gogaku.
[dependencies]
qingjian-core = { path = "@SOURCE@/crates/qingjian-core" }
qingjian-dictionary = { path = "@SOURCE@/crates/qingjian-dictionary" }
qingjian-lm = { path = "@SOURCE@/crates/qingjian-lm" }
serde_json = "=1.0.151"

[profile.release]
opt-level = 3
